name: Supabase keep-alive

# Pings the Boardside leaderboard database every 3 days so the
# free Supabase project never hits the 7-day inactivity pause.
# The URL and publishable key are already public in lb-config.js.

on:
  schedule:
    - cron: "0 14 */3 * *"   # every 3 days, ~8-9am Central
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # Leaderboards now need a signed-in account, so ping a tiny
          # read-only function that signed-out visitors may still call.
          curl -sS --fail-with-body -X POST "https://kugxnegnzikqwbmxadkj.supabase.co/rest/v1/rpc/qb_email_verified" \
            -H "apikey: sb_publishable_dUWbUHrSpZctTNT0vhPqag_Qw-PJlpb" \
            -H "Content-Type: application/json" \
            -d '{}' && echo && echo "Supabase pinged OK"
