  if (id === 'sex') { p.sex = t.value; $('#pbwO').textContent = fmt(sim.pbw(), 1) + ' kg'; updateTiles(); }
  if (id === 'dOn') { p.drive.on = t.checked; if (t.checked) { p.drive.entrain = 0; var en = $('#dEnt'); if (en) en.checked = false; } fire('drive', { on: t.checked }); }
  if (id === 'dEnt') { p.drive.entrain = t.checked ? 1 : 0; p.drive.on = t.checked ? true : $('#dOn').checked; if (t.checked) $('#dOn').checked = false; }
  if (id === 'uBal') { ui.balloon = t.checked; p.balloon = t.checked; renderMonitor(); fire('balloon', { on: t.checked }); }
  if (id === 'uPmus') { ui.showPmus = t.checked; fire('showPmus', { on: t.checked }); }
  if (id === 'uLoads') { ui.loads = t.checked; fire('loads', { on: t.checked }); }
  if (id === 'uBands') { ui.bands = t.checked; }
  if (id === 'xCard') { p.cardiac = t.checked ? 1 : 0; }
  if (id === 'xSec') { p.secretions = t.checked ? 1 : 0; }
  if (id === 'xDisc') { sim.disconnected = t.checked; if (!t.checked) sim.clear('disc'); renderStag(); renderAlarms(); fire('disconnect', { on: t.checked }); }
});

/* ───────── apply a configuration (lessons & presets) ───────── */
function applyConfig(cfg) {
  cfg = cfg || {};
  var keepSex = sim.p.sex, keepHt = sim.p.height;
  if (cfg.fresh !== false) {
    var p0 = VentSim.defaultPatient(); p0.drive.manualAmp = +$('#effAmp').value;
    sim.p = p0; sim.v = VentSim.defaultVent();
    sim.p.sex = keepSex; sim.p.height = keepHt;
  }
  if (cfg.preset) sim.applyPreset(cfg.preset);
  if (cfg.sex) sim.p.sex = cfg.sex; if (cfg.height) sim.p.height = cfg.height;
  if (cfg.patient) Object.assign(sim.p, cfg.patient);
  sim.p.drive = Object.assign({}, VentSim.defaultPatient().drive, { manualAmp: +$('#effAmp').value }, cfg.drive || {});
  if (cfg.vent) Object.assign(sim.v, cfg.vent);
  if (cfg.mode) sim.v.mode = cfg.mode;
  var u = cfg.ui || {};
  ui.balloon = !!u.balloon || sim.v.mode === 'off'; sim.p.balloon = ui.balloon; ui.showPmus = !!u.showPmus; ui.loads = !!u.loads; ui.bands = !!u.bands;
  sim.disconnected = false; sim.holdInspArm = false; sim.holdExpArm = false; $('#holdI').classList.remove('armed'); $('#holdE').classList.remove('armed');
  sim.reset(); buf = []; marks = []; lastPes = { ee: null, ei: null };
  ui.warming = true; sim.run(cfg.warm != null ? cfg.warm : 6, 1); ui.warming = false;   // settle
  buf = []; marks = [];
  ranges.lastFit = 0;
  setMode(sim.v.mode, true); renderPatient(); renderAlarms(); renderStag();
  if (ui.frozen) setFreeze(false);
}
window.VL.applyConfig = applyConfig; window.VL.setMode = setMode; window.VL.setVal = setVal; window.VL.toast = toast;

/* ───────── main loop ───────── */
var lastNow = performance.now(), monT = 0, running = true;
function frame(now) {
  requestAnimationFrame(frame);
  var dtw = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (!running) return;
  if (!ui.frozen) {
    var steps = Math.round(dtw / sim.dt);
    for (var i = 0; i < steps; i++) { var s = sim.step(); if (i % 5 === 0) buf.push(s); }
    var cut = sim.t - 21; var k = 0; while (k < buf.length && buf[k].t < cut) k++; if (k) buf.splice(0, k);
    if (marks.length > 60) marks.splice(0, marks.length - 60);
    fit(now);
  }
  drawScope();
  drawLung(); drawEqn(); updateBreatheUI();
  if (now - monT > 300) { monT = now; updateMonitor(); updateTiles(); alarmSound(now); fire('tick', {}); }
}
window.VL.pause = function () { running = false; };
window.VL.resume = function () { running = true; lastNow = performance.now(); };

/* ───────── tabs ───────── */
function setTab(tab) {
  ui.tab = tab;
  $$('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
  $('#lab').hidden = tab === 'game'; $('#game').hidden = tab !== 'game';
  $('#sidePatient').hidden = tab !== 'sim'; $('#sideLesson').hidden = tab !== 'learn';
  document.body.classList.toggle('learning', tab === 'learn'); document.body.classList.toggle('gaming', tab === 'game');
  if (tab === 'game') { window.VL.pause(); if (window.VLGame) window.VLGame.show($('#game')); }
  else { if (window.VLGame) window.VLGame.hide(); window.VL.resume(); }
  if (tab === 'learn') Lessons.open(); else Lessons.close();
  if (tab === 'sim') renderPatient();
  try { history.replaceState(null, '', tab === 'sim' ? location.pathname : '#' + tab); } catch (e) {}
  window.scrollTo(0, 0);
}
$$('.tabs button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });

/* ───────── lessons runner ───────── */
var Lessons = (function () {
  var L = window.VL_LESSONS || [], idx = store.get('lesson', 0), done = store.get('done', {}), revealed = {}, active = false, restartT = 0;
  if (idx >= L.length) idx = 0;
  function key(i, j) { return L[i].id + ':' + j; }
  function render() {
    var les = L[idx], box = $('#sideLesson'); if (!les) return;
    var sessions = []; L.forEach(function (x) { if (sessions.indexOf(x.session) < 0) sessions.push(x.session); });
    var opts = L.map(function (x, i) { var all = (x.tasks || []).every(function (t, j) { return done[key(i, j)]; }); return '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>' + (all && x.tasks && x.tasks.length ? '✓ ' : '') + (i + 1) + '. ' + esc(x.short || x.q) + '</option>'; });
    var prog = L.map(function (x, i) { var all = (x.tasks || []).length ? x.tasks.every(function (t, j) { return done[key(i, j)]; }) : !!done[x.id + ':seen']; return '<i class="' + (i === idx ? 'cur' : all ? 'done' : '') + '" title="' + (i + 1) + '"></i>'; }).join('');
    var shown = revealed[les.id] || les.open;
    box.innerHTML = '<div class="les-top"><select id="lesSel" aria-label="Choose a lesson">' + opts.join('') + '</select><button class="les-restart" type="button" id="lesRestart" title="Clear all progress and start from step 1">↺ Start over</button></div><div class="les-prog">' + prog + '</div>' +
      '<div class="les-sess">' + esc(les.session) + '</div><div class="les-obj">' + esc(les.objective || '') + '</div>' +
      (les.caseText ? '<div class="les-case">' + les.caseText + '</div>' : '') +
      '<div class="les-q">' + esc(les.q) + '</div>' +
      (shown ? '<div class="les-a">' + les.a + '</div>' : '<button class="reveal" type="button" id="revBtn">Think it through, then reveal the answer</button>') +
      (les.buttons && les.buttons.length ? '<div class="les-btns">' + les.buttons.map(function (b, j) { return '<button class="btn" type="button" data-lb="' + j + '">' + esc(b.label) + '</button>'; }).join('') + '</div>' : '') +
      (les.tasks && les.tasks.length ? '<div class="les-try">TRY IT ON THE VENTILATOR</div><ul class="tasks">' + les.tasks.map(function (t, j) { return '<li class="' + (done[key(idx, j)] ? 'done' : '') + '" data-j="' + j + '"><i></i><span>' + t.text + '</span></li>'; }).join('') + '</ul>' : '') +
      '<div class="les-nav"><button class="btn" type="button" id="lesPrev"' + (idx === 0 ? ' disabled' : '') + '>← Back</button><button class="btn" type="button" id="lesReset">Reset scene</button><button class="btn pri" type="button" id="lesNext"' + (idx === L.length - 1 ? ' disabled' : '') + '>Next →</button></div>' +
      '<p class="les-ref">From <i>How I Teach: the basics of mechanical ventilation</i> (Abdullah KM, et al. ATS Scholar 2026; Table 1 and Session 3 cases). Waveform method and terms from Mireles-Cabodevila E, Siuba MT, Chatburn RL. Respir Care 2022;67:129-148.</p>';
  }
  function load(i, keepScene) {
    idx = Math.max(0, Math.min(L.length - 1, i)); store.set('lesson', idx);
    var les = L[idx];
    if (!keepScene && les.config) applyConfig(les.config);
    done[les.id + ':seen'] = true; store.set('done', done);
    render();
    if (les.onEnter) try { les.onEnter(window.VL, sim); } catch (e) { console.error(e); }
  }
  function check(ev) {
    if (!active) return; var les = L[idx]; if (!les || !les.tasks) return;
    var changed = false;
    les.tasks.forEach(function (t, j) {
      var k = key(idx, j); if (done[k]) return;
      var ok = false; try { ok = t.test(ev, sim, ui); } catch (e) {}
      if (ok) { done[k] = true; changed = true; tone(1046, 0.09, 'sine', 0.06); tone(1568, 0.14, 'sine', 0.05, 0.09); }
    });
    if (changed) {
      store.set('done', done); render();
      var all = les.tasks.every(function (t, j) { return done[key(idx, j)]; });
      if (all) toast('<b>Nice.</b> ' + (les.doneMsg || 'Step complete. Hit Next when you’re ready.'), 'good');
    }
  }
  window.VL.on(check);
  $('#sideLesson').addEventListener('click', function (e) {
    if (e.target.id === 'revBtn') { revealed[L[idx].id] = true; render(); fire('reveal', {}); }
    if (e.target.id === 'lesNext') load(idx + 1);
    if (e.target.id === 'lesPrev') load(idx - 1);
    if (e.target.id === 'lesReset') load(idx);
    if (e.target.id === 'lesRestart') {
      var rb = e.target;
      if (!rb.classList.contains('arm')) { rb.classList.add('arm'); rb.textContent = 'Tap again to reset'; clearTimeout(restartT); restartT = setTimeout(function () { if (rb.isConnected) { rb.classList.remove('arm'); rb.textContent = '↺ Start over'; } }, 3000); return; }
      clearTimeout(restartT); done = {}; revealed = {}; store.set('done', done); load(0); toast('<b>Progress reset.</b> Starting again from step 1.', 'good');
    }
    var b = e.target.closest('[data-lb]'); if (b) { var bt = L[idx].buttons[+b.dataset.lb]; if (bt.config) applyConfig(bt.config); if (bt.run) bt.run(window.VL, sim); fire('lessonButton', { label: bt.label }); }
  });
  $('#sideLesson').addEventListener('change', function (e) { if (e.target.id === 'lesSel') load(+e.target.value); });
  return {
    open: function () { if (active) return; active = true; load(idx); },
    close: function () { active = false; }
  };
})();

/* ───────── help ───────── */
function openHelp() {
  var M = $('#helpModal');
  M.innerHTML = '<div class="mcard" style="max-width:820px"><div class="mhead"><div><h2 id="hTitle">How to use Vent Lab</h2><p>A ventilator attached to a digital single-compartment lung. Everything you see is computed from the equation of motion, so what you change is what you get.</p></div><button class="xbtn" type="button" data-x aria-label="Close">✕</button></div>' +
    '<div class="helpgrid"><div><b>Change settings.</b> Tap a tile, then turn the knob, scroll, use the arrow keys, or press + and −. Changes take effect on the next breath, like a real ventilator.</div>' +
    '<div><b>Be the patient.</b> Hold <b>Breathe IN</b> (or the <span class="kbd">space</span> bar) to contract your inspiratory muscles. You can’t hold forever: the ring is your stamina. Hold <b>Breathe OUT</b> (<span class="kbd">E</span>) for active expiration.</div>' +
    '<div><b>Measure.</b> <i>Insp hold</i> stops flow at end-inspiration to show plateau pressure. <i>Exp hold</i> closes both valves at end-expiration to show total PEEP (and auto-PEEP).</div>' +
    '<div><b>Read the screen.</b> <i>Freeze</i> (<span class="kbd">F</span>) stops the sweep; hover or tap the scalars to read any point. Turn on the esophageal balloon, Pmus, load shading and phase bands in the side panel.</div>' +
    '<div><b>Change the patient.</b> Pick ARDS, COPD, asthma, fibrosis, obesity or a plugged tube, or drag resistance and compliance yourself. Add spontaneous breathing, reverse triggering, a leak or cardiac oscillations.</div>' +
    '<div><b>Learn, then play.</b> <i>Learn the basics</i> walks through the curriculum step by step. The <i>Asynchrony Challenge</i> is a 5-minute scored game with a leaderboard.</div></div>' +
    '<p class="fine">For education only. A teaching model with simplified physiology (single compartment, no recruitment dynamics, estimated gas exchange); it is not a clinical decision tool.</p></div>';
  M.hidden = false; M.onclick = function (e) { if (e.target === M || e.target.closest('[data-x]')) M.hidden = true; };
}
$('#helpBtn').addEventListener('click', openHelp);
(function () {
  var fsBtn = $('#fsBtn'), de = document.documentElement;
  var req = de.requestFullscreen || de.webkitRequestFullscreen;
  var exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!req || !exit) return;
  var cur = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
  fsBtn.hidden = false;
  fsBtn.addEventListener('click', function () {
    try { var r = cur() ? exit.call(document) : req.call(de); if (r && r.catch) r.catch(function () {}); } catch (e) {}
    this.blur();
  });
  var sync = function () { var on = !!cur(); fsBtn.classList.toggle('on', on); fsBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Enter full screen'); fsBtn.title = on ? 'Exit full screen' : 'Full screen'; };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
})();

/* ───────── boot ───────── */
applyConfig({ mode: 'vc-cmv', vent: { VT: 0.45, RR: 16, PEEP: 5, flow: 60 }, warm: 2 });
renderMonitor();
requestAnimationFrame(frame);
var h = (location.hash || '').replace('#', '');
if (h === 'learn' || h === 'game') setTab(h);
if (!store.get('seenHelp', false)) { store.set('seenHelp', true); setTimeout(openHelp, 400); }
})();

</script>
