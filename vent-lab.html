<style>
:root{
  color-scheme:dark;
  --bg:#0b0f14; --bezel:#151b22; --bezel2:#1b232c; --edge:#2a3542; --edge2:#384656; --screen:#05090f;
  --ink:#e8eff6; --dim:#8c9daf; --dim2:#61717f; --teal:#3fe0d0; --teal2:#1fa99c; --amber:#ffb340; --red:#ff3b4e; --yel:#ffd23f; --green:#62e08a;
  --P:#ffc94a; --F:#3fe0d0; --V:#7be36b; --Pes:#e98bff; --pmus:#ff5470; --PL:#9fb3ff; --el:#6ec8ff; --res:#ff8c3c;
  --f-d:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif; --f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-b);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 700px at 85% -20%,rgba(63,224,208,.07),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,179,64,.05),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--edge);background:linear-gradient(180deg,#121920,#0d1318);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:0 0 auto}
.brand-mark{width:36px;height:36px;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1}
.brand-t small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.brand-t b{font-family:var(--f-d);font-weight:800;font-size:25px;letter-spacing:.06em;color:var(--ink)}
.brand-t b i{font-style:normal;color:var(--teal);margin-left:4px;text-shadow:0 0 14px rgba(63,224,208,.45)}
.tabs{display:flex;gap:4px;margin-left:14px;background:#0a0f14;border:1px solid var(--edge);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--dim);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs button[aria-selected=true]{background:var(--bezel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge2)}
.tabs button[data-tab=game][aria-selected=true]{background:linear-gradient(90deg,#3a1f0a,#2b1a0b);box-shadow:inset 0 0 0 1px #6a4313;color:#ffd7a0}
.tchip{font-family:var(--f-m);font-size:11px;background:rgba(255,179,64,.16);color:var(--amber);padding:2px 6px;border-radius:6px}
.top-r{margin-left:auto;display:flex;gap:8px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--edge);background:var(--bezel);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--dim)}
.ib:hover{color:var(--ink);border-color:var(--edge2)}
.ib.off .sw{display:none}
.ib .fs-out{display:none}
.ib.on .fs-in{display:none}
.ib.on .fs-out{display:block}

/* lab layout */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:minmax(0,1fr);gap:12px;padding:12px;flex:none;min-height:0;height:calc(100vh - 62px);height:calc(100dvh - 62px)}
.console{min-height:0}
.console{display:flex;flex-direction:column;gap:10px;min-width:0;background:linear-gradient(180deg,var(--bezel2),var(--bezel));border:1px solid var(--edge);border-radius:18px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.modebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modebtn{display:flex;align-items:center;gap:9px;background:#0b1117;border:1px solid var(--edge2);border-radius:12px;padding:7px 12px;cursor:pointer;min-height:44px}
.modebtn:hover{border-color:var(--teal2)}
.modebtn .ml{font-family:var(--f-d);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.modebtn .mname{font-family:var(--f-d);font-weight:700;font-size:20px;letter-spacing:.02em}
.modebtn .mtag{font-family:var(--f-m);font-size:12px;color:var(--teal);background:rgba(63,224,208,.1);border:1px solid rgba(63,224,208,.25);padding:2px 7px;border-radius:6px}
.alarmbar{flex:1 1 200px;min-width:160px;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:#0b1117;border:1px solid var(--edge);font-family:var(--f-d);font-weight:600;font-size:15px;letter-spacing:.03em;overflow:hidden}
.alarmbar .ok{color:var(--dim2);font-weight:500}
.alarmbar .al{padding:3px 9px;border-radius:7px;white-space:nowrap}
.alarmbar .al.hi{background:var(--red);color:#fff;animation:alblink 1s steps(2) infinite}
.alarmbar .al.med{background:var(--yel);color:#1a1300}
.alarmbar .al.info{background:#24303c;color:#cfe}
@keyframes alblink{50%{background:#7d1420}}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{background:#0f161d;border:1px solid var(--edge2);border-radius:10px;padding:0 12px;min-height:40px;font-weight:600;font-size:13px;cursor:pointer;color:#cfdbe6}
.tb:hover{border-color:var(--teal2);color:#fff}
.tb.armed{background:rgba(255,179,64,.15);border-color:var(--amber);color:var(--amber)}
.tb.freeze.on{background:var(--teal);color:#032;border-color:var(--teal)}
.seg{display:flex;border:1px solid var(--edge2);border-radius:10px;overflow:hidden}
.seg button{background:#0f161d;border:0;padding:0 10px;min-height:38px;font-family:var(--f-m);font-size:12px;color:var(--dim);cursor:pointer}
.seg button.on{background:#22303c;color:var(--ink)}

.screenwrap{display:grid;grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:minmax(0,1fr);gap:10px;flex:1 1 0;min-height:300px}
.screen{position:relative;background:var(--screen);border-radius:12px;border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 40px rgba(0,0,0,.8);overflow:hidden;min-height:340px}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%);border-radius:12px}
.stag{position:absolute;top:8px;right:10px;display:flex;gap:6px;pointer-events:none}
.stag span{font-family:var(--f-d);font-weight:700;font-size:12px;letter-spacing:.12em;padding:3px 8px;border-radius:6px;background:rgba(63,224,208,.15);color:var(--teal);border:1px solid rgba(63,224,208,.35)}
.stag span.amb{background:rgba(255,179,64,.15);color:var(--amber);border-color:rgba(255,179,64,.4)}
.readout{position:absolute;top:8px;left:54px;background:rgba(5,9,15,.92);border:1px solid var(--edge2);border-radius:8px;padding:6px 9px;font-family:var(--f-m);font-size:12px;line-height:1.45;pointer-events:none;white-space:nowrap}
.hud-pt{position:absolute;left:54px;bottom:8px;font-family:var(--f-m);font-size:11px;color:var(--dim2);pointer-events:none}

.monitor{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;scrollbar-width:thin}
.mg{background:#0b1117;border:1px solid var(--edge);border-radius:12px;padding:6px 10px}
.mg h4{margin:2px 0 3px;font-family:var(--f-d);font-weight:600;font-size:10.5px;letter-spacing:.16em;color:var(--dim2)}
.mv{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:1px 0}
.mv span{font-size:12px;color:var(--dim);white-space:nowrap}
.mv b{font-family:var(--f-d);font-weight:700;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.mv b small{font-size:11px;color:var(--dim2);font-weight:500;margin-left:2px}
.mv.big b{font-size:28px}
.mv b.P{color:var(--P)} .mv b.F{color:var(--F)} .mv b.V{color:var(--V)} .mv b.Pes{color:var(--Pes)} .mv b.PL{color:var(--PL)}
.mv b.warn{color:var(--red)!important;text-shadow:0 0 10px rgba(255,59,78,.4)}
.mv b.dim{color:var(--dim2)}
.mv.fresh b{animation:fresh 1.2s ease-out}
@keyframes fresh{0%{text-shadow:0 0 18px #fff}100%{text-shadow:none}}
.mg .note{font-size:10.5px;color:var(--dim2);margin:2px 0 1px;line-height:1.3}

/* settings */
.settings{display:flex;gap:10px;align-items:stretch}
.tiles{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:7px;align-content:start}
.tile{position:relative;background:linear-gradient(180deg,#1d2731,#141b22);border:1px solid var(--edge2);border-radius:12px;padding:6px 7px 5px;cursor:pointer;text-align:left;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;user-select:none;-webkit-user-select:none;touch-action:none;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:#4b5d70}
.tile .tl{font-family:var(--f-d);font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;letter-spacing:.04em;color:#b6c4d2;display:flex;justify-content:space-between;gap:4px}
.tile .tl em{font-style:normal;color:var(--dim2);font-weight:500}
.tile .tv{font-family:var(--f-d);font-weight:700;font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.tile .tu{font-size:11px;color:var(--dim);font-weight:500;margin-left:3px;font-family:var(--f-b)}
.tile .ts{font-size:10.5px;color:var(--dim2);min-height:13px}
.tile.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 22px rgba(255,179,64,.18);background:linear-gradient(180deg,#2b2416,#1b1710)}
.tile.sel .tv{color:var(--amber)}
.tile.bump .tv{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.07)}}
.tile .pm{display:none;position:absolute;right:5px;top:22px;flex-direction:column;gap:3px}
.tile.sel .pm{display:flex}
.tile .pm button{width:30px;height:24px;border-radius:7px;border:1px solid #6a4f22;background:#2a2112;color:var(--amber);font-weight:800;font-size:15px;line-height:1;cursor:pointer;padding:0}
.tile.toggle .tv{font-size:19px}
.tile .tt{position:absolute;right:5px;bottom:5px;font-size:10px;background:#0b1117;border:1px solid var(--edge2);border-radius:6px;padding:1px 6px;color:var(--teal);cursor:pointer;align-self:flex-start}
.knobwrap{width:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.knobwrap small{font-size:10.5px;color:var(--dim2);text-align:center;line-height:1.25}
.knob{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b4856,#151c23 70%);box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,255,255,.12),0 0 0 6px #10161c,0 0 0 7px var(--edge2);position:relative;cursor:grab;touch-action:none}
.knob:active{cursor:grabbing}
.knob:focus-visible{outline:2px solid var(--amber);outline-offset:8px}
.knob-cap{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2b3540,#11171d);box-shadow:inset 0 1px 1px rgba(255,255,255,.1)}
.knob-cap span{position:absolute;left:50%;top:5px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.knob::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0 1.5deg,transparent 1.5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 57px,#000 58px,#000 60px,transparent 61px);mask:radial-gradient(circle,transparent 57px,#000 58px,#000 60px,transparent 61px)}

/* side */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;scrollbar-width:thin;padding-bottom:12px}
.lungcard{background:linear-gradient(180deg,var(--bezel2),var(--bezel));border:1px solid var(--edge);border-radius:18px;padding:10px 10px 12px}
.lunghead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 4px}
.lunghead b{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.lunghead span{font-size:11px;color:var(--dim2)}
#lung{width:100%;height:236px;display:block;border-radius:12px;background:#0a0f15}
.eqn{margin:8px 2px 0;font-family:var(--f-m);font-size:12px}
.eqn .row{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:nowrap}
.eqn .term{display:flex;flex-direction:column;align-items:center;min-width:0}
.eqn .term small{font-family:var(--f-b);font-size:10px;color:var(--dim2);white-space:nowrap}
.eqn .term b{font-family:var(--f-d);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.eqn .op{color:var(--dim2);font-size:15px}
.eqn .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#0a0f15;margin-top:6px}
.eqn .bar i{display:block;height:100%;transition:width .08s linear}
.breathe-row{display:flex;gap:12px;align-items:center;margin-top:10px}
.breathe{position:relative;width:108px;height:108px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#1f6f68,#0d3a37 70%);box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.15);cursor:pointer;flex:0 0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.breathe svg{position:absolute;inset:0;transform:rotate(-90deg)}
.breathe .ring-bg{fill:none;stroke:rgba(0,0,0,.35);stroke-width:7}
.breathe .ring{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:0;transition:stroke .2s}
.breathe .bt{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.breathe .bt b{font-family:var(--f-d);font-weight:800;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.breathe .bt small{font-size:10px;color:#9fd8d1}
.breathe.on{background:radial-gradient(circle at 40% 35%,#ff7a8f,#9b1e33 70%);transform:scale(.97)}
.breathe.on .ring{stroke:#ffd0d8}
.breathe.tired .ring{stroke:var(--red)}
.breathe.cool{filter:grayscale(.8) brightness(.7)}
.breathe-side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.exhale{border:1px solid var(--edge2);background:#141c24;border-radius:12px;padding:9px 10px;font-weight:700;font-family:var(--f-d);letter-spacing:.06em;cursor:pointer;display:flex;justify-content:space-between;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.exhale small{font-family:var(--f-b);font-weight:500;font-size:10px;color:var(--dim2);letter-spacing:0}
.exhale.on{background:#3a2a10;border-color:var(--amber);color:var(--amber)}
.mini{font-size:11.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.mini input{width:100%}
input[type=range]{accent-color:var(--teal);height:22px}

.sidebody{background:linear-gradient(180deg,var(--bezel2),var(--bezel));border:1px solid var(--edge);border-radius:18px;padding:12px}
.sec{border-top:1px solid var(--edge);padding:10px 0 4px}
.sec:first-child{border-top:0;padding-top:0}
.sec>h3{margin:0 0 8px;font-family:var(--f-d);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.sec>h3 small{font-family:var(--f-b);letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim2);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--edge2);background:#10171e;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:#cdd8e3}
.chipb:hover{border-color:var(--teal2)}
.chipb.on{background:rgba(63,224,208,.14);border-color:var(--teal);color:var(--teal)}
.pnote{font-size:12px;color:var(--dim);margin:8px 0 2px;line-height:1.4}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;margin:6px 0}
.sl span{font-size:12.5px;color:#c4d0dc}
.sl output{font-family:var(--f-m);font-size:12px;color:var(--ink)}
.sl input{grid-column:1/-1;width:100%}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;color:#c9d5e1;cursor:pointer}
.sw-row small{display:block;font-size:11px;color:var(--dim2)}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:12px;background:#26313c;position:relative;cursor:pointer;flex:0 0 auto;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#9fb0c0;transition:transform .15s,background .15s}
.sw:checked{background:var(--teal2)}
.sw:checked::after{transform:translateX(17px);background:#fff}
.pbw{font-size:12px;color:var(--dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pbw select,.pbw input[type=number]{background:#0b1117;color:var(--ink);border:1px solid var(--edge2);border-radius:8px;padding:5px 6px;font:inherit;font-size:12.5px;width:auto}
.pbw b{color:var(--ink)}

/* lessons */
.les-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.les-top select{flex:1;min-width:0;background:#0b1117;color:var(--ink);border:1px solid var(--edge2);border-radius:10px;padding:8px;font:inherit;font-size:13px}
.les-restart{flex:0 0 auto;border:1px solid var(--edge2);background:#0b1117;color:var(--dim);border-radius:10px;padding:8px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.les-restart:hover{color:var(--ink);border-color:#4a5b6c}
.les-restart.arm{color:var(--amber);border-color:var(--amber);background:rgba(255,179,64,.1)}
.les-prog{display:flex;gap:3px;margin:0 0 10px;flex-wrap:wrap}
.les-prog i{height:5px;flex:1;min-width:6px;border-radius:3px;background:#24303c}
.les-prog i.done{background:var(--teal2)}
.les-prog i.cur{background:var(--amber)}
.les-sess{font-family:var(--f-d);font-weight:600;font-size:11.5px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.les-obj{font-size:12px;color:var(--dim);margin:2px 0 8px}
.les-q{font-family:var(--f-d);font-weight:700;font-size:21px;line-height:1.2;margin:4px 0 10px}
.les-a{font-size:14px;line-height:1.55;color:#d7e1ea;background:#0b1117;border:1px solid var(--edge);border-left:3px solid var(--teal);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.les-a p{margin:0 0 8px}.les-a p:last-child{margin:0}
.les-a b{color:#fff}
.les-a ul{margin:4px 0 6px;padding-left:18px}
.reveal{width:100%;border:1px dashed #4a5b6c;background:#0b1117;border-radius:10px;padding:14px;font-weight:600;color:var(--teal);cursor:pointer;margin-bottom:10px}
.reveal:hover{border-color:var(--teal)}
.tasks{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.4;background:#121a22;border:1px solid var(--edge);border-radius:10px;padding:8px 10px}
.tasks li i{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid #4a5b6c;margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:11px}
.tasks li.done{border-color:rgba(98,224,138,.4);background:rgba(98,224,138,.06)}
.tasks li.done i{border-color:var(--green);background:var(--green);color:#042}
.tasks li.done i::after{content:"✓";font-weight:800}
.tasks h5{margin:0;font-size:11px;letter-spacing:.14em;color:var(--dim2);font-family:var(--f-d)}
.les-try{font-family:var(--f-d);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--amber);margin:4px 0 6px}
.les-btns{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.les-nav{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.btn{border:1px solid var(--edge2);background:#141c24;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--teal2)}
.btn.pri{background:var(--teal);color:#042420;border-color:var(--teal)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.amb{background:var(--amber);color:#2a1700;border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:default}
.les-ref{font-size:11px;color:var(--dim2);margin-top:10px;line-height:1.4}
.les-ref a{color:var(--dim)}
.les-case{background:#121a22;border:1px solid var(--edge);border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.5;margin-bottom:10px}
.les-case ul{margin:4px 0;padding-left:18px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,6,10,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{width:min(1040px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#18212a,#11171d);border:1px solid var(--edge2);border-radius:20px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mcard h2{margin:0;font-family:var(--f-d);font-weight:800;font-size:26px;letter-spacing:.02em}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.mhead p{margin:4px 0 0;color:var(--dim);font-size:13.5px;max-width:640px}
.xbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--edge2);background:#0f161d;cursor:pointer;font-size:18px;flex:0 0 auto}
.taxkey{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.taxkey div{background:#0b1117;border:1px solid var(--edge);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--dim);line-height:1.45}
.taxkey b{display:block;color:var(--ink);font-family:var(--f-d);font-size:14px;letter-spacing:.04em;margin-bottom:2px}
.taxkey code{font-family:var(--f-m);color:var(--teal);font-size:11.5px}
.mgroup h3{font-family:var(--f-d);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--dim);margin:12px 0 8px;text-transform:uppercase}
.mgroup h3 small{font-family:var(--f-b);text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mcardi{text-align:left;border:1px solid var(--edge2);background:#0f161d;border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mcardi:hover{border-color:var(--teal2)}
.mcardi.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:#0e1c1e}
.mcardi .n{font-family:var(--f-d);font-weight:700;font-size:18px}
.mcardi .g{font-family:var(--f-m);font-size:12px;color:var(--teal)}
.mcardi .e{font-size:11.5px;color:var(--dim2);line-height:1.35}
.mdesc{margin-top:14px;background:#0b1117;border:1px solid var(--edge);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mdesc p{margin:0;flex:1 1 360px;font-size:13.5px;line-height:1.5;color:#d2dde7}
.mdesc p b{font-family:var(--f-d);font-size:16px}
.helpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.helpgrid div{background:#0b1117;border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#cfdae4}
.helpgrid b{color:#fff}
.kbd{font-family:var(--f-m);font-size:11.5px;border:1px solid var(--edge2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#141c24}

/* toasts */
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:rgba(12,18,24,.96);border:1px solid var(--edge2);border-left:4px solid var(--teal);border-radius:12px;padding:9px 13px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s ease-out}
.toast.good{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ───────── challenge ───────── */
.game{flex:1;padding:12px;display:flex;flex-direction:column;align-items:center}
.gwrap{width:min(1180px,100%);display:flex;flex-direction:column;gap:10px}
.ghud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,var(--bezel2),var(--bezel));border:1px solid var(--edge);border-radius:16px;padding:8px 12px}
.gstat{display:flex;flex-direction:column;line-height:1.05;min-width:64px}
.gstat small{font-size:10px;letter-spacing:.16em;color:var(--dim2);font-family:var(--f-d);font-weight:600}
.gstat b{font-family:var(--f-d);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.gstat.score b{color:var(--amber);text-shadow:0 0 18px rgba(255,179,64,.35);min-width:92px}
.gstat.time b{color:var(--teal)}
.gstat.time.low b{color:var(--red);animation:alblink 1s steps(2) infinite}
.gstat.streak b.hot{color:#ff7a3c}
.lvl{margin-left:auto;display:flex;gap:4px}
.lvl span{font-family:var(--f-d);font-weight:700;font-size:12px;letter-spacing:.12em;padding:5px 9px;border-radius:8px;background:#0f161d;color:var(--dim2);border:1px solid var(--edge)}
.lvl span.on.easy{background:rgba(98,224,138,.15);color:var(--green);border-color:rgba(98,224,138,.45)}
.lvl span.on.medium{background:rgba(255,179,64,.15);color:var(--amber);border-color:rgba(255,179,64,.45)}
.lvl span.on.hard{background:rgba(255,59,78,.15);color:#ff7d8a;border-color:rgba(255,59,78,.45)}
.tbar{height:5px;border-radius:3px;background:#1b252f;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .25s linear}
.gmain{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:10px}
.gscreen{position:relative;background:var(--screen);border:1px solid #000;border-radius:14px;overflow:hidden;min-height:380px;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.gscreen canvas{position:absolute;left:0;right:0;bottom:0;top:34px;width:100%;height:calc(100% - 34px)}
.gchips{position:absolute;left:10px;right:10px;top:7px;overflow:hidden;height:22px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.gchips span{font-family:var(--f-m);font-size:11.5px;padding:2px 7px;border-radius:6px;background:rgba(10,16,22,.9);border:1px solid var(--edge2);color:#cfe}
.gchips span.tag{color:var(--teal);border-color:rgba(63,224,208,.4)}
.sweep{position:absolute;top:34px;bottom:0;width:60px;left:-60px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(63,224,208,.18) 70%,rgba(63,224,208,.85) 97%,#fff);}
.gpanel{background:linear-gradient(180deg,var(--bezel2),var(--bezel));border:1px solid var(--edge);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.gvig{font-size:14px;line-height:1.5;color:#d6e0e9}
.gvig b{color:#fff}
.gq{font-family:var(--f-d);font-weight:700;font-size:20px;line-height:1.2;margin-top:2px}
.gopts{display:flex;flex-direction:column;gap:7px}
.gopt{text-align:left;border:1px solid var(--edge2);background:#0f161d;border-radius:12px;padding:11px 12px;font-size:14px;line-height:1.35;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:transform .08s}
.gopt:hover:not(:disabled){border-color:var(--teal2);transform:translateX(2px)}
.gopt kbd{font-family:var(--f-m);font-size:11px;border:1px solid var(--edge2);border-radius:5px;padding:1px 6px;color:var(--dim);flex:0 0 auto;margin-top:1px}
.gopt.right{border-color:var(--green);background:rgba(98,224,138,.12)}
.gopt.wrong{border-color:var(--red);background:rgba(255,59,78,.12);animation:shake .35s}
.gopt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gexp{font-size:13.5px;line-height:1.5;color:#d6e0e9;background:#0b1117;border:1px solid var(--edge);border-left:3px solid var(--teal);border-radius:10px;padding:10px 12px}
.gexp.bad{border-left-color:var(--red)}
.gexp h4{margin:0 0 4px;font-family:var(--f-d);font-size:17px}
.gexp h4.ok{color:var(--green)} .gexp h4.no{color:#ff7d8a}
.gexp p{margin:0 0 6px}.gexp p:last-child{margin:0}
.gexp .lookfor{font-size:12.5px;color:var(--dim)}
.gnext{align-self:flex-end}
.pop{position:fixed;font-family:var(--f-d);font-weight:800;font-size:22px;pointer-events:none;z-index:80;animation:popup 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.good{color:var(--green);text-shadow:0 0 14px rgba(98,224,138,.7)}
.pop.bad{color:var(--red);text-shadow:0 0 14px rgba(255,59,78,.7)}
.pop.gold{color:var(--amber);font-size:26px;text-shadow:0 0 16px rgba(255,179,64,.8)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.gstart,.gend{width:min(820px,100%);margin:10px auto;background:linear-gradient(180deg,#18212a,#11171d);border:1px solid var(--edge2);border-radius:22px;padding:22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.gstart h2,.gend h2{font-family:var(--f-d);font-weight:800;font-size:40px;letter-spacing:.03em;margin:4px 0 6px;line-height:1}
.gstart h2 span{color:var(--amber)}
.gstart p,.gend p{color:#c9d5e0;font-size:15px;line-height:1.55;max-width:640px;margin:8px auto}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;text-align:left}
.rules div{background:#0b1117;border:1px solid var(--edge);border-radius:14px;padding:12px;font-size:13px;line-height:1.45;color:var(--dim)}
.rules b{display:block;font-family:var(--f-d);font-size:17px;color:var(--ink);margin-bottom:3px}
.rules .e b{color:var(--green)} .rules .m b{color:var(--amber)} .rules .h b{color:#ff7d8a}
.gostart{font-family:var(--f-d);font-weight:800;font-size:22px;letter-spacing:.1em;padding:14px 34px;border-radius:14px;border:0;background:linear-gradient(180deg,#ffc35e,#ff9a1f);color:#2a1700;cursor:pointer;box-shadow:0 10px 30px rgba(255,154,31,.35)}
.gostart:hover{filter:brightness(1.06)}
.eyebrow{font-family:var(--f-d);font-weight:700;letter-spacing:.2em;font-size:12px;color:var(--teal);text-transform:uppercase}
.bigscore{font-family:var(--f-d);font-weight:800;font-size:72px;color:var(--amber);line-height:1;text-shadow:0 0 30px rgba(255,179,64,.4)}
.rank{font-family:var(--f-d);font-weight:700;font-size:22px;color:var(--teal);margin-top:4px}
.newbest{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:rgba(255,179,64,.15);color:var(--amber);font-weight:700;font-size:13px}
.endstats{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.endstats div{background:#0b1117;border:1px solid var(--edge);border-radius:12px;padding:8px 14px;min-width:96px}
.endstats span{display:block;font-size:11px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase}
.endstats strong{font-family:var(--f-d);font-size:24px}
.submit{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.postnote{font-size:12px;color:var(--dim2)}
.postnote.err{color:#ff8a95}
.posted{color:var(--green);font-weight:700;margin:10px 0}
.lb{margin:12px auto;max-width:460px;text-align:left;background:#0b1117;border:1px solid var(--edge);border-radius:14px;padding:12px}
.lb h3{margin:0 0 6px;font-family:var(--f-d);letter-spacing:.12em;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.lb h3 small{font-family:var(--f-b);letter-spacing:0;font-size:11px;color:var(--dim2);font-weight:500}
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;padding:5px 4px;border-bottom:1px solid #18212a;font-size:13.5px;align-items:center}
.lb li.me{background:rgba(63,224,208,.08);border-radius:6px}
.lb .n{color:var(--dim2);font-family:var(--f-m)}
.lb .sv{font-size:11px;color:var(--dim2)}
.lb .sc{font-family:var(--f-d);font-weight:700;color:var(--amber)}
.lb .empty{font-size:13px;color:var(--dim2)}
.lbmore{display:block;margin-top:8px;font-size:12.5px;color:var(--teal);text-decoration:none}
.review{text-align:left;margin:16px 0 4px}
.review h3{font-family:var(--f-d);letter-spacing:.1em;font-size:15px;margin:0 0 8px}
.review details{background:#0b1117;border:1px solid var(--edge);border-radius:12px;margin-bottom:6px;padding:8px 12px}
.review summary{cursor:pointer;font-size:13.5px;font-weight:600}
.review summary em{font-style:normal;font-size:11px;color:var(--dim2);margin-left:6px}
.review details p{font-size:13px;line-height:1.5;color:#cfd9e3;margin:6px 0 0}
.fine{font-size:11.5px;color:var(--dim2);margin-top:12px;line-height:1.45}

/* responsive */
@media (max-width:1180px){.lab{grid-template-columns:minmax(0,1fr) 330px}.screenwrap{grid-template-columns:minmax(0,1fr) 180px}.knobwrap{width:104px}.knob{width:84px;height:84px}}
@media (max-width:980px){
  .lab{grid-template-columns:1fr;grid-template-rows:auto;padding:8px;height:auto}
  .side{overflow:visible}
  .screenwrap{grid-template-columns:1fr;grid-template-rows:auto;min-height:0;flex:none}
  .screen{min-height:330px;height:52vh;max-height:460px}
  .monitor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible}
  .gmain{grid-template-columns:1fr}
  .gscreen{min-height:340px;height:50vh}
  .screenwrap{display:contents}
  .screen{order:1}.settings{order:2}.monitor{order:3}.modebar{order:0}
  body.learning .side{display:contents}
  body.learning #sideLesson{order:-1}
  body.learning .lungcard{order:2}
}
@media (max-width:720px){
  .top{padding:8px 10px;gap:8px;flex-wrap:wrap}
  .brand-mark{width:30px;height:30px}.brand-t b{font-size:21px}
  .tabs{order:3;margin-left:0;width:100%}
  .tabs button{padding:7px 12px;font-size:13px;flex:1;justify-content:center}
  .console{padding:8px;border-radius:14px}
  .knobwrap{display:none}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tile{min-height:66px;padding:6px 7px}
  .tile .tv{font-size:23px}
  .tile .pm{top:auto;bottom:4px;flex-direction:row}
  .tile .pm button{width:28px;height:26px}
  .tile.sel .ts{visibility:hidden}
  .tools{width:100%}
  .tools .tb{flex:1;padding:0 6px}
  .alarmbar{order:5;flex-basis:100%}
  .modebtn .mname{font-size:18px}
  .screen{height:46vh;min-height:300px}
  .monitor{grid-template-columns:repeat(2,minmax(0,1fr))}
  .taxkey,.rules,.helpgrid{grid-template-columns:1fr}
  .gstart h2,.gend h2{font-size:30px}
  .bigscore{font-size:58px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body.learning #sideLesson{order:-1}
@media (min-width:981px){body.learning #lung{height:170px}}

.fab{display:none}
@media (max-width:980px){
  .fab{display:flex;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:radial-gradient(circle at 40% 35%,#1f6f68,#0d3a37 70%);color:#dff;font-family:var(--f-d);font-weight:800;font-size:12.5px;letter-spacing:.04em;line-height:1.1;text-align:center;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.55);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .fab.on{background:radial-gradient(circle at 40% 35%,#ff7a8f,#9b1e33 70%)}
  body.gaming .fab{display:none}
  .gscreen{height:44vh}
}

</header>

<main class="lab" id="lab">

                set: ['VT', 'flow', 'pattern', 'pause', 'RR', 'PEEP', 'FiO2', 'trig'],
                blurb: 'Every breath is mandatory. You set tidal volume and inspiratory flow; the ventilator controls flow, so airway pressure is what varies. Look at the pressure scalar for the load and for patient effort.' },
  'vc-cmvd':  { tag: 'VC-CMVd', name: 'AC/VC + flow adaptation', long: 'Volume control with dual targeting', examples: 'Dual-targeted volume control (names vary by ventilator)', ctrl: 'VC', seq: 'CMV', tgt: 'd',
                set: ['VT', 'flow', 'RR', 'PEEP', 'FiO2', 'trig'],
                blurb: 'Dual targeting: the breath starts as volume control, but if the patient pulls harder than the set flow can satisfy, the ventilator switches to pressure control within the breath and lets flow (and volume) rise to meet demand. If the ventilator also lets that breath flow-cycle, the 2022 taxonomy calls it VC-IMV(4)d,d.' },
  'pc-cmv':   { tag: 'PC-CMVs', name: 'AC/PC', long: 'Assist-control pressure control', examples: 'A/C Pressure Control, Pressure Control (CMV)', ctrl: 'PC', seq: 'CMV', tgt: 's',
                set: ['Pinsp', 'Ti', 'rise', 'RR', 'PEEP', 'FiO2', 'trig'],

  'vc-imv':   { tag: 'VC-IMV(1)s,s', name: 'SIMV-VC + PS', long: 'Synchronized IMV, volume control, with pressure support', examples: 'SIMV Volume Control + Pressure Support', ctrl: 'VC', seq: 'IMV', tgt: 's,s',

  'pc-imv':   { tag: 'PC-IMV(1)s,s', name: 'SIMV-PC + PS', long: 'Synchronized IMV, pressure control, with pressure support', examples: 'SIMV Pressure Control + Pressure Support', ctrl: 'PC', seq: 'IMV', tgt: 's,s',
                set: ['Pinsp', 'Ti', 'RR', 'PS', 'PEEP', 'FiO2', 'trig'],

  'cpap':     { tag: 'PC-CSVs', name: 'CPAP', long: 'Continuous positive airway pressure', examples: 'CPAP, Spontaneous (PS 0)', ctrl: 'PC', seq: 'CSV', tgt: 's',

  'varps':    { tag: 'PC-CSVb', name: 'Variable PS', long: 'Pressure support with bio-variable targeting', examples: 'Variable Pressure Support (noisy PSV)', ctrl: 'PC', seq: 'CSV', tgt: 'b',

  'pav':      { tag: 'PC-CSVr', name: 'PAV+', long: 'Proportional assist ventilation', examples: 'PAV+, Proportional Assist', ctrl: 'PC', seq: 'CSV', tgt: 'r',

var MODE_ORDER = ['vc-cmv', 'pc-cmv', 'pc-cmva', 'vc-cmvd', 'vc-imv', 'pc-imv', 'aprv', 'asv', 'psv', 'cpap', 'vs', 'varps', 'pav', 'nava', 'off'];

/* ───────────── PATIENT PRESETS ───────────── */
/* R cmH2O/L/s, CL & Ccw L/cmH2O, Ppl0 cmH2O (pleural pressure at lung resting volume), shunt fraction, alveolar dead-space fraction */

  copd:     { label: 'COPD', R: 20, Rexp: 30, CL: 0.14, Ccw: 0.10, Ppl0: 0, frc: 3.6, shunt: 0.10, recruit: 0.2, vdAlv: 0.35, vco2: 3.0, hco3: 28, map: 80, hr: 96, od: 0,

  plug:     { label: 'Kinked tube / mucus plug', R: 40, Rexp: 40, CL: 0.10, Ccw: 0.10, Ppl0: 0, frc: 2.2, shunt: 0.10, recruit: 0.4, vdAlv: 0.05, vco2: 3.0, hco3: 24, map: 82, hr: 98, od: 0,

/* ───────────── DEFAULT SETTINGS ───────────── */
function defaultVent() {

/* ───────────── SIMULATOR ───────────── */

/* ───── patient muscle pressure ───── */
function effortShape(e, t) {
  var dt = t - e.t0;
  if (dt < 0) return 0;

    if (dt < e.tc) return e.amp * 0.5 * (1 - Math.cos(Math.PI * dt / e.tc));

Sim.prototype.addEffort = function (t0, amp, tc, tr, kind) {

/* ───── derived measurements ───── */

    { text: 'Press the button to make the patient a 5′2″ woman and see how the same VT becomes too big.', test: function (e) { return e.type === 'patient' && e.id === 'ht'; } }
  ],
  buttons: [{ label: 'Make the patient 5′2″ female', run: function (VL, sim) { sim.p.sex = 'F'; sim.p.height = 157; VL.setVal('VT', sim.v.VT * 1000, true); VL.toast('Female, 157 cm: PBW ' + sim.pbw().toFixed(1) + ' kg. 6 mL/kg = ' + Math.round(sim.pbw() * 6) + ' mL.'); VL.fire('patient', { id: 'ht' }); } }] },

{ id: 'phases', session: S1, objective: 'Outline AC/PC, AC/VC and modifiable parameters', short: 'Trigger, inspiration, cycle, expiration',
  q: 'Which portions of the breath are trigger, inspiration, cycle and expiration?',
  a: '<p><b>Trigger:</b> initiates inspiration (the patient, or time based on the RR).</p><p><b>Inspiration:</b> flow into the lungs.</p><p><b>Cycle:</b> initiates expiration.</p><p><b>Expiration:</b> flow out of the lungs. Like a pulled spring that is let go, the lungs recoil inward <b>passively</b>.</p><p>The phase bands shade inspiration teal. Grey triangles mark time-triggered breaths.</p>',
  config: { mode: 'pc-cmv', vent: { Pinsp: 15, Ti: 1.0, RR: 14, PEEP: 5 }, ui: { bands: true } },
  tasks: [
    { text: 'Freeze the screen and hover over a breath. Find the moment the flow crosses zero going down: that is the <b>cycle</b>.', test: function (e) { return e.type === 'freeze' && e.frozen; } },
    { text: 'Make inspiration longer (raise <b>Ti</b>) and watch expiration get shorter.', test: function (e, sim) { return e.type === 'set' && e.key === 'Ti' && sim.v.Ti >= 1.3; } }
  ] },

{ id: 'trigger', session: S1, objective: 'Detect patient efforts', short: 'Patient vs time trigger',
  q: 'How can you distinguish patient-triggered from time-triggered breaths?',
  a: '<p>The ventilator <b>marks patient efforts that result in a breath</b>. The mark varies from ventilator to ventilator. Here, patient-triggered breaths get an <b style="color:#ff9d3c">orange</b> triangle and time-triggered breaths a <b style="color:#aabbcc">grey</b> one.</p><p>Look also for the small dip in pressure (or rise in flow) just before the breath: that is the patient’s effort reaching the trigger threshold.</p>',
  config: { mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 8, PEEP: 5 } },
  tasks: [
    { text: 'Hold <b>Breathe IN</b> during expiration to trigger a breath yourself. Look for the orange mark.', test: function (e) { return e.type === 'breath' && e.trig === 'patient' && e.manual; } },
    { text: 'Switch the trigger tile to <b>Pressure</b> and set it to 5 cmH₂O, then trigger again. It takes a much bigger pull.', test: function (e, sim) { return e.type === 'breath' && e.trig === 'patient' && e.manual && sim.v.trig === 'pressure' && sim.v.trigP >= 5; } }
  ] },

{ id: 'psv', session: S1, objective: 'Review PSV and SBT', short: 'Pressure support',
  q: 'What is pressure support mode, and how does it differ from assist-control?',
  a: '<p>PSV is a <b>patient-triggered, pressure-supported</b> mode in which you set the inspiratory pressure, PEEP and FiO₂. The <b>RR is solely the patient’s</b>.</p><p>Each breath ends when inspiratory flow falls to a set fraction of its peak (the cycle threshold), so the patient also controls inspiratory time.</p>',
  config: { mode: 'psv', vent: { PS: 10, PEEP: 5, ETS: 25 }, drive: { on: true, rate: 18, amp: 6, ti: 0.9, tr: 0.4 } },
  tasks: [
    { text: 'Lower <b>PS</b> and watch VT fall while the rate stays the patient’s.', test: function (e, sim) { return e.type === 'set' && e.key === 'PS' && sim.v.PS <= 6; } },
    { text: 'Raise <b>PS</b> to 15 or more and watch VT climb.', test: function (e, sim) { return e.type === 'set' && e.key === 'PS' && sim.v.PS >= 15; } }
  ] },

{ id: 'sbt', session: S1, objective: 'Review PSV and SBT', short: 'When PSV? What is an SBT?',
  q: 'In which scenarios is pressure support appropriate, and what is an SBT?',
  a: '<p>PSV fits <b>SBTs, weaning, stable patients with a reliable respiratory drive</b>, or patients intubated solely to protect the upper airway.</p><p>An <b>SBT (spontaneous breathing trial)</b> is a time-limited test of extubation readiness: support is reduced to minimal levels (typically <b>PS 5, PEEP 5, FiO₂ 30%</b>) to see whether the patient can sustain ventilation and oxygenation without excessive work of breathing or hemodynamic instability.</p>',
  config: { mode: 'psv', vent: { PS: 12, PEEP: 8, FiO2: 0.5 }, drive: { on: true, rate: 16, amp: 6, ti: 0.9, tr: 0.4 } },
  tasks: [{ text: 'Set up an SBT: <b>PS 5, PEEP 5, FiO₂ 30%</b>.', test: function (e, sim) { return sim.v.mode === 'psv' && sim.v.PS === 5 && sim.v.PEEP === 5 && Math.abs(sim.v.FiO2 - 0.3) < 0.005; } }] },

{ id: 'rsbi', session: S1, objective: 'Review PSV and SBT', short: 'RSBI',
  q: 'Can you describe the utility of the RSBI?',
  a: '<p>The <b>Rapid Shallow Breathing Index</b> = RR ÷ VT (in liters). It is a bedside screening tool during weaning/SBTs. A lower RSBI reflects more efficient breathing. <b>RSBI &lt; 105</b> generally suggests a higher likelihood of successful extubation, but interpret it alongside the clinical status and trajectory.</p><p>RSBI appears in the Timing panel in spontaneous modes.</p>',
  config: { mode: 'psv', vent: { PS: 5, PEEP: 5, FiO2: 0.3 }, drive: { on: true, rate: 18, amp: 5, ti: 0.8, tr: 0.4 } },
  tasks: [
    { text: 'Press <b>Tire the patient</b> and watch RSBI climb past 105 as the breathing gets rapid and shallow.', test: function (e, sim) { return e.type === 'tick' && sim.meas.RSBI > 105; } }
  ],
  buttons: [{ label: 'Tire the patient (RR 34, weak efforts)', run: function (VL, sim) { sim.p.drive.rate = 34; sim.p.drive.amp = 3.2; sim.p.drive.ti = 0.6; VL.toast('Rapid, shallow breathing. Give the rate a few breaths to update.'); } },
            { label: 'Recover', run: function (VL, sim) { sim.p.drive.rate = 18; sim.p.drive.amp = 5; sim.p.drive.ti = 0.8; } }] },

{ id: 'apnea', session: S1, objective: 'Review PSV and SBT', short: 'Apnea on PSV',
  q: 'What would happen if a patient on PSV became apneic?',
  a: '<p>If there is no backup mode, <b>ventilation stops</b>. Most ventilators activate <b>apnea/backup ventilation</b> and switch to an assist-control mode after a set apnea time.</p><p>Here the apnea time is on the settings tiles. Backup ventilation hands control back once the patient triggers again.</p>',
  config: { mode: 'psv', vent: { PS: 10, PEEP: 5, apnea: 15 }, drive: { on: true, rate: 16, amp: 6, ti: 0.9, tr: 0.4 } },
  tasks: [{ text: 'Sedate the patient: press the button (or switch off spontaneous breathing) and wait for the <b>APNEA</b> alarm and backup ventilation.', test: function (e) { return e.type === 'alarm' && e.key === 'apnea'; } }],
  buttons: [{ label: 'Give a big dose of sedation', run: function (VL, sim) { sim.p.drive.on = false; VL.toast('Spontaneous effort stopped. Count the seconds…'); } }, { label: 'Wake up', run: function (VL, sim) { sim.p.drive.on = true; } }] },

/* ─────────────── SESSION 2 ─────────────── */
{ id: 'spont-drive', session: S2, objective: 'Describe the single-compartment model of the lung', short: 'How does spontaneous effort move air?',
  q: 'How does spontaneous inspiratory effort drive air into the alveoli?',
  a: '<p>The patient generates <b>negative pleural pressure</b>, which lowers alveolar pressure “below” airway pressure, and air flows into the lungs. Because the alveolar space is connected to atmosphere, flow occurs so rapidly that <b>alveolar pressure stays near atmospheric</b>.</p><p>Watch the digital lung: Ppl (pleural, measured by the balloon as Pes) swings well negative while Palv barely dips.</p>',
  config: { mode: 'off', ui: { balloon: true, showPmus: true } },
  tasks: [{ text: 'Take a breath with <b>Breathe IN</b>. Compare how far <b>Ppl</b> and <b>Palv</b> fall on the digital lung.', test: function (e, sim) { return e.type === 'tick' && sim.lastSample && sim.lastSample.Ppl < -4; } }] },

{ id: 'ppv', session: S2, objective: 'Describe the single-compartment model of the lung', short: 'Positive-pressure breath',
  q: 'How does a ventilator-supported positive-pressure breath drive air into the alveoli?',
  a: '<p>The ventilator <b>raises airway pressure above alveolar pressure</b>, so air flows into the lungs. Under normal conditions <b>pleural pressure rises</b> during inspiration: the opposite of a spontaneous breath.</p>',
  config: { mode: 'vc-cmv', vent: { VT: 0.5, flow: 60, RR: 14, PEEP: 5 }, ui: { balloon: true } },
  tasks: [{ text: 'Watch <b>Pes</b> rise with each ventilator breath, then take a breath yourself between them and watch it fall instead.', test: function (e) { return e.type === 'effort'; } }] },

{ id: 'peep', session: S2, objective: 'Describe the single-compartment model of the lung', short: 'PEEP',
  q: 'Can you describe PEEP?',
  a: '<p>PEEP is the <b>baseline positive pressure maintained at end-expiration</b> to prevent alveolar collapse and improve oxygenation. It may increase mean airway pressure and <b>can reduce venous return</b> if it is too high.</p>',
  config: { preset: 'ards', mode: 'vc-cmv', vent: { VT: 0.40, flow: 60, RR: 20, PEEP: 5, FiO2: 0.8 } },
  tasks: [
    { text: 'Raise <b>PEEP</b> to 14. Watch the balloon stay bigger at end-expiration and the estimated PaO₂ climb.', test: function (e, sim) { return sim.v.PEEP >= 14; } },
    { text: 'Push PEEP to 22 and watch <b>MAP</b> fall: less venous return.', test: function (e, sim) { return sim.v.PEEP >= 22; } }
  ] },

{ id: 'peak-plat', session: S2, objective: 'Classify airway, alveolar and pleural pressure', short: 'Peak and plateau',
  q: 'What are peak and plateau pressures? How are they measured and what do they represent?',
  a: '<p>Think of a <b>straw (airway) and a balloon (alveoli)</b>. Resistance to flow in a straw rises with its length and gas viscosity, and falls with the <b>fourth power of its radius</b> (Poiseuille).</p><p><b>Peak pressure</b> combines the elastic load of the balloon and the resistive load of the straw. To measure only the balloon, remove resistance by stopping flow: an <b>end-inspiratory pause</b>. The pressure during that pause is the <b>plateau pressure</b>, reflecting alveolar/balloon pressure. In ARDS we aim for <b>Pplat &lt; 30 cmH₂O</b>.</p>',
  config: { mode: 'vc-cmv', vent: { VT: 0.5, flow: 60, RR: 14, PEEP: 5 }, ui: { loads: true, bands: true } },
  tasks: [
    { text: 'Press <b>Insp hold</b>. Read <b>Ppeak</b> and <b>Pplat</b>; the drop between them is the straw.', test: ev('holdInsp') },
    { text: 'Raise <b>Peak flow</b> to 90 and hold again: the peak rises, the plateau doesn’t.', test: function (e, sim) { return e.type === 'holdInsp' && sim.v.flow >= 90; } }
  ] },

{ id: 'pressures', session: S2, objective: 'Classify airway, alveolar and pleural pressure', short: 'Airway, alveolar, pleural',
  q: 'How do airway, alveolar and pleural pressures differ in the single-compartment model?',
  a: '<p><b>Airway pressure</b> is measured at the airway opening. <b>Alveolar pressure</b> is the pressure within the alveoli (approximated by Pplat). <b>Pleural pressure</b> surrounds the lung and can be estimated with <b>esophageal manometry</b>.</p><p><b>Transpulmonary pressure (PL)</b> = alveolar − pleural: the distending pressure across the lung itself.</p>',
  config: { mode: 'vc-cmv', vent: { VT: 0.5, flow: 60, RR: 14, PEEP: 5 }, ui: { balloon: true } },
  tasks: [
    { text: 'Do an <b>Insp hold</b> and read <b>PL end-insp</b> in the balloon panel (Pplat − Pes).', test: ev('holdInsp') },
    { text: 'Do an <b>Exp hold</b> and read <b>PL end-exp</b>.', test: ev('holdExp') }
  ] },

{ id: 'plat-unreliable', session: S2, objective: 'Classify airway, alveolar and pleural pressure', short: 'When Pplat misleads',
  q: 'When is plateau pressure an unreliable surrogate for transpulmonary pressure?',
  a: '<p>Pplat reflects the <b>whole respiratory system</b>: lung plus pleural cavity, chest wall and abdomen. It is unreliable whenever <b>pleural pressure is abnormal</b>: active expiration, obesity, or a large pleural effusion. Elevated pleural pressure raises the measured Pplat without raising the distending pressure across the lung.</p><p>Two patients with the same Pplat but different pleural pressures can have very different alveolar stress. <b>Esophageal manometry</b> estimates pleural pressure and gives a better transpulmonary pressure.</p>',
  config: { preset: 'obesity', mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 16, PEEP: 5, FiO2: 0.6 }, ui: { balloon: true } },
  tasks: [
    { text: 'Do an <b>Insp hold</b>. Pplat looks worrying, but check <b>PL end-insp</b>.', test: ev('holdInsp') },
    { text: 'Do an <b>Exp hold</b>: PL end-exp is negative (the lung is being squeezed shut). Raise PEEP until PL end-exp is about 0 or higher, then hold again.', test: function (e, sim) { return e.type === 'holdExp' && e.PL >= -0.5; } }
  ] },

{ id: 'elastic', session: S2, objective: 'Distinguish the two components of ventilator load', short: 'Stiff balloon: elastic load',
  q: 'What if the balloon at the end of the straw is very stiff and difficult to inflate?',
  a: '<p>An <b>increased elastic load</b> (decreased compliance; “elastic load” and “compliance” describe the same concept from opposite sides). Both <b>peak and plateau rise</b>, and the <b>difference between them stays normal</b> (assuming no added resistive load).</p><p>Causes: ARDS, pneumonia, pulmonary edema, atelectasis, fibrosis, auto-PEEP, right mainstem intubation, effusion, pneumothorax, obesity, ascites or abdominal compartment syndrome.</p>',
  config: { preset: 'fibrosis', mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 16, PEEP: 5 }, ui: { loads: true } },
  tasks: [{ text: 'Press <b>Insp hold</b>. Is Ppeak − Pplat &lt; 10?', test: ev('holdInsp') }] },

{ id: 'resistive', session: S2, objective: 'Distinguish the two components of ventilator load', short: 'Blocked straw: resistive load',
  q: 'What happens in the event of a partial blockage in the straw?',
  a: '<p>An <b>increased resistive load</b>: <b>higher peak pressure</b>, but the plateau may stay similar if compliance is unchanged, so the <b>difference between peak and plateau increases</b> (≥ 10 cmH₂O).</p><p>Causes: obstructive airway disease/bronchospasm, kinked or bitten endotracheal tube, high flow rate or tidal volume, mucus plug or blood clot.</p>',
  config: { preset: 'plug', mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 16, PEEP: 5 }, ui: { loads: true } },
  tasks: [{ text: 'Press <b>Insp hold</b> and compare the peak-plateau gap with the stiff balloon.', test: ev('holdInsp') }] },

{ id: 'interpret', session: S2, objective: 'Interpret peak and plateau pressures', short: 'Fibrosis vs asthma on AC/VC',
  q: 'What would the scalars look like in pulmonary fibrosis versus asthma on AC/VC?',
  a: '<p><b>Fibrosis (decreased lung compliance):</b> high plateau with a correspondingly high peak; normal peak-plateau difference. <b>Expiratory flow is fast</b> and returns to baseline quickly.</p><p><b>Asthma (increased airway resistance):</b> high peak with a relatively lower plateau. <b>Expiratory flow is slow</b> and needs more time to return to baseline.</p>',
  config: { preset: 'fibrosis', mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 14, PEEP: 5 }, ui: { loads: true } },
  buttons: [
    { label: 'Load fibrosis', config: { preset: 'fibrosis', mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 14, PEEP: 5 }, ui: { loads: true } } },
    { label: 'Load asthma', config: { preset: 'asthma', mode: 'vc-cmv', vent: { VT: 0.45, flow: 60, RR: 14, PEEP: 5 }, ui: { loads: true } } }
  ],
  tasks: [
    { text: 'Do an <b>Insp hold</b> on the fibrosis patient.', test: function (e, sim) { return e.type === 'holdInsp' && sim.p.preset === 'fibrosis'; } },
    { text: 'Load asthma, do an <b>Insp hold</b>, and compare the expiratory flow.', test: function (e, sim) { return e.type === 'holdInsp' && sim.p.preset === 'asthma'; } }
  ] },

{ id: 'autopeep', session: S2, objective: 'Understand auto-PEEP', short: 'Auto-PEEP',
  q: 'What is auto-PEEP, how do you identify it, and how do you quantify it?',
  a: '<p>Auto-PEEP comes from <b>incomplete exhalation</b>: progressive air trapping and higher intrathoracic pressure, above the set PEEP. It can <b>impair venous return, reduce cardiac output</b> and raise the risk of barotrauma. As it worsens, peak and plateau both rise.</p><p><b>Identify:</b> expiratory flow <b>does not return to baseline</b> before the next breath.</p><p><b>Quantify:</b> an <b>expiratory hold</b> measures total PEEP; auto-PEEP = total PEEP − set PEEP.</p>',
  config: { preset: 'copd', mode: 'vc-cmv', vent: { VT: 0.55, flow: 50, RR: 24, PEEP: 5, FiO2: 0.4 } },
  tasks: [
    { text: 'Press <b>Exp hold</b> and read total PEEP and auto-PEEP.', test: ev('holdExp') },
    { text: 'Fix it: change settings until an <b>Exp hold</b> shows auto-PEEP ≤ 2.', test: function (e) { return e.type === 'holdExp' && e.autoPEEP <= 2; } }
  ] },

{ id: 'ie', session: S2, objective: 'Setting inspiratory and expiratory ratios', short: 'Choosing the I:E ratio',
  q: 'How do we choose an I:E ratio, and what should it be with a high resistive load (status asthmaticus)?',
  a: '<p>It depends. A <b>longer inspiratory time raises mean airway pressure</b> (may help oxygenation) <b>at the cost of expiratory time</b> (risk of dynamic hyperinflation).</p><p>With an excessive resistive load, prolong expiration: an <b>I:E of 1:3 or more</b> (1:4, 1:5) is a reasonable start, then adjust until expiratory flow returns to baseline.</p><p>Remember: expiration is passive; you lengthen it indirectly by shortening inspiration or lowering the rate.</p>',
  config: { preset: 'asthma', mode: 'vc-cmv', vent: { VT: 0.5, flow: 50, RR: 20, PEEP: 5, FiO2: 0.5 } },
  tasks: [
    { text: 'Reach an <b>I:E of 1:3 or more</b> (watch the I:E value).', test: function (e, sim) { return e.type === 'tick' && sim.meas.Ti > 0 && sim.meas.Te / sim.meas.Ti >= 2.95; } },
    { text: 'Get expiratory flow back to baseline: confirm with an <b>Exp hold</b> showing auto-PEEP ≤ 2.', test: function (e) { return e.type === 'holdExp' && e.autoPEEP <= 2; } }
  ] },

{ id: 'alarms', session: S2, objective: 'Describe and adjust safety features, including alarms', short: 'Safety features and alarms',
  q: 'What safety features are built into the ventilator, and how should alarms be set?',
  a: '<p>Pressure limits, disconnect/low-pressure detection, apnea/backup ventilation, low minute-ventilation alarms, FiO₂ alarms and high-RR limits: they <b>prevent barotrauma</b> and <b>flag hypoventilation or disconnection</b>.</p><p>Set alarms relative to expected values: <b>high pressure</b> above the typical peak (catches obstruction/coughing), <b>low pressure/disconnect</b> near baseline, a <b>minute ventilation/VT floor</b> for hypoventilation, and an appropriate <b>apnea time</b>. Reassess after changes in mode, sedation or mechanics.</p>',
  config: AC_VC,
  tasks: [
    { text: 'Set <b>Pmax</b> below the current peak pressure and watch the high-pressure alarm cut breaths short.', test: function (e) { return e.type === 'alarm' && e.key === 'pmax'; } },
    { text: 'Disconnect the circuit (button below) and watch the alarm.', test: function (e) { return e.type === 'alarm' && e.key === 'disc'; } }
  ],
  buttons: [{ label: 'Disconnect circuit', run: function (VL, sim) { sim.disconnected = true; } }, { label: 'Reconnect', run: function (VL, sim) { sim.disconnected = false; sim.clear('disc'); } }] },

/* ─────────────── SESSION 3 CASES ─────────────── */
{ id: 'case1a', session: S3, objective: 'Case 1 · COPD exacerbation', short: 'Case 1 · hypercapnia',
  caseText: '<b>A 65-year-old man with a COPD exacerbation</b> is intubated for worsening hypercapnia and altered mental status. AC/VC: <b>VT 450 mL (~6 mL/kg PBW), RR 14, FiO₂ 60%, PEEP 8</b>.<br>ABG at 30 minutes: <b>pH 7.25, PaCO₂ 65, PaO₂ 65</b> on FiO₂ 60%.',
  q: 'What is the primary problem, and which setting(s) should you adjust?',
  a: '<p><b>Hypercapnia</b> (low pH, high PaCO₂). Ventilation follows minute ventilation (VT × RR), so increase one of them. VT is already lung-protective, so a safe change is to <b>increase the RR</b>.</p><p>Alternatively, with no acute lung injury requiring strict limits, <b>VT can go to 8 mL/kg PBW provided Pplat stays &lt; 30</b>. Beware: a higher RR can cause <b>dynamic hyperinflation</b> in obstructive disease.</p>',
  config: { preset: 'copd', mode: 'vc-cmv', sex: 'M', height: 168, vent: { VT: 0.45, flow: 50, RR: 14, PEEP: 8, FiO2: 0.6 } },
  tasks: [{ text: 'Increase minute ventilation (RR or VT) and watch the estimated PaCO₂ improve.', test: function (e, sim) { return e.type === 'set' && (sim.v.RR > 14 || sim.v.VT > 0.455); } }] },

{ id: 'case1b', session: S3, objective: 'Case 1 · COPD exacerbation', short: 'Case 1 · falling blood pressure',
  caseText: 'A few minutes later the nurse notices the patient needs <b>escalating norepinephrine</b>. Look at the scalars.',
  q: 'Describe what is happening based on the scalars, and how you would fix it.',
  a: '<p><b>Dynamic hyperinflation (auto-PEEP)</b> from insufficient expiratory time with obstructive physiology. Trapped gas raises end-expiratory alveolar and intrathoracic pressure, <b>impairs venous return</b> and causes hypotension. Make sure expiratory flow returns to baseline before each breath.</p><p>To lengthen expiratory time:</p><ul><li><b>AC/VC and AC/PC:</b> lower the RR (consider sedation, even neuromuscular blockade, for patient-triggered tachypnea); treat the obstruction (bronchodilators).</li><li><b>AC/VC:</b> decrease VT (if &gt; 6 mL/kg) and <b>increase inspiratory flow</b>; both shorten inspiration.</li><li><b>AC/PC:</b> decrease the set inspiratory time.</li><li>An <b>I:E of 1:3 or more</b> is a reasonable start; adjust until expiratory flow reaches baseline.</li></ul><p>This may worsen the acidosis, but with circulatory collapse looming, it is the least-harm trade.</p>',
  config: { preset: 'copd', mode: 'vc-cmv', sex: 'M', height: 168, vent: { VT: 0.5, flow: 45, RR: 26, PEEP: 8, FiO2: 0.6 } },
  tasks: [
    { text: 'Confirm it with an <b>Exp hold</b>.', test: ev('holdExp') },
    { text: 'Fix it, then prove it: <b>Exp hold</b> with auto-PEEP ≤ 2 and MAP ≥ 65.', test: function (e, sim) { return e.type === 'holdExp' && e.autoPEEP <= 2 && sim.gas().MAP >= 65; } }
  ] },

{ id: 'case2a', session: S3, objective: 'Case 2 · ARDS', short: 'Case 2 · mode and initial settings',
  caseText: '<b>A 50-year-old woman</b> with multifocal pneumonia, severe hypoxemia and hypercapnia is intubated; imaging and ABG are consistent with <b>ARDS</b>. Height <b>5′10″ (70 in)</b>.',
  q: 'Which mode would you use, and what initial settings?',
  a: '<p>No mode is inherently superior, but the landmark lung-protective ARDS trials used <b>AC/VC</b>, which guarantees low VT and reliable plateau monitoring. AC/PC can work but holding a stable 6 mL/kg needs close monitoring. The true therapy is <b>lung-protective ventilation</b>.</p><ul><li><b>PBW</b> for a 70-inch female ≈ <b>68.5 kg</b>.</li><li><b>VT 6 mL/kg ≈ 410 mL</b>.</li><li><b>RR ~18–24</b>, titrated to a safe I:E (typically 1:2).</li><li><b>PEEP/FiO₂ from the ARDSNet table</b>, e.g. FiO₂ 80% with PEEP 14. Wean FiO₂ to ≤ 60% as soon as feasible.</li></ul>',
  config: { preset: 'ards', mode: 'pc-cmv', sex: 'F', height: 178, vent: { Pinsp: 22, Ti: 1.0, RR: 14, PEEP: 5, FiO2: 1.0 } },
  tasks: [
    { text: 'Choose <b>AC/VC</b>.', test: function (e, sim) { return sim.v.mode === 'vc-cmv'; } },
    { text: 'Set <b>VT ≈ 6 mL/kg PBW</b> (400–420 mL), <b>RR 18–24</b>, <b>PEEP 14</b>, <b>FiO₂ 80%</b>.', test: function (e, sim) { var k = pbwVT(sim); return sim.v.mode === 'vc-cmv' && k >= 5.8 && k <= 6.2 && sim.v.RR >= 18 && sim.v.RR <= 24 && sim.v.PEEP === 14 && Math.abs(sim.v.FiO2 - 0.8) < 0.005; } }
  ] },

{ id: 'case2b', session: S3, objective: 'Case 2 · ARDS', short: 'Case 2 · plateau of 34',
  caseText: 'An end-inspiratory pause measures a <b>plateau pressure of 34 cmH₂O</b>.',
  q: 'What adjustments would you make?',

<script>
/* Vent Lab · Asynchrony Challenge — 5 minutes, easy / medium / hard cases generated by the physics engine.
   Taxonomy and definitions: Mireles-Cabodevila E, Siuba MT, Chatburn RL. Respir Care 2022;67:129-148. */
(function (root) {
'use strict';
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

var rng = function (r, a, b, st) { var x = a + r() * (b - a); return st ? Math.round(x / st) * st : x; };

/* ───────── run a scenario through the engine ───────── */
function runCase(sc, seed) {
  var s = new VentSim({ seed: seed });

  Object.assign(s.v, sc.vent || {});
  s.reset();
  var marks = [];
  s.on(function (type, d) { if (type === 'breath') marks.push({ t: d.t, kind: d.trig === 'time' ? 'time' : 'patient' }); });
  var pre = sc.pre || 22, win = sc.win || 10;
  if (sc.holdI != null) { s.run(sc.holdI, 1); s.holdInspArm = true; }
  if (sc.holdE != null) { s.run(Math.max(0, sc.holdE - (sc.holdI || 0)), 1); s.holdExpArm = true; }
  s.run(pre - Math.max(sc.holdI || 0, sc.holdE || 0), 1);
  var t0 = s.t, S = [];
  var evs = (sc.events || []).slice().sort(function (a, b) { return a.at - b.at; }), done = 0;
  evs.forEach(function (e) { S = S.concat(s.run(e.at - done, 100)); done = e.at; if (e.act === 'holdI') s.holdInspArm = true; if (e.act === 'holdE') s.holdExpArm = true; });
  S = S.concat(s.run(win - done, 100));
  var t1 = s.t;
  // close the current breath for analysis
  var B = s.breaths.slice(); if (s.br) { var cb = Object.assign({}, s.br); if (cb.tExp == null) cb.tExp = s.t; B.push(cb); }
  return { S: S, sim: s, t0: t0, t1: t1, win: win, breaths: B, marks: marks.filter(function (m) { return m.t >= t0; }), efforts: s.effortLog };
}
/* analysis helpers */
function inWin(R, t) { return t >= R.t0 + 0.2 && t <= R.t1 - 0.2; }
function breathAt(R, t) { for (var i = R.breaths.length - 1; i >= 0; i--) { var b = R.breaths[i]; if (t >= b.t0) return b; } return null; }
function failedEfforts(R) {
  return R.efforts.filter(function (e) {
    if (!inWin(R, e.t0) || e.triggered || e.amp <= 0) return false;
    var b = breathAt(R, e.t0); if (!b) return false;
    if (!(e.t0 > (b.tExp || 1e9) + 0.15)) return false;      // started during expiration and never triggered
    return !R.breaths.some(function (x) { return x.t0 >= e.t0 - 0.05 && x.t0 <= e.t0 + e.tc + 0.15; });   // and no machine breath landed on it
  });
}
function lateTriggers(R, thr) { return R.efforts.filter(function (e) { return inWin(R, e.t0) && e.triggered && e.trigT - e.t0 > (thr || 0.2); }); }
function falseTriggers(R) { return R.breaths.filter(function (b) { return inWin(R, b.t0) && b.trig === 'false'; }); }
function doubles(R) {
  var out = []; for (var i = 1; i < R.breaths.length; i++) { var a = R.breaths[i - 1], b = R.breaths[i]; if (inWin(R, b.t0) && a.tExp != null && b.t0 - a.tExp < 0.75 && b.trig !== 'time') out.push([a, b]); } return out;
}
function earlyTriggers(R) {
  return R.efforts.filter(function (e) { if (!inWin(R, e.t0) || e.kind !== 'entrained') return false; var b = breathAt(R, e.t0); return b && b.trig === 'time' && e.t0 - b.t0 > 0.1; });
}
function effortEnd(e) { return e.t0 + e.tc; }
function earlyCycles(R) {
  return R.breaths.filter(function (b) { var e = b.effort; return inWin(R, b.t0) && e && e.tc && b.tExp && effortEnd(e) > b.tExp + 0.15; });
}
function lateCycles(R) {
  return R.breaths.filter(function (b) { var e = b.effort; return inWin(R, b.t0) && e && e.tc && b.tExp && b.tExp > effortEnd(e) + e.tr * 0.6 + 0.12; });
}
function minInspP(R) { var m = 1e9; R.S.forEach(function (s) { if (s.phase === 'insp' && s.t > R.t0 + 0.2) m = Math.min(m, s.P); }); return m; }
function hl(t0, t1, label, col) { return { t0: t0, t1: t1, label: label, color: col }; }
var HL_RED = 'rgba(255,84,112,0.20)', HL_AMB = 'rgba(255,179,64,0.22)', HL_TEAL = 'rgba(63,224,208,0.18)';

/* setting chips */
function chipsFor(sc, R) {
  var v = Object.assign(VentSim.defaultVent(), sc.vent), M = VentSim.MODES[v.mode], c = [];
  if (sc.hideMode) return [{ t: 'Mode display hidden', tag: true }, { t: 'PEEP ' + (v.mode === 'aprv' ? v.Plow : v.PEEP) }];
  if (!sc.hideMode) c.push({ t: M.name + ' · ' + M.tag, tag: true });
  if (M.ctrl === 'VC' && v.mode !== 'vc-cmvd' && !sc.hideMode) c.push({ t: 'VT ' + Math.round(v.VT * 1000) + ' · flow ' + v.flow + (v.pattern === 'ramp' ? ' ramp' : '') });
  if (v.mode === 'pc-cmv' || v.mode === 'pc-imv') c.push({ t: 'Pinsp ' + v.Pinsp + ' · Ti ' + v.Ti });
  if (v.mode === 'pc-cmva' && !sc.hideMode) c.push({ t: 'VT target ' + Math.round(v.VT * 1000) + ' · Ti ' + v.Ti });
  if (v.mode === 'psv' || v.mode === 'vc-imv' || v.mode === 'pc-imv') c.push({ t: 'PS ' + v.PS + (v.mode === 'psv' ? ' · ETS ' + v.ETS + '%' : '') });
  if (M.seq !== 'CSV' && !sc.hideMode) c.push({ t: 'RR ' + v.RR });
  c.push({ t: 'PEEP ' + v.PEEP });
  if (!sc.hideTrig) c.push({ t: (v.trig === 'flow' ? 'Flow trig ' + v.trigFlow + ' L/min' : 'Pres trig −' + v.trigP) });
  (sc.extraChips || []).forEach(function (x) { c.push({ t: x }); });
  return c;
}

/* ───────── TEMPLATES ───────── */
var T = [];
function add(t) { T.push(t); }
var NAMES = {
  normal: 'Normal synchrony', early: 'Early trigger', late: 'Late trigger', falseT: 'False trigger', failed: 'Failed trigger',
  ws: 'Work shifting', sws: 'Severe work shifting (flow starvation)', ecyc: 'Early cycle', lcyc: 'Late cycle', expw: 'Expiratory work',
  multi: 'Multiple (double) trigger', auto: 'Dynamic hyperinflation (auto-PEEP)'
};
var IDQ = 'Which patient-ventilator interaction is this?';

/* EASY ───────────────────────── */
add({ id: 'mode', diff: 'easy', build: function (r) {
  var v = pick(r, ['vc', 'pc', 'psv']);
  var sc = v === 'vc' ? { vent: { mode: 'vc-cmv', VT: rng(r, .4, .5, .01), flow: pick(r, [50, 60]), RR: rng(r, 14, 18, 1), PEEP: 5 } }
        : v === 'pc' ? { vent: { mode: 'pc-cmv', Pinsp: rng(r, 12, 18, 1), Ti: rng(r, .8, 1.1, .05), RR: rng(r, 14, 18, 1), PEEP: 5 } }
        : { vent: { mode: 'psv', PS: rng(r, 8, 12, 1), PEEP: 5, ETS: 25 }, drive: { on: true, rate: rng(r, 16, 22, 1), amp: 6, ti: 0.9, tr: 0.4, jitter: 0.2 } };
  sc.hideMode = true;
  var opts = ['AC/VC (VC-CMVs)', 'AC/PC (PC-CMVs)', 'PSV (PC-CSVs)', 'APRV (PC-IMV(1)s,s)'];
  var ans = { vc: 0, pc: 1, psv: 2 }[v];
  var why = { vc: 'Flow is <b>square and identical</b> every breath while pressure rises and varies: the ventilator controls flow (volume control), and every breath is mandatory.',
              pc: 'Pressure is <b>square</b> while flow <b>decays exponentially</b>: the ventilator controls pressure. Breaths are time-triggered and time-cycled at a fixed Ti, so this is assist-control pressure control.',
              psv: 'Pressure is square (pressure control), but <b>every breath is patient-triggered</b> (orange marks), the rate and Ti vary breath to breath and each breath ends when flow decays: continuous spontaneous ventilation.' }[v];
  return { sc: sc, vig: 'You walk into the room and the settings screen is hidden. Read the scalars.', q: 'Which mode most likely produced these waveforms?', opts: opts, ans: ans, why: why, look: 'Step 1 of reading waveforms: define the mode. Which variable is controlled (square), and are breaths triggered by time or by the patient?' };
} });

add({ id: 'load', diff: 'easy', build: function (r) {
  var el = r() < 0.5, preset = el ? pick(r, ['fibrosis', 'ards']) : pick(r, ['plug', 'asthma']);
  var sc = { preset: preset, vent: { mode: 'vc-cmv', VT: rng(r, .4, .45, .01), flow: 60, RR: 14, PEEP: 5, pause: 0.5 } };
  return { sc: sc, chipsFrom: function (R) { var b = R.breaths.filter(function (x) { return x.t0 > R.t0; })[0] || R.breaths[R.breaths.length - 1]; var pl = R.S.filter(function (s) { return s.phase === 'pause'; }); var pp = pl.length ? pl[pl.length - 1].P : null; return ['Ppeak ' + Math.round(b.Ppeak), pp ? 'Pplat ' + Math.round(pp) : '']; },
    vig: 'AC/VC with a 0.5-second end-inspiratory pause on every breath.', q: 'What is the dominant load?',
    opts: ['Increased elastic load (low compliance)', 'Increased resistive load', 'Normal loads', 'Patient inspiratory effort'], ans: el ? 0 : 1,
    why: el ? 'Peak and plateau are <b>both high</b> and close together (Ppeak − Pplat &lt; 10): the balloon is stiff. Think ARDS, pneumonia, edema, fibrosis, effusion, obesity.' : 'There is a <b>big drop from peak to plateau</b> (≥ 10 cmH₂O) with a near-normal plateau: the straw is narrow. Think bronchospasm, a kinked or bitten tube, secretions.',
    look: 'During the pause flow is zero, so resistance drops out and only the elastic (alveolar) pressure remains.',
    hl: function (R) { return R.S.filter(function (s, i, a) { return s.phase === 'pause' && (i === 0 || a[i - 1].phase !== 'pause'); }).map(function (s) { return hl(s.t - 0.35, s.t + 0.5, 'Ppeak → Pplat', HL_TEAL); }); } };
} });

add({ id: 'auto', diff: 'easy', build: function (r) {
  var sc = { preset: pick(r, ['copd', 'asthma']), vent: { mode: 'vc-cmv', VT: rng(r, .5, .6, .01), flow: pick(r, [40, 45, 50]), RR: rng(r, 24, 28, 1), PEEP: 5 } };
  return { sc: sc, vig: 'Intubated for an exacerbation of obstructive lung disease. The nurse says the blood pressure keeps drifting down.', q: 'What does the flow scalar show?',
    opts: ['Expiratory flow never returns to zero: dynamic hyperinflation (auto-PEEP)', 'Failed triggers', 'Early cycle', 'Circuit leak with false triggers'], ans: 0,
    why: 'Each new breath starts while gas is still flowing out: <b>expiratory flow does not return to baseline</b>. That is air trapping (auto-PEEP), which raises intrathoracic pressure and impairs venous return.',

add({ id: 'failed', diff: 'easy', build: function (r) {

    look: 'Expiratory flow deflects toward zero (and airway pressure dips) without a breath following.',
    check: function (R) { return failedEfforts(R).length >= 1; },
    hl: function (R) { return failedEfforts(R).map(function (e) { return hl(e.t0, e.t0 + e.tc + 0.2, 'missed', HL_RED); }); } };
} });

add({ id: 'starve', diff: 'easy', build: function (r) {
  var sc = { vent: { mode: 'vc-cmv', VT: rng(r, .42, .5, .01), flow: pick(r, [25, 30, 35]), RR: 12, PEEP: 5 }, drive: { on: true, rate: rng(r, 20, 24, 1), amp: rng(r, 13, 16, 1), ti: 0.95, tr: 0.4, jitter: 0.08 } };

add({ id: 'double', diff: 'easy', build: function (r) {
  var sc = { vent: { mode: 'vc-cmv', VT: rng(r, .36, .42, .01), flow: pick(r, [60, 70]), RR: 14, PEEP: 5 }, drive: { on: true, rate: rng(r, 16, 20, 1), amp: rng(r, 9, 12, 1), ti: rng(r, 1.3, 1.5, .05), tr: 0.4, jitter: 0.06 } };

    check: function (R) { return doubles(R).length >= 1; },

add({ id: 'tau', diff: 'easy', build: function (r) {
  var stiff = r() < 0.5;
  var sc = { preset: stiff ? 'fibrosis' : 'copd', vent: { mode: 'pc-cmv', Pinsp: stiff ? 18 : 14, Ti: 1.0, RR: 12, PEEP: 5 } };

} });

/* MEDIUM ───────────────────────── */
add({ id: 'late', diff: 'medium', build: function (r) {
  var sc = { vent: { mode: pick(r, ['pc-cmv', 'vc-cmv']), Pinsp: 14, Ti: 0.9, VT: .45, flow: 60, RR: 8, PEEP: 5, trig: 'pressure', trigP: rng(r, 5, 7, .5) }, drive: { on: true, rate: rng(r, 16, 20, 1), amp: rng(r, 8, 10, .5), ti: 0.9, tr: 0.4, jitter: 0.08 } };

} });

add({ id: 'ecyc', diff: 'medium', build: function (r) {
  var sc = { preset: pick(r, ['fibrosis', 'ards']), vent: { mode: 'psv', PS: rng(r, 8, 11, 1), PEEP: 5, ETS: pick(r, [45, 50, 55]), trigFlow: 4 }, drive: { on: true, rate: rng(r, 18, 22, 1), amp: rng(r, 5, 6.5, .5), ti: rng(r, 1.2, 1.4, .05), tr: 0.45, jitter: 0.06 } };

    look: 'End-inspiratory pressure overshoot and a steep fall in flow before cycling.',
    check: function (R) { return lateCycles(R).length >= 1; },
    hl: function (R) { return lateCycles(R).map(function (b) { return hl(effortEnd(b.effort) + b.effort.tr * 0.5, b.tExp + 0.05, 'pushing', HL_AMB); }); } };
} });

add({ id: 'false-leak', diff: 'medium', build: function (r) {
  var sc = { vent: { mode: pick(r, ['psv', 'pc-cmv']), PS: 10, Pinsp: 12, Ti: 0.9, RR: 8, PEEP: 5, trigFlow: rng(r, 1.5, 2, .5) }, patient: { leak: rng(r, 1.3, 1.7, .1) } };

add({ id: 'false-card', diff: 'medium', build: function (r) {

/* ───────── generate a playable case ───────── */
function makeCase(tpl, seed) {
  for (var tries = 0; tries < 6; tries++) {
    var r = mulberry32(seed + tries * 7919);
    var c = tpl.build(r);
    var R = runCase(c.sc, seed + tries);
    if (!c.check || c.check(R)) {
      // shuffle options, remembering the answer
      var order = c.opts.map(function (o, i) { return i; });
      for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
      var opts = order.map(function (k) { return c.opts[k]; }), ans = order.indexOf(c.ans);
      var chips = chipsFor(c.sc, R).map(function (x) { return x; });
      if (c.chipsFrom) c.chipsFrom(R).forEach(function (t) { if (t) chips.push({ t: t }); });
      return { id: tpl.id, diff: tpl.diff, R: R, sc: c.sc, vig: c.vig, q: c.q, opts: opts, ans: ans, why: c.why, look: c.look, chips: chips, hls: c.hl ? c.hl(R) : [] };
    }
  }
  return null;
}
root.VLCases = { T: T, makeCase: makeCase, runCase: runCase };
