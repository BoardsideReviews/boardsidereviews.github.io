<html lang="en">
<head>
<meta charset="utf-8">

<title>IM Night Float | Boardside Reviews</title>
<meta name="description" content="A free internal medicine night float simulator. Answer overnight pages, work up patients, make the call, and collect teaching pearls.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20role%3D%22img%22%20aria-label%3D%22Boardside%20Reviews%20mark%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2242%22%20fill%3D%22%23fff%22%20stroke%3D%22%230B2545%22%20stroke-width%3D%227%22/%3E%3Cpath%20fill%3D%22%230B2545%22%20d%3D%22M35.326%2C27.0%20H51.38%20A11.5%2C11.5%200%200%201%2051.38%2C50%20H43.008%20V73.0%20H35.326%20Q34.59%2C73.0%2034.59%2C72.264%20V27.736%20Q34.59%2C27.0%2035.326%2C27.0%20Z%22/%3E%3Cpath%20fill%3D%22%230D7070%22%20d%3D%22M43.008%2C50%20H53.91%20A11.5%2C11.5%200%200%201%2053.91%2C73.0%20H43.008%20Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Boardside Reviews: IM Night Float. Pager amber on a 3 AM dark. */
:root{
  --ink:#0d1422; --panel:#151f31; --panel2:#1c2942; --line:#2b3b59;
  --fg:#e6ebf2; --muted:#94a2b9; --amber:#f0b54a; --amber-ink:#1d1504; --lcd:#1a1608;
  --ok:#5cc394; --fair:#8fb3e8; --crit:#ee6b5d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-weight:600;font-size:26px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.prog{flex:1;min-width:0}
.track{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--amber)}
.score{text-align:right}
.score b{font-family:var(--mono);font-size:20px;display:block;line-height:1.1}

/* start */
.hero{padding-top:28px;display:grid;gap:22px}
.hero h1{font-size:clamp(56px,16vw,96px);line-height:.88;text-transform:uppercase}
.hero h1 span{color:var(--amber)}
.sub{color:var(--muted);font-size:17px;max-width:46ch}
.pager{background:#2a2f38;border-radius:18px;padding:14px;box-shadow:inset 0 -3px 0 #1d2128}
.lcd{background:var(--lcd);border-radius:8px;padding:14px 16px;font-family:var(--mono);color:var(--amber);font-size:14px;line-height:1.55;min-height:96px;
  text-shadow:0 0 6px rgba(240,181,74,.35)}
.lcd .dim{opacity:.55}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.modes{display:grid;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.mode:hover{border-color:var(--amber)}
.mode h3{font-size:24px}
.mode p{margin:2px 0 0;color:var(--muted);font-size:15px}
.mode .go{font-family:var(--display);font-weight:700;background:var(--amber);color:var(--amber-ink);border-radius:8px;padding:8px 14px;letter-spacing:.06em;white-space:nowrap}
ol.how{margin:0;padding-left:22px;display:grid;gap:6px;color:var(--fg)}
ol.how li::marker{font-family:var(--mono);color:var(--amber)}
.fine{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* board */
.sec{margin-top:22px;display:grid;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.page{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
.page:hover{border-color:#40557d}
.page .room{font-family:var(--mono);font-weight:600;font-size:15px}
.page .time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.page .msg{grid-column:1/-1;color:var(--fg);font-size:15px;min-width:0}
.page.done{opacity:.6}
.chip{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap;justify-self:end}
.c-new{background:var(--amber);color:var(--amber-ink)}
.c-prog{background:var(--panel2);color:var(--fair)}
.c-rrt{background:var(--crit);color:#1d0805}
.c-done{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.quiet{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;justify-items:start}
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:10px;padding:11px 16px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

/* case */
.back{background:none;border:0;color:var(--muted);padding:14px 0 0;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.chead{margin-top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chead h2{font-size:30px;line-height:1}
.who{color:var(--muted);margin-top:4px}
.bubble{margin-top:14px;background:var(--panel2);border-radius:4px 14px 14px 14px;padding:12px 14px}
.bubble .label{display:block;margin-bottom:2px}
.rrt{margin-top:12px;border:1px solid var(--crit);color:var(--crit);border-radius:10px;padding:10px 12px;font-weight:600}
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;margin-top:14px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vitals div{background:var(--panel);padding:8px 6px;text-align:center;min-width:0}
.vitals .label{font-size:11px}
.vitals b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx{margin-top:12px;color:var(--muted);font-size:15px}
.orders{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.order:hover:not(:disabled){border-color:var(--amber)}
.order:disabled{opacity:.4;cursor:default}
.order .mono{font-size:12px;color:var(--amber)}
.log{display:grid;gap:8px}
.res{background:var(--panel);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.res .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.res .top span:first-child{font-weight:600}
.res p{margin:4px 0 0;font-size:15px}
.flag{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.f-key{color:var(--ok)} .f-low{color:var(--crit)} .f-ok{color:var(--muted)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.q h3{font-family:var(--body);font-weight:600;font-size:17px;letter-spacing:0}
.opt{text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:12px;font-size:15px}
.opt:hover{border-color:var(--amber)}
.ans{border-radius:10px;padding:12px;border:1px solid var(--line);font-size:15px}
.ans .pick{font-weight:600}
.ans p{margin:6px 0 0;color:var(--fg)}
.s-best{border-color:var(--ok)} .s-best .flag{color:var(--ok)}
.s-ok{border-color:var(--fair)} .s-ok .flag{color:var(--fair)}
.s-bad{border-color:var(--crit)} .s-bad .flag{color:var(--crit)}
.att{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);text-align:left}
.attq{font-style:italic;color:var(--fair);border-left:2px solid var(--fair);padding-left:12px}
.pearls{background:var(--lcd);border:1px solid #3a3115;border-radius:12px;padding:16px;display:grid;gap:8px}
.pearls h3{color:var(--amber);font-size:22px}
.pearls ul{margin:0;padding-left:18px;display:grid;gap:6px}
.dx{font-family:var(--display);font-size:20px;font-weight:600}

/* debrief */
.big{font-family:var(--mono);font-size:56px;font-weight:600;color:var(--amber);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border-radius:10px;padding:10px}
.stat b{font-family:var(--mono);font-size:22px;display:block}
details.dcase{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.dcase summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.dcase summary::-webkit-details-marker{display:none}
details.dcase ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:15px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;gap:6px;width:min(420px,calc(100% - 32px))}
.t{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:in .25s ease-out}
.t.crit{background:var(--crit);color:#1d0805}
@keyframes in{from{transform:translateY(8px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.blink,.t{animation:none}}
@media (max-width:420px){.vitals b{font-size:12px}.orders{grid-template-columns:1fr}}

.site{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 0}
.site a{color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px}
.site a svg{width:34px;height:34px;display:block}
.site .crumb{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.site .crumb:hover{color:var(--amber)}
a.btn{text-decoration:none;display:inline-block}
.promo{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.promo div{display:grid;gap:4px;min-width:0;flex:1 1 260px}
.promo b{font-family:var(--display);font-size:19px}
.promo span{color:var(--muted);font-size:15px}
</style>
</head>
<body>

<header class="site wrap"><a href="/" aria-label="Boardside Reviews home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boardside Reviews mark"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#0B2545" stroke-width="7"/><path fill="#0B2545" d="M35.326,27.0 H51.38 A11.5,11.5 0 0 1 51.38,50 H43.008 V73.0 H35.326 Q34.59,73.0 34.59,72.264 V27.736 Q34.59,27.0 35.326,27.0 Z"/><path fill="#0D7070" d="M43.008,50 H53.91 A11.5,11.5 0 0 1 53.91,73.0 H43.008 Z"/></svg><span>Boardside Reviews</span></a><a class="crumb" href="/#games">Gamified Learning</a></header>
<div class="bar" id="bar" hidden><div class="wrap">
  <div class="clock" id="clock">19:00</div>
  <div class="prog"><span class="label" id="census">Census</span><div class="track"><i id="trk" style="width:0"></i></div></div>
  <div class="score"><span class="label">Score</span><b id="score">0</b></div>
</div></div>
<main class="wrap" id="app"></main>
<div id="toast" aria-live="polite"></div>

<script>
const CASES=[
{id:"hyperk",core:1,room:"4B-12",who:"68M · ESRD on HD (MWF)",arrive:15,dl:45,dx:"Hyperkalemia with ECG changes",
 nurse:"Routine K came back 6.9. He missed dialysis today. Says he feels a little weak.",
 hx:"Admitted for left leg cellulitis. Anuric. Last dialysis Monday.",
 v:{T:"36.8",HR:"56",BP:"148/82",RR:"16",SpO2:"97% RA"},
 work:[
  {l:"12-lead ECG",m:10,v:"key",r:"Sinus bradycardia 56. Peaked T waves V2–V4. QRS 128 ms (baseline 96)."},
  {l:"Bedside exam",m:5,v:"key",r:"Alert, mild proximal weakness. Left arm AV fistula with good thrill. No edema."},
  {l:"Repeat K, no tourniquet",m:40,v:"ok",r:"K 6.8, not hemolyzed. Confirms it, but the ECG already told you to act."},
  {l:"Venous blood gas",m:15,v:"ok",r:"pH 7.31, HCO3 18."},
  {l:"Renal ultrasound",m:60,v:"low",r:"Small echogenic kidneys. Known ESRD; changes nothing tonight."}],
 steps:[
  {q:"ECG changes are present. What do you give first?",o:[
   {t:"Calcium gluconate 1 g IV over 2–3 min, repeat if the ECG is unchanged",s:"best",f:"Calcium stabilizes the cardiac membrane within minutes. It does not lower K, so shifting and removal come next."},
   {t:"Regular insulin 10 units IV with D50",s:"ok",f:"Shifting is needed, but with a widened QRS the myocardium needs protection first. Calcium, then insulin."},
   {t:"Sodium polystyrene 30 g PO and recheck in 4 h",s:"bad",f:"Too slow and unreliable for an emergency, with a risk of bowel necrosis."},
   {t:"Furosemide 80 mg IV",s:"bad",f:"He is anuric. Loop diuretics only help if the kidneys make urine."}]},
  {q:"He is stabilized and shifted. Definitive plan?",o:[
   {t:"Call nephrology for urgent dialysis tonight",s:"best",f:"Dialysis is the only real removal route when anuric. Insulin's effect wears off in 2–4 h."},
   {t:"Patiromer now, dialysis at the next scheduled session",s:"ok",f:"Binders help, but with QRS widening tonight he needs dialysis tonight."},
   {t:"Repeat insulin and dextrose every 4 h until Monday",s:"bad",f:"Insulin only moves K into cells. Total body K stays high, and repeated doses risk hypoglycemia."}]}],
 att:"ECG changes mean calcium first. Then shift, then get him dialyzed. Call renal tonight, not at 7.",
 pearls:["Calcium protects the heart but does not lower K. Onset 1–3 min, lasts 30–60 min.","In ESRD, consider 5 units of insulin instead of 10 and check glucose hourly for 4–6 h.","Chase pseudohyperkalemia (hemolysis, fist clenching, thrombocytosis) only when the ECG is normal."]},

{id:"sepsis",core:1,room:"6W-22",who:"74F · pyelonephritis, HTN",arrive:40,dl:45,dx:"Septic shock from obstructed pyelonephritis",
 nurse:"BP 82/46, was 128/70 at 4 PM. She's sleepier. Got her evening lisinopril and amlodipine an hour ago.",
 hx:"Admitted this afternoon with right pyelonephritis on ceftriaxone. Urine culture pending.",
 v:{T:"38.9",HR:"118",BP:"82/46",RR:"24",SpO2:"94% RA"},
 work:[
  {l:"Bedside exam",m:5,v:"key",r:"Drowsy, oriented ×2. Cap refill 4 s, mottled knees. Right CVA tenderness. Lungs clear."},
  {l:"Lactate",m:20,v:"key",r:"Lactate 4.1 mmol/L."},
  {l:"Blood cultures ×2",m:10,v:"key",r:"Drawn from two sites before changing antibiotics."},
  {l:"Review MAR",m:5,v:"key",r:"Lisinopril 20 mg and amlodipine 10 mg at 19:00. Ceftriaxone 1 g at 15:00."},
  {l:"Renal ultrasound",m:20,v:"key",r:"Moderate right hydronephrosis with a 9 mm proximal ureteral stone."},
  {l:"Procalcitonin",m:30,v:"low",r:"12 ng/mL. You already knew she was septic."}],
 steps:[
  {q:"MAP is 58. First move?",o:[
   {t:"30 mL/kg balanced crystalloid, hold antihypertensives, broaden antibiotics after cultures",s:"best",f:"Hypotension with lactate ≥4 is septic shock. Fluids, early antibiotics, and stop the BP meds."},
   {t:"Start norepinephrine now, no fluid",s:"ok",f:"Early pressors are reasonable, but she is dry and hypoperfused. Give the fluid too."},
   {t:"Recheck BP in 1 h. Probably her BP meds",s:"bad",f:"Fever, tachycardia, lactate 4 and confusion. This is shock, and an hour matters."}]},
  {q:"After 2 L, MAP 62. Ultrasound shows an obstructing 9 mm stone with hydronephrosis.",o:[
   {t:"Start norepinephrine, ICU consult, urgent urology or IR decompression tonight",s:"best",f:"An infected obstructed kidney is a urologic emergency. Antibiotics fail without drainage."},
   {t:"Another 3 L of fluid before any pressor",s:"ok",f:"Fluid responsiveness falls off. Reassess with exam or POCUS rather than reflexively adding liters."},
   {t:"Continue antibiotics, urology in the morning",s:"bad",f:"Source control can't wait for rounds. Undrained pus drives ongoing shock."}]}],
 att:"Infected and obstructed is a drainage problem. Get urology or IR on the phone now and start pressors.",
 pearls:["Infected + obstructed kidney = emergency decompression (stent or nephrostomy).","Peripheral norepinephrine through a good proximal IV is reasonable short-term while central access is arranged.","Hold antihypertensives at the first sign of sepsis. The evening dose can unmask shock."]},

{id:"stemi",core:1,room:"5N-08",who:"61M · T2DM, smoker",arrive:95,dl:30,dx:"Inferior STEMI with RV involvement",
 nurse:"He has chest pressure, 8/10, started 15 min ago. He's sweaty.",
 hx:"Day 2 for right leg cellulitis. T2DM, HLD, 40 pack-years.",
 v:{T:"37.1",HR:"54",BP:"98/60",RR:"20",SpO2:"95% RA"},
 work:[
  {l:"12-lead ECG",m:5,v:"key",r:"ST elevation II, III, aVF (III > II). Reciprocal ST depression in aVL."},
  {l:"Right-sided ECG",m:5,v:"key",r:"1.5 mm ST elevation in V4R. RV involvement."},
  {l:"Bedside exam",m:5,v:"key",r:"Diaphoretic. JVP elevated. Lungs clear."},
  {l:"Portable CXR",m:20,v:"ok",r:"No acute process."},
  {l:"Wait for troponin",m:60,v:"low",r:"hs-troponin 48 ng/L. An hour spent on a test that doesn't change STEMI management."}],
 steps:[
  {q:"Inferior ST elevation. Next?",o:[
   {t:"Activate the STEMI team, aspirin 325 mg chewed, call cardiology",s:"best",f:"Time is myocardium. The ECG makes the diagnosis."},
   {t:"Nitroglycerin 0.4 mg SL for the pain",s:"bad",f:"With RV involvement he is preload dependent. Nitrates can crash his pressure."},
   {t:"Trend troponin and repeat the ECG in 1 h",s:"bad",f:"STEMI is an ECG diagnosis. Waiting delays reperfusion."}]},
  {q:"Waiting for the cath team, BP drifts to 84/52. Lungs clear, JVP up.",o:[
   {t:"500 mL IV fluid bolus, avoid nitrates and diuretics",s:"best",f:"RV infarct: a stiff, stunned RV needs filling pressure."},
   {t:"Furosemide 40 mg IV for the high JVP",s:"bad",f:"High JVP with clear lungs is RV failure, not volume overload."},
   {t:"Morphine 4 mg IV for comfort",s:"bad",f:"Morphine drops preload and BP, and slows absorption of oral P2Y12 inhibitors."}]}],
 att:"Inferior STEMI, get a V4R. If it's RV, no nitro, give volume. Activate the lab.",
 pearls:["Inferior STEMI: always get V4R. ST elevation ≥1 mm means RV involvement.","Hypotension + high JVP + clear lungs in inferior MI = RV infarct. Volume, no nitrates or diuretics.","Never wait for troponin when the ECG shows STEMI."]},

{id:"hypogly",core:1,room:"3E-15",who:"82F · CKD 4, T2DM",arrive:150,dl:30,dx:"Sulfonylurea hypoglycemia in CKD",
 nurse:"POC glucose 42. She is very drowsy and hard to wake.",
 hx:"Admitted for a CHF exacerbation. Poor appetite, ate about a quarter of her meals.",
 v:{T:"36.5",HR:"96",BP:"134/70",RR:"16",SpO2:"96% RA"},
 work:[
  {l:"Repeat POC glucose",m:5,v:"key",r:"38 mg/dL."},
  {l:"Check IV access",m:5,v:"key",r:"Working 20G in the left forearm."},
  {l:"Review MAR",m:5,v:"key",r:"Glipizide 10 mg at 08:00. Insulin glargine 12 units at 21:00."},
  {l:"Hemoglobin A1c",m:20,v:"low",r:"6.1%. Useful for the day team, not tonight."},
  {l:"CT head",m:45,v:"low",r:"No acute findings. Fix the glucose first."}],
 steps:[
  {q:"She has IV access and can't swallow safely.",o:[
   {t:"D50 25 g IV push now",s:"best",f:"Fastest correction. Recheck in 15 min."},
   {t:"Glucagon 1 mg IM",s:"ok",f:"Right with no IV. You have a line, and IV dextrose is faster."},
   {t:"Juice by mouth",s:"bad",f:"A drowsy patient can aspirate. Nothing by mouth until she's awake."}]},
  {q:"She wakes up, glucose 168. Plan for the rest of the night?",o:[
   {t:"Stop glipizide, reduce basal insulin, start a D10 infusion, glucose hourly; octreotide if it recurs",s:"best",f:"Glipizide plus CKD means prolonged hypoglycemia. Expect it to come back."},
   {t:"Give another amp of D50 to be safe",s:"bad",f:"Big dextrose boluses trigger more insulin release from sulfonylurea-stimulated beta cells."},

 pearls:["Chronic hyponatremia: aim for a rise of 4–8 mEq/L in 24 h. Never exceed 10–12, or 8 if high risk (alcohol use, malnutrition, hypokalemia, liver disease).","Once the cause is removed, a water diuresis drives overcorrection. Watch urine output.","Severe symptoms (seizure, obtundation): 3% 100–150 mL bolus, may repeat, aim for a 4–6 rise."]},

{id:"flash",room:"5N-14",who:"72M · HFrEF (EF 25%), CKD 3",dl:30,dx:"Hypertensive acute pulmonary edema (SCAPE)",

 pearls:["IM epinephrine 0.01 mg/kg (max 0.5 mg in adults) in the thigh is first line. There is no absolute contraindication in anaphylaxis.","Patients on beta-blockers may be refractory to epinephrine; glucagon is an option.","Document the allergy and observe for biphasic reactions."]},

{id:"opioid",room:"7S-12",who:"68M · POD 1 colectomy, CKD 3",dl:15,dx:"Opioid-induced respiratory depression",
 nurse:"He's really hard to wake up. RR 6 and sat 85%.",
 hx:"Hydromorphone PCA since surgery. Gabapentin added this evening for pain.",
 v:{T:"36.8",HR:"64",BP:"108/62",RR:"6",SpO2:"85% RA"},
 work:[
  {l:"Bedside exam",m:3,v:"key",r:"Responds only to sternal rub. Pinpoint pupils. Shallow breathing."},
  {l:"PCA log and MAR",m:5,v:"key",r:"18 PCA demands in 4 h. Gabapentin 300 mg at 21:00."},
  {l:"POC glucose",m:3,v:"key",r:"132 mg/dL."},
  {l:"Arterial blood gas",m:15,v:"ok",r:"pH 7.24, PaCO2 62."},
  {l:"CT head",m:45,v:"low",r:"Normal. The pupils and the PCA log pointed elsewhere."}],
 steps:[
  {q:"Opioid toxidrome. First move?",o:[
   {t:"Stop the PCA, bag-mask ventilate, naloxone 0.04–0.1 mg IV every 2–3 min titrated to breathing",s:"best",f:"Support ventilation, then titrate small doses to respiratory rate, not full wakefulness."},
   {t:"Naloxone 2 mg IV push",s:"ok",f:"It will work, but a large bolus post-op can cause abrupt severe pain, hypertension, and pulmonary edema."},
   {t:"Non-rebreather and recheck in 30 min",s:"bad",f:"Oxygen fixes the sat but not the hypoventilation. His CO2 keeps rising."}]},
  {q:"After 0.2 mg total he's breathing 14/min. Now?",o:[
   {t:"Continuous oximetry and capnography, repeat naloxone or start an infusion if he re-sedates, stop gabapentin, reduce opioid dosing",s:"best",f:"Naloxone wears off in 30–90 min. Hydromorphone and renally cleared gabapentin outlast it."},

 pearls:["Naloxone lasts 30–90 min; many opioids last longer. Watch for re-sedation.","In post-op or opioid-dependent patients, titrate 0.04–0.1 mg IV to respiratory rate.","Gabapentinoids plus opioids, CKD, and older age raise the risk of respiratory depression."]},

{id:"stroke",room:"5N-27",who:"74F · CHF, hypertension",dl:20,dx:"Acute ischemic stroke with large vessel occlusion",
 nurse:"She can't move her right arm and her speech is garbled. She was talking normally 30 minutes ago.",
 hx:"Admitted for a CHF exacerbation. Not anticoagulated. No recent surgery or bleeding.",
 v:{T:"36.9",HR:"96",BP:"178/96",RR:"18",SpO2:"96% RA"},
 work:[
  {l:"POC glucose",m:3,v:"key",r:"138 mg/dL. Hypoglycemia excluded."},
  {l:"NIH Stroke Scale",m:5,v:"key",r:"NIHSS 14: right face, arm, and leg weakness, global aphasia, left gaze preference."},
  {l:"CT head and CTA head/neck",m:25,v:"key",r:"No hemorrhage. Left M1 occlusion."},
  {l:"12-lead ECG",m:5,v:"ok",r:"New atrial fibrillation, rate 96."},
  {l:"MRI brain",m:60,v:"low",r:"Not the first test in a stroke code. That was an hour of brain."}],
 steps:[
  {q:"Deficit began about 30 min ago. First move?",o:[
   {t:"Call a stroke code now: glucose, then CT and CTA",s:"best",f:"Time is brain. In-hospital strokes are often recognized and treated late."},
   {t:"Aspirin 325 mg now",s:"bad",f:"Hemorrhage hasn't been excluded, and aspirin is held for 24 h after thrombolysis."},
   {t:"IV labetalol to a systolic of 140",s:"bad",f:"Only lower to below 185/110 to allow thrombolysis. Over-lowering can extend the infarct."}]},
  {q:"No bleed. Left M1 occlusion. 50 min from last known well, BP 178/96.",o:[
   {t:"Thrombolysis if no contraindications, plus endovascular thrombectomy",s:"best",f:"Eligible for lysis within 4.5 h, and LVO qualifies for thrombectomy. Lysis should not delay thrombectomy."},
   {t:"Thrombectomy only, no thrombolysis",s:"ok",f:"Appropriate if lytics are contraindicated; otherwise eligible patients get both."},
   {t:"Start heparin for the new AF",s:"bad",f:"Early full anticoagulation in acute stroke raises hemorrhagic transformation risk. Timing is decided later."}]}],
 att:"Call the code. Glucose, CT, CTA. Keep her BP under 185/110 but don't drop it further.",
 pearls:["Check glucose before calling it a stroke.","Thrombolysis within 4.5 h of last known well. BP must be below 185/110 before and below 180/105 after.","Thrombectomy for large vessel occlusion can be offered up to 24 h in selected patients."]},

{id:"sz",room:"4B-19",who:"52M · epilepsy, cellulitis",dl:10,dx:"Status epilepticus",
 nurse:"He's seizing! Whole body, started about 5 minutes ago.",
 hx:"Known epilepsy on levetiracetam. Both doses were held today because he was NPO for a procedure.",
 v:{T:"37.8",HR:"132",BP:"168/94",RR:"8",SpO2:"88% RA"},
 work:[
  {l:"Side position, suction, O2",m:2,v:"key",r:"On his side, suctioned, non-rebreather on. Nothing placed in his mouth."},
  {l:"POC glucose",m:2,v:"key",r:"96 mg/dL."},
  {l:"Review MAR",m:3,v:"key",r:"Levetiracetam 1000 mg BID, both doses held today for NPO status."},
  {l:"Na, Ca, Mg",m:20,v:"ok",r:"Na 137, Ca 9.1, Mg 1.9."},
  {l:"EEG",m:60,v:"low",r:"Not available until morning. Treat now; EEG later if he doesn't wake."}],
 steps:[
  {q:"Seizing over 5 min, IV in place. Weight 80 kg.",o:[
   {t:"Lorazepam 4 mg IV; repeat once in 5 min if still seizing",s:"best",f:"Benzodiazepine first, at full dose. Underdosing is the most common error."},
   {t:"Lorazepam 1 mg IV and wait",s:"bad",f:"Too small. The dose is 0.1 mg/kg up to 4 mg."},
   {t:"Load levetiracetam first, no benzodiazepine",s:"bad",f:"Benzodiazepines are first line. Second-line agents come next."}]},
  {q:"Still seizing after two doses of lorazepam.",o:[
   {t:"Levetiracetam 60 mg/kg IV (max 4500 mg), or fosphenytoin or valproate; call the ICU",s:"best",f:"These performed similarly in ESETT. Refractory status needs ICU care."},
   {t:"A third and fourth dose of lorazepam",s:"bad",f:"Benzodiazepines lose effect as status continues. Move to a second-line agent."},
   {t:"Wait it out; it's his usual seizure",s:"bad",f:"Over 5 min is status. Neuronal injury and complications rise with time."}]}],
 att:"Full-dose benzo, then load a second agent. Don't drip in small doses.",
 pearls:["Status epilepticus: 5 min or more of seizure, or repeated seizures without recovery between.","Lorazepam 0.1 mg/kg IV up to 4 mg per dose; midazolam 10 mg IM if there's no IV.","ESETT: levetiracetam, fosphenytoin, and valproate were similarly effective second-line agents."]},

{id:"ama",room:"6W-17",who:"55M · community-acquired pneumonia",dl:60,dx:"Leaving against medical advice: capacity assessment",
 nurse:"He's dressed and says he's leaving. He wants to talk to the doctor first.",
 hx:"Day 2 on IV ceftriaxone and azithromycin, improving. Lives alone with his dog.",
 v:{T:"37.5",HR:"92",BP:"132/80",RR:"18",SpO2:"94% RA"},
 work:[
  {l:"Sit down and talk with him",m:10,v:"key",r:"His dog has been alone for 2 days and no one can check on it. He would stay otherwise."},
  {l:"Assess capacity",m:10,v:"key",r:"He explains his diagnosis, the risks of leaving including worsening infection and death, and the alternatives. His reasoning fits his values."},
  {l:"Review labs and trend",m:5,v:"ok",r:"WBC trending down, afebrile 24 h."},
  {l:"Psychiatry consult",m:30,v:"low",r:"Not needed. Any physician can assess capacity; psychiatry is for complex cases."}],
 steps:[
  {q:"He has capacity and still wants to leave.",o:[
   {t:"Respect his choice: oral antibiotics, follow-up, return precautions, and document the capacity discussion",s:"best",f:"A patient with capacity may refuse care. Harm reduction keeps him safer than an empty discharge."},
   {t:"Tell him insurance won't pay if he leaves AMA",s:"bad",f:"That's a myth, and it damages trust."},
   {t:"Ask security to keep him on the unit",s:"bad",f:"Holding a patient who has capacity is unlawful restraint."}]}],
 att:"If he has capacity, it's his call. Send him out safely with antibiotics and a way back.",
 pearls:["Capacity: understand, appreciate, reason, and express a consistent choice. Any physician can assess it.","Capacity is decision-specific and can change.","Leaving AMA isn't the end of care: prescriptions, follow-up, and an open invitation to return."]},

{id:"goc",room:"8N-14",who:"88F · metastatic pancreatic cancer",dl:60,dx:"Goals-of-care conversation at night",
 nurse:"Her BP is soft and she's more confused. Her daughter is asking if we'll “do everything.” She's full code.",
 hx:"Progressed on second-line chemotherapy. Oncology note: no further cancer-directed options. Bedbound most of the day.",
 v:{T:"38.2",HR:"112",BP:"92/54",RR:"22",SpO2:"93% 2L"},
 work:[
  {l:"Review oncology and clinic notes",m:10,v:"key",r:"No further chemotherapy recommended. A clinic note quotes her saying she does not want to die on machines."},
  {l:"Look for an advance directive",m:5,v:"key",r:"Scanned directive from 2024 naming her daughter as health care proxy."},
  {l:"See the patient",m:5,v:"key",r:"Confused, unable to take part in decisions tonight."},
  {l:"Lactate and cultures",m:20,v:"ok",r:"Lactate 3.2. Cultures sent."}],
 steps:[
  {q:"How do you start with her daughter?",o:[
   {t:"Ask what she understands, share the news honestly, explore what her mother valued, then recommend",s:"best",f:"Understanding and values before options. A recommendation spares her deciding alone."},
   {t:"List the options: CPR, intubation, pressors. Which does she want?",s:"bad",f:"A menu of procedures puts the full weight on the family and rarely reflects the patient's values."},
   {t:"Leave it for the day team",s:"ok",f:"Sometimes reasonable, but she's declining tonight. Talking now may prevent a code she wouldn't want."}]},
  {q:"Her daughter says her mother never wanted machines.",o:[
   {t:"Recommend DNR/DNI, continue treatments that fit her goals, involve palliative care",s:"best",f:"Code status and treatment goals are separate. Antibiotics and comfort can continue."},
   {t:"Make her comfort-only right away",s:"ok",f:"That may be right, but DNR doesn't mean do-not-treat. Clarify which treatments still fit her goals."},
   {t:"Keep her full code until oncology weighs in",s:"bad",f:"The proxy has told you the patient's wishes. Waiting risks a code she wouldn't want."}]}],
 att:"Find out what she understands and what her mom valued. Then make a recommendation. Don't hand her a menu.",
 pearls:["Ask, tell, ask: understanding, then information, then values.","DNR is not do-not-treat.","Make a recommendation. Families often want guidance, not a menu."]},

{id:"uop",room:"7S-09",who:"70M · POD 1 hip replacement, BPH",dl:60,dx:"Low urine output from a blocked catheter",

{id:"sleep",room:"3E-09",who:"78F · pneumonia, mild cognitive impairment",dl:90,dx:"Inpatient insomnia in an older adult",

  {q:"What do you do?",o:[

{id:"co2",room:"4B-25",who:"66M · COPD exacerbation",dl:30,dx:"Oxygen-associated hypercapnic respiratory failure in COPD",

 work:[

  {l:"Arterial blood gas",m:15,v:"key",r:"pH 7.22, PaCO2 82, PaO2 210, HCO3 33."},

 steps:[
  {q:"Acute-on-chronic hypercapnic acidosis. Plan?",o:[

{id:"ca",room:"8N-22",who:"63F · multiple myeloma",dl:60,dx:"Severe hypercalcemia of malignancy",
 nurse:"Calcium came back 14.6. She's more confused tonight and has been vomiting.",

{id:"angio",room:"5N-03",who:"60M · hypertension, CKD",dl:15,dx:"ACE inhibitor angioedema",

{id:"hit",room:"6W-08",who:"64M · bowel resection, POD 7",dl:90,dx:"Heparin-induced thrombocytopenia with thrombosis",
 nurse:"Platelets dropped to 72 from 210 on admission. His left leg is newly swollen.",
 hx:"Subcutaneous heparin prophylaxis since surgery 7 days ago. No other new medications.",
 v:{T:"37.3",HR:"96",BP:"136/80",RR:"18",SpO2:"96% RA"},
 work:[
  {l:"4Ts score",m:5,v:"key",r:"8 of 8: fall >50% (2), onset day 5–10 (2), new thrombosis (2), no other cause (2). High probability."},
  {l:"Left leg duplex",m:30,v:"key",r:"Acute left femoral-popliteal DVT."},
  {l:"PF4/heparin antibody",m:10,v:"key",r:"Sent. Results tomorrow. Don't wait for it."},
  {l:"Peripheral smear",m:20,v:"ok",r:"No schistocytes, no platelet clumping."}],
 steps:[
  {q:"High 4Ts score with a new DVT. What now?",o:[
   {t:"Stop all heparin including flushes; start a non-heparin anticoagulant such as argatroban",s:"best",f:"HIT is prothrombotic. Stopping heparin isn't enough."},
   {t:"Stop heparin and start warfarin",s:"bad",f:"Warfarin in acute HIT can cause venous limb gangrene. Start it only after platelets recover, overlapping a non-heparin agent."},

 att:"High 4Ts and a clot. Stop every drop of heparin and start argatroban. Don't wait for the antibody.",
 pearls:["Typical HIT: platelet fall >50% 5–10 days after heparin exposure. Thrombosis, not bleeding, is the danger.","Treat on clinical suspicion with a non-heparin anticoagulant: argatroban, bivalirudin, fondaparinux, or a DOAC in selected patients (ASH 2018).","Don't start warfarin until platelets recover."]},

{id:"trxn",room:"3E-27",who:"71F · upper GI bleed",dl:15,dx:"Acute hemolytic transfusion reaction",

 work:[

const PTS={best:10,ok:4,bad:-8}, WPTS={key:2,ok:0,low:-1};
let S=null;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const fmt=t=>{const m=(19*60+t)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function best(){try{return +localStorage.getItem("imnf-best")||0}catch(e){return 0}}
function saveBest(p){try{if(p>best())localStorage.setItem("imnf-best",p)}catch(e){}}

function start(mode){
  const n=mode==="cloud"?13:8, deck=CASES.slice();
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  const slot=600/n;
  S={mode,t:0,score:0,view:"board",open:null,over:false,
     cs:deck.slice(0,n).map((c,i)=>({id:c.id,arr:Math.round(8+i*slot+Math.random()*slot*.7),dl:mode==="cloud"?Math.max(10,Math.round(c.dl*.75)):c.dl,arrived:false,late:false,done:false,w:[],a:[],att:false}))};
  tick(); render(); scrollTo(0,0);
}
const def=id=>CASES.find(c=>c.id===id);

function toast(msg,crit){const el=document.createElement("div");el.className="t"+(crit?" crit":"");el.textContent=msg;$("#toast").append(el);setTimeout(()=>el.remove(),3200)}

function tick(){
  for(const c of S.cs){const d=def(c.id);
    if(!c.arrived&&c.arr<=S.t){c.arrived=true;if(S.t>0)toast("Page · "+d.room+" · "+d.nurse.split(".")[0])}
    if(c.arrived&&!c.done&&!c.late&&S.t>c.arr+c.dl){c.late=true;S.score-=5;toast(d.room+": rapid response called",1)}
  }
  if(S.t>=720){S.t=720;S.over=true}
}
function advance(m){S.t=Math.min(720,S.t+m);tick()}

function render(){
  if(!S){$("#bar").hidden=true;$("#app").innerHTML=viewStart();return}
  if(S.over){$("#bar").hidden=true;$("#toast").innerHTML="";$("#app").innerHTML=viewDebrief();return}
  $("#bar").hidden=false;
  $("#clock").textContent=fmt(S.t);
  $("#score").textContent=S.score;
  const arr=S.cs.filter(c=>c.arrived).length, open=S.cs.filter(c=>c.arrived&&!c.done).length;
  $("#census").textContent=open+" open · "+arr+"/"+S.cs.length+" paged";
  $("#trk").style.width=(S.t/720*100)+"%";
  $("#app").innerHTML=S.view==="case"?viewCase(S.cs.find(c=>c.id===S.open)):viewBoard();
}

function viewStart(){
  const b=best();
  return `<section class="hero">
  <h1>Night<br><span>Float</span></h1>
  <p class="sub">Internal medicine cross-cover, 19:00 to 07:00. Answer pages, work up the patient, make the call, and collect a teaching pearl from every bedside.</p>
  <div class="pager" aria-hidden="true"><div class="lcd">
    <div class="dim">19:15 · PAGE 1 OF 8</div>
    <div>4B-12 RN: K 6.9 ON AM LAB. MISSED HD TODAY. PT C/O WEAKNESS. PLS CALL X4471<span class="blink">_</span></div>
  </div></div>
  <div class="modes">
    <button class="mode" data-act="start" data-m="std"><div><h3>Standard night</h3><p>8 random pages from a bank of ${CASES.length} cases.</p></div><span class="go">Take the pager</span></button>
    <button class="mode" data-act="start" data-m="cloud"><div><h3>Black cloud</h3><p>13 random pages, less time before a rapid response.</p></div><span class="go">Take the pager</span></button>
  </div>
  ${b?`<p class="label">Best night so far: ${b}%</p>`:""}
  <div><p class="label">How a shift works</p>
  <ol class="how">
    <li>Pages arrive as the clock runs. Each order and decision costs minutes.</li>
    <li>Open a page, order what you need, then commit to a plan.</li>
    <li>Leave a page too long and the nurse calls a rapid response.</li>
    <li>Low-value tests cost points. Calling the attending costs a little, and gets you a hint.</li>
    <li>Sign out at 07:00 with a score and every pearl from the night.</li>
  </ol></div>
  <p class="fine">For education only. Fictional patients; not medical advice. Doses and pathways vary by institution. Follow your local protocols.</p>
  </section>`;
}

function chip(c){
  if(c.done)return `<span class="chip c-done">Done</span>`;
  if(c.late)return `<span class="chip c-rrt">RRT</span>`;
  if(c.w.length||c.a.length)return `<span class="chip c-prog">Working</span>`;
  return `<span class="chip c-new">New</span>`;
}
function viewBoard(){
  const list=S.cs.filter(c=>c.arrived).sort((x,y)=>(x.done-y.done)||(x.arr-y.arr));
  const pending=list.filter(c=>!c.done).length, left=S.cs.filter(c=>!c.arrived).length;
  let quiet="";
  if(!pending){
    quiet=left?`<div class="quiet"><span>Pager's quiet. ${left} more page${left>1?"s":""} tonight.</span><button class="btn" data-act="wait">Rest until the next page</button></div>`
            :`<div class="quiet"><span>All pages answered. Nice night.</span><button class="btn" data-act="end">Sign out</button></div>`;
  }
  return `<section class="sec"><div class="sechead"><h2 style="font-size:24px">Pager</h2><span class="label">${S.mode==="cloud"?"Black cloud":"Standard"}</span></div>
  ${quiet}
  ${list.map(c=>{const d=def(c.id);return `<button class="page${c.done?" done":""}" data-act="open" data-id="${c.id}">
     <span class="room">${d.room}</span><span class="time">${fmt(c.arr)}</span>${chip(c)}
     <span class="msg">${esc(d.nurse)}</span></button>`}).join("")}
  ${pending&&left?`<button class="btn ghost" data-act="wait" style="justify-self:start">Ignore pager, wait for next page</button>`:""}
  ${!left&&pending?`<button class="btn ghost" data-act="end" style="justify-self:start">Sign out early</button>`:""}
  </section>`;
}

function viewCase(c){
  const d=def(c.id);
  const vit=Object.entries(d.v).map(([k,v])=>`<div><span class="label">${k==="SpO2"?"SpO₂":k}</span><b>${v}</b></div>`).join("");
  const orders=d.work.map((w,i)=>`<button class="order" data-act="work" data-i="${i}" ${c.w.includes(i)||c.done?"disabled":""}><span>${w.l}</span><span class="mono">+${w.m} min</span></button>`).join("");
  const log=c.w.map(i=>{const w=d.work[i];const lab={key:"High yield",ok:"Fine",low:"Low value"}[w.v];
    return `<div class="res"><div class="top"><span>${w.l}</span><span class="flag f-${w.v}">${lab}</span></div><p>${esc(w.r)}</p></div>`}).join("");
  const answered=c.a.map((oi,si)=>{const st=d.steps[si],o=st.o[oi];const lab={best:"Best call",ok:"Acceptable",bad:"Harmful"}[o.s];
    return `<div class="ans s-${o.s}"><div class="label">${esc(st.q)}</div><div class="pick" style="margin-top:4px">${esc(o.t)}</div><p><span class="flag">${lab} · </span>${esc(o.f)}</p></div>`}).join("");
  let cur="";
  if(!c.done){const st=d.steps[c.a.length];
    const n=st.o.length, seed=c.arr+c.a.length*3;
    const order=st.o.map((o,i)=>i).sort((x,y)=>((x*5+seed)%n)-((y*5+seed)%n));
    cur=`<div class="q"><span class="label">Decision ${c.a.length+1} of ${d.steps.length} · +5 min</span><h3>${esc(st.q)}</h3>
      ${order.map(i=>`<button class="opt" data-act="pick" data-i="${i}">${esc(st.o[i].t)}</button>`).join("")}</div>`;}
  const att=c.att?`<p class="attq">“${esc(d.att)}”</p>`:(!c.done?`<button class="att" data-act="att">Call the attending <span class="mono" style="color:var(--muted);font-size:13px">· +10 min · −3</span></button>`:"");
  const pearls=c.done?`<div class="pearls"><span class="label" style="color:var(--amber)">Teaching pearls</span><div class="dx">${esc(d.dx)}</div><ul>${d.pearls.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:"";
  return `<button class="back" data-act="board">← Pager</button>
  <div class="chead"><div><h2 class="mono">${d.room}</h2><div class="who">${d.who}</div></div>${chip(c)}</div>
  <div class="bubble"><span class="label">RN · ${fmt(c.arr)}</span>${esc(d.nurse)}</div>
  ${c.late&&!c.done?`<div class="rrt">Rapid response at the bedside. You were paged at ${fmt(c.arr)}.</div>`:""}
  <div class="vitals">${vit}</div>
  <p class="hx">${esc(d.hx)}</p>
  <section class="sec"><span class="label">Orders and bedside</span><div class="orders">${orders}</div>${log?`<div class="log">${log}</div>`:""}</section>
  <section class="sec"><span class="label">Your plan</span>${answered}${cur}${att}</section>
  ${pearls?`<section class="sec">${pearls}<button class="btn" data-act="board" style="justify-self:start">Back to pager</button></section>`:""}`;
}

function maxScore(){return S.cs.reduce((s,c)=>{const d=def(c.id);return s+d.work.filter(w=>w.v==="key").length*2+d.steps.length*10},0)}
function viewDebrief(){
  const mx=maxScore(), pct=Math.max(0,Math.round(S.score/mx*100));
  saveBest(pct);
  const grade=pct>=85?"Attending-ready":pct>=65?"Solid night":pct>=40?"Rough night":"Call your senior next time";
  const rrt=S.cs.filter(c=>c.late).length, low=S.cs.reduce((s,c)=>s+c.w.filter(i=>def(c.id).work[i].v==="low").length,0);
  const done=S.cs.filter(c=>c.done).length;
  return `<section class="hero">
  <p class="label">Sign-out · 07:00</p>
  <div><div class="big">${pct}%</div><h2 style="font-size:32px;margin-top:6px">${grade}</h2></div>
  <div class="stats"><div class="stat"><span class="label">Closed</span><b>${done}/${S.cs.length}</b></div>
  <div class="stat"><span class="label">RRTs</span><b>${rrt}</b></div><div class="stat"><span class="label">Low-value</span><b>${low}</b></div></div>
  <div class="sec"><span class="label">Tonight's patients</span>
  ${S.cs.map(c=>{const d=def(c.id);const bad=c.a.filter((oi,si)=>d.steps[si].o[oi].s==="bad").length;
    const st=!c.done?`<span class="chip c-rrt">${c.arrived?"Unfinished":"Never paged"}</span>`:bad?`<span class="chip c-rrt">${bad} harmful</span>`:c.late?`<span class="chip c-prog">Late</span>`:`<span class="chip c-done">Clean</span>`;
    return `<details class="dcase"><summary><span><span class="mono">${d.room}</span> · ${esc(d.dx)}</span>${st}</summary><ul>${d.pearls.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></details>`}).join("")}
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="again">Another night</button><button class="btn ghost" data-act="home">Home</button></div>
  <div class="promo"><div><b>Board review, taught like rounds.</b><span>Boardside Reviews launches in 2027. Waitlist members get the founders discount.</span></div><a class="btn" href="https://forms.gle/9qnowgoDevR742wB7" target="_blank" rel="noopener">Join the waitlist</a></div>
  <p class="fine">For education only. Fictional patients; not medical advice.</p>
  </section>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="start"){start(b.dataset.m);return}
  if(act==="again"){start(S.mode);return}
  if(act==="home"){S=null;render();scrollTo(0,0);return}
  if(act==="open"){S.view="case";S.open=b.dataset.id;render();scrollTo(0,0);return}
  if(act==="board"){S.view="board";render();scrollTo(0,0);return}
  if(act==="wait"){const nx=Math.min(...S.cs.filter(c=>!c.arrived).map(c=>c.arr));advance(Math.max(1,nx-S.t));render();return}
  if(act==="end"){S.score;S.over=true;render();scrollTo(0,0);return}
  const c=S.cs.find(x=>x.id===S.open), d=def(c.id);
  if(act==="work"){const i=+b.dataset.i;if(c.w.includes(i))return;c.w.push(i);S.score+=WPTS[d.work[i].v];advance(d.work[i].m);render();return}
  if(act==="att"){c.att=true;S.score-=3;advance(10);render();return}
  if(act==="pick"){const i=+b.dataset.i;c.a.push(i);S.score+=PTS[d.steps[c.a.length-1].o[i].s];
    if(c.a.length===d.steps.length)c.done=true;advance(5);render();return}
});

window.claude?.hot?.snapshot?.(()=>({S}));
const boot=data=>{if(data&&data.S&&data.S.cs&&data.S.cs[0]&&data.S.cs[0].arr!==undefined)S=data.S;render()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
