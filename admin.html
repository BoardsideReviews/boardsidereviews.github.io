<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20role%3D%22img%22%20aria-label%3D%22Boardside%20Reviews%20mark%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2242%22%20fill%3D%22%23fff%22%20stroke%3D%22%230B2545%22%20stroke-width%3D%227%22/%3E%3Cpath%20fill%3D%22%230B2545%22%20d%3D%22M35.326%2C27.0%20H51.38%20A11.5%2C11.5%200%200%201%2051.38%2C50%20H43.008%20V73.0%20H35.326%20Q34.59%2C73.0%2034.59%2C72.264%20V27.736%20Q34.59%2C27.0%2035.326%2C27.0%20Z%22/%3E%3Cpath%20fill%3D%22%230D7070%22%20d%3D%22M43.008%2C50%20H53.91%20A11.5%2C11.5%200%200%201%2053.91%2C73.0%20H43.008%20Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<title>Admin | Boardside Reviews</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--navy:#0b2545;--teal:#0d7070;--teal-bright:#3cc4b4;--teal-soft:#e2f3f1;--coral:#b9432c;--coral-soft:#fdece7;--ink2:#33465f;--muted:#52627a;--line:#dce3ea;--sky:#eef5fc;--sky2:#f5f9fd;--amber:#f0b54a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid #e3ebf3;background:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px}
.brand svg{width:40px;height:40px;display:block}
header nav{display:flex;gap:18px;font-size:15px;font-weight:500}
header nav a{text-decoration:none;color:var(--ink2)}
header nav a:hover{color:var(--teal)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--teal)}
h1{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.03em}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;text-decoration:none}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid #b9d9d6}
.btn.danger{background:#fff;color:var(--coral);border:1px solid #efc2b7}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:600}
footer{border-top:1px solid #e3ebf3;margin-top:64px}
footer .wrap{padding-block:24px;font-size:13px;color:var(--muted)}
@media (max-width:560px){header nav{gap:12px;font-size:14px}.brand span{display:none}}

main .wrap{padding-block:36px;display:flex;flex-direction:column;gap:28px}
h1{font-size:clamp(32px,5vw,44px)}
h2{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:22px}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=search],input[type=text]{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #c9d5e2;border-radius:10px;min-width:0;flex:1 1 220px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:10px 12px;background:var(--sky2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eef2f6;vertical-align:top}
tr:last-child td{border-bottom:0}
td.acts{white-space:nowrap}
td.acts .btn{padding:7px 10px;font-size:13px;margin:2px 4px 2px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:999px}
.p-ban{background:var(--coral-soft);color:var(--coral)}.p-noname{background:#fff4dc;color:#7a5200}
.muted{color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.word.any{border-color:#efc2b7;background:var(--coral-soft)}
.word button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.word button:hover{color:var(--coral)}
.confirm{background:var(--coral-soft);border:1px solid #efc2b7;border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink2)}
.fld input,.fld textarea{font:inherit;font-weight:400;font-size:15px;padding:10px 12px;border:1px solid #c9d5e2;border-radius:10px;color:var(--navy);width:100%;box-sizing:border-box}
.fld textarea{resize:vertical;line-height:1.55;min-height:180px}
.mlframe{width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#eef5fc}
.warn{background:#fff4dc;border:1px solid #f0d9a6;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink2)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#1f9a8f;display:inline-block}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--sky);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--teal);border-radius:6px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.others{font-size:13px;color:var(--muted);margin:4px 0 0}
</style>
<script src="lb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="lb.js"></script>
</head>
<body>
<header><div class="wrap">
<a class="brand" href="/" aria-label="Boardside Reviews home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boardside Reviews mark"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#0B2545" stroke-width="7"/><path fill="#0B2545" d="M35.326,27.0 H51.38 A11.5,11.5 0 0 1 51.38,50 H43.008 V73.0 H35.326 Q34.59,73.0 34.59,72.264 V27.736 Q34.59,27.0 35.326,27.0 Z"/><path fill="#0D7070" d="M43.008,50 H53.91 A11.5,11.5 0 0 1 53.91,73.0 H43.008 Z"/></svg><span>Boardside Reviews<sup style="font-size:.5em;font-weight:600;vertical-align:super;line-height:0;margin-left:1px">&trade;</sup></span></a>
<nav><a href="admin-questions.html">Question editor</a><a href="leaderboard.html">Leaderboard</a></nav>
</div></header>
<main><div class="wrap" id="app"><div class="card"><b>Loading…</b></div></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=d=>d?new Date(d).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";
let players=[],words=[],accounts=null,q="",mq="",pending=null,mlScrolled=false;
const GA_LINK="https://analytics.google.com/analytics/web/";
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

async function boot(){
  const app=$("#app");
  if(!BLB.enabled){app.innerHTML=`<h1>Admin</h1><div class="card">The leaderboard isn't connected yet. Add the Supabase details to lb-config.js.</div>`;return}
  const u=await BLB.user();
  if(!u){app.innerHTML=`<h1>Admin</h1><div class="card"><span>Sign in with your admin email.</span><div><button class="btn" data-a="in">Sign in</button></div></div>`;return}
  let ok=false;try{ok=await BLB.rpc("is_admin")}catch(e){}
  if(!ok){app.innerHTML=`<h1>Admin</h1><div class="card"><span>${esc(u.email)} doesn't have admin access.</span><div><button class="btn ghost" data-a="out">Sign out</button></div></div>`;return}
  app.innerHTML=`<div class="row"><h1>Admin</h1><span class="muted">${esc(u.email)} · <button class="linkbtn" data-a="out">Sign out</button></span></div>
  <section class="card"><div class="row"><h2>Question bank</h2><a class="btn" href="admin-questions.html">Open the question editor</a></div><p class="muted" style="margin:0">Edit any question, its explanation, teaching pearl, references or image; add new questions; remove or restore questions. Changes go live when you confirm.</p></section>
  <section class="card" id="mailing"><div class="row"><h2>Mailing list</h2><span class="row" style="gap:8px;justify-content:flex-end"><input type="search" id="mq" placeholder="Search name or email" aria-label="Search the mailing list" style="max-width:240px"><button class="btn ghost" data-csv="mailing">Download (CSV)</button></span></div><div id="mlsum" class="muted"></div><div class="tablebox" id="mltable"></div><div id="mlgone"></div></section>
  <section class="card"><div class="row"><h2>Website traffic</h2><a class="btn ghost" href="${GA_LINK}" target="_blank" rel="noopener">Open Google Analytics ↗</a></div><p class="muted" style="margin:0">Visitors, top pages and where traffic comes from are in Google Analytics (sign in as boardsidereviews@gmail.com).</p></section>
  <section class="card"><div class="row"><h2>How people heard about us</h2></div><div id="heard"></div></section>
  <section class="card"><div class="row"><h2>Email your mailing list</h2><span class="muted" id="mlcount"></span></div><p class="muted" style="margin:0">It goes to everyone subscribed at the moment you press Send. Each email opens with “Dear Dr. [last name],” and ends with your signature and an Unsubscribe link, in the same design as the welcome email.</p><label class="fld">Subject<input type="text" id="mlsub" maxlength="150" placeholder="e.g. 3 high-yield ABG pearls"></label><label class="fld">Message<textarea id="mlbody" rows="10" placeholder="Write your message. Leave a blank line between paragraphs. Links become clickable automatically."></textarea></label><div id="mlwarn"></div><div class="row" style="justify-content:flex-start;gap:8px"><button class="btn ghost" data-ml="preview">Preview</button><button class="btn ghost" data-ml="test">Send me a test</button><button class="btn" data-ml="send">Send to mailing list</button></div><div id="mlconfirm"></div><div id="mlpreview"></div><div id="mlhist"></div></section>
  <section class="card"><div class="row"><h2>Accounts &amp; waitlist</h2><span class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-csv="waitlist">Download waitlist (CSV)</button><button class="btn ghost" data-csv="mailing">Download mailing list (CSV)</button></span></div><p class="muted" style="margin:0">Everyone with a question bank account is on the launch waitlist. The mailing list is only people who ticked the box. Leaderboard-only sign-ins aren't on either list.</p><div id="acctsum" class="muted"></div><div class="tablebox" id="accounts"></div></section>
  <section class="card"><div class="row"><h2>Players</h2><input type="search" id="q" placeholder="Search name or email" aria-label="Search players"></div><div id="confirm"></div><div class="tablebox" id="players"></div></section>
  <section class="card"><h2>Blocked words</h2><p class="muted" style="margin:0">Names containing these are rejected. Adding a word also clears any current names that match. Red words are blocked even inside longer words; the rest only as a whole word, so real names like Hancock or Nazir still work.</p>
  <form id="wf" class="row" style="justify-content:flex-start"><input type="text" id="w" placeholder="Add a word" aria-label="Word to block" maxlength="30"><label class="chk"><input type="checkbox" id="wany"> Also inside longer words</label><button class="btn">Add</button></form><div class="words" id="words"></div></section>`;
  $("#q").addEventListener("input",e=>{q=e.target.value.toLowerCase();drawPlayers()});
  $("#mq").addEventListener("input",e=>{mq=e.target.value.toLowerCase();drawMailing()});
  $("#wf").addEventListener("submit",async e=>{e.preventDefault();const v=$("#w").value.trim().toLowerCase();if(!/^[a-z]{2,30}$/.test(v)){toast("Use 2–30 letters, no spaces.");return}
    try{await BLB.rpc("admin_add_blocked_word",{p_word:v,p_anywhere:$("#wany").checked});$("#w").value="";toast("Blocked “"+v+"”");await load()}catch(x){toast(BLB.friendly(x))}});
  await load();
}
async function load(){
  try{[players,words]=await Promise.all([BLB.rpc("admin_list_players"),BLB.rpc("admin_list_blocked_words")])}catch(e){toast(BLB.friendly(e));return}
  drawPlayers();drawWords();
  try{accounts=await BLB.rpc("admin_accounts")}catch(e){accounts=null}
  drawAccounts();
}
let liveTimer=null;
async function refreshAccounts(){
  try{accounts=await BLB.rpc("admin_accounts")}catch(e){return}
  drawAccounts();
}
function startLive(){
  if(liveTimer)return;
  liveTimer=setInterval(()=>{if(!document.hidden)refreshAccounts()},10000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshAccounts()});
  loadHistory();
}
async function loadHistory(){
  let h=[];try{h=await BLB.rpc("admin_mailing_history")}catch(e){return}
  $("#mlhist").innerHTML=h.length?`<p class="muted" style="margin:6px 0 0;font-size:13px"><b>Recent sends:</b> ${h.map(x=>`${esc(x.subject)} (${x.test?"test":x.recipients+" people"}, ${dt(x.sent_at)})`).join(" · ")}</p>`:"";
}
function mlFields(){return {s:$("#mlsub").value.trim(),b:$("#mlbody").value.trim()}}
async function mlPreview(){
  const f=mlFields();if(!f.s||!f.b){toast("Add a subject and a message first.");return null}
  let r;try{r=await BLB.rpc("admin_mailing_preview",{p_subject:f.s,p_body:f.b})}catch(x){toast(BLB.friendly(x));return null}
  $("#mlcount").textContent=r.subscribers+" subscribed right now";
  $("#mlwarn").innerHTML=r.has_address?"":`<p class="warn" style="margin:0">No postal address is set for the email footer yet. US anti-spam law (CAN-SPAM) generally expects one in marketing emails; ask your attorney, then I can add it.</p>`;
  const fr=document.createElement("iframe");fr.className="mlframe";fr.title="Email preview";fr.setAttribute("sandbox","");fr.srcdoc=r.html;
  $("#mlpreview").innerHTML="";$("#mlpreview").append(fr);
  return r;
}
function drawAccounts(){
  if(!accounts){$("#acctsum").textContent="Couldn't load the account list.";$("#accounts").innerHTML="";$("#heard").innerHTML="";return}
  const acc=accounts.filter(a=>a.waitlist),ml=acc.filter(a=>a.mailing_list&&a.verified);
  if($("#mlcount"))$("#mlcount").textContent=ml.length+" subscribed right now";
  startLive();
  $("#acctsum").innerHTML=`<span class="live"><i></i>Live · updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"})}</span> · <b>${acc.length}</b> on the waitlist · <b>${ml.length}</b> on the mailing list · ${accounts.length-acc.length} leaderboard-only`;
  $("#accounts").innerHTML=acc.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Heard from</th><th>Mailing list</th><th>Verified</th><th>Joined</th></tr></thead><tbody>${acc.map(a=>`<tr><td>${esc([a.first_name,a.last_name].filter(Boolean).join(" "))}</td><td>${esc(a.email)}</td><td>${esc(heard(a))}</td><td title="${esc(a.mailing_source?("Last change: "+a.mailing_source+(a.mailing_updated_at?", "+dt(a.mailing_updated_at):"")):"")}">${a.mailing_list?"Yes":"No"}${a.mailing_source==="unsubscribe link"&&!a.mailing_list?' <span class="muted" style="font-size:12px">(unsubscribed)</span>':""}</td><td>${a.verified?"Yes":"No"}</td><td>${dt(a.created_at)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted" style="padding:16px;margin:0">No accounts yet.</p>`;
  drawHeard(acc);
  drawMailing();
}
// Mailing list: only people subscribed right now (verified accounts that ticked the box or turned it on in Profile info).
// Refreshes every 10 seconds while this tab is open, and right away when you come back to the tab.
function drawMailing(){
  if(!$("#mltable"))return;
  const src=s=>({"sign-up":"At sign-up","settings":"Profile info","unsubscribe link":"Unsubscribe link"})[s]||s||"—";
  const when=a=>a.mailing_updated_at||a.created_at;
  const subs=accounts.filter(a=>a.waitlist&&a.mailing_list&&a.verified).sort((x,y)=>new Date(when(y))-new Date(when(x)));
  const gone=accounts.filter(a=>a.waitlist&&!a.mailing_list&&a.mailing_source&&/unsubscribe|settings/i.test(a.mailing_source)).sort((x,y)=>new Date(when(y))-new Date(when(x)));
  const shown=subs.filter(a=>!mq||(a.email+" "+(a.first_name||"")+" "+(a.last_name||"")).toLowerCase().includes(mq));
  $("#mlsum").innerHTML=`<span class="live"><i></i>Live · updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"})}</span> · <b>${subs.length}</b> subscribed right now${gone.length?` · ${gone.length} opted out`:""}`;
  $("#mltable").innerHTML=shown.length?`<table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Subscribed</th><th>How</th></tr></thead><tbody>${shown.map((a,i)=>`<tr><td class="muted">${i+1}</td><td>${esc([a.first_name,a.last_name].filter(Boolean).join(" ")||"—")}</td><td>${esc(a.email)}</td><td>${dt(when(a))}</td><td>${esc(src(a.mailing_source))}</td></tr>`).join("")}</tbody></table>`
    :`<p class="muted" style="padding:16px;margin:0">${subs.length?"No one matches that search.":"No one is on the mailing list yet."}</p>`;
  $("#mlgone").innerHTML=gone.length?`<details style="margin-top:4px"><summary class="muted" style="cursor:pointer">Opted out (${gone.length})</summary><div class="tablebox" style="margin-top:8px"><table><thead><tr><th>Name</th><th>Email</th><th>Opted out</th><th>How</th></tr></thead><tbody>${gone.map(a=>`<tr><td>${esc([a.first_name,a.last_name].filter(Boolean).join(" ")||"—")}</td><td>${esc(a.email)}</td><td>${dt(when(a))}</td><td>${esc(src(a.mailing_source))}</td></tr>`).join("")}</tbody></table></div></details>`:"";
  if(!mlScrolled&&location.hash==="#mailing"){mlScrolled=true;$("#mailing").scrollIntoView({behavior:"smooth",block:"start"})}
}
function heard(a){return a.heard_from?(a.heard_from==="Other"&&a.heard_from_other?"Other: "+a.heard_from_other:a.heard_from):"—"}
function drawHeard(acc){
  const answered=acc.filter(a=>a.heard_from),counts={};
  answered.forEach(a=>counts[a.heard_from]=(counts[a.heard_from]||0)+1);
  const rows=Object.entries(counts).sort((x,y)=>y[1]-x[1]),max=rows.length?rows[0][1]:1;
  const other=answered.filter(a=>a.heard_from==="Other"&&a.heard_from_other).map(a=>a.heard_from_other);
  $("#heard").innerHTML=answered.length?`<p class="muted" style="margin:0 0 4px">${answered.length} of ${acc.length} accounts answered (asked once, right after sign-up; they can skip).</p><div class="bars">${rows.map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${Math.max(4,n/max*100)}%;display:block"></span></span><b>${n}</b></div>`).join("")}</div>${other.length?`<p class="others">“Other” answers: ${other.map(esc).join(" · ")}</p>`:""}`:`<p class="muted" style="margin:0">No answers yet. New accounts are asked “How did you hear about Boardside Reviews?” right after sign-up.</p>`;
}
function csv(kind){
  if(!accounts)return toast("Account list isn't set up yet.");
  const rows=accounts.filter(a=>a.waitlist&&(kind!=="mailing"||(a.mailing_list&&a.verified)));
  const cell=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const out=[["first_name","last_name","email","heard_from","mailing_list","verified","joined"]].concat(rows.map(a=>[a.first_name,a.last_name,a.email,a.heard_from?heard(a):"",a.mailing_list?"yes":"no",a.verified?"yes":"no",a.created_at])).map(r=>r.map(cell).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob([out],{type:"text/csv"})),l=document.createElement("a");
  l.href=url;l.download=(kind==="mailing"?"boardside-mailing-list":"boardside-waitlist")+".csv";document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function drawPlayers(){
  const rows=players.filter(p=>!q||(p.email||"").toLowerCase().includes(q)||(p.display_name||"").toLowerCase().includes(q));
  $("#players").innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Plays</th><th>Last played</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr>
   <td>${p.display_name?esc(p.display_name):`<span class="pill p-noname">NO NAME</span>`} ${p.banned?`<span class="pill p-ban">BANNED</span>`:""}</td>
   <td>${esc(p.email)}</td><td>${p.plays}</td><td>${dt(p.last_played)}</td>
   <td class="acts">${p.display_name?`<button class="btn ghost" data-act="remove" data-id="${p.user_id}">Remove name</button>`:""}${p.banned?`<button class="btn ghost" data-act="unban" data-id="${p.user_id}">Unban</button>`:`<button class="btn danger" data-act="ban" data-id="${p.user_id}">Ban</button>`}${+p.plays?`<button class="btn danger" data-act="clear" data-id="${p.user_id}">Clear scores</button>`:""}</td></tr>`).join("")}</tbody></table>`
   :`<p class="muted" style="padding:16px;margin:0">${players.length?"No players match.":"No players yet."}</p>`;
}
function drawWords(){
  $("#words").innerHTML=words.map(w=>`<span class="word ${w.anywhere?"any":""}">${esc(w.word)}<button type="button" data-word="${esc(w.word)}" aria-label="Unblock ${esc(w.word)}">×</button></span>`).join("");
}
const ACTIONS={
  remove:{fn:"admin_remove_name",args:id=>({p_user:id,p_ban:false}),msg:"Remove this name? They'll have to pick a new one before posting again.",done:"Name removed"},
  ban:{fn:"admin_remove_name",args:id=>({p_user:id,p_ban:true}),msg:"Ban this player? Their name is removed, they disappear from every board, and they can't post.",done:"Player banned"},
  unban:{fn:"admin_unban",args:id=>({p_user:id}),msg:"Unban this player? Their past scores show again once they pick a name.",done:"Player unbanned"},
  clear:{fn:"admin_clear_scores",args:id=>({p_user:id}),msg:"Delete all of this player's scores? This can't be undone.",done:"Scores cleared"}
};
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.csv){csv(b.dataset.csv);return}
  if(b.dataset.ml==="preview"){b.disabled=true;await mlPreview();b.disabled=false;return}
  if(b.dataset.ml==="test"){const f=mlFields();if(!f.s||!f.b){toast("Add a subject and a message first.");return}
    b.disabled=true;try{await BLB.rpc("admin_mailing_send",{p_subject:f.s,p_body:f.b,p_test:true});toast("Test sent to your inbox.");loadHistory()}catch(x){toast(BLB.friendly(x))}b.disabled=false;return}
  if(b.dataset.ml==="send"){const r=await mlPreview();if(!r)return;
    if(!r.subscribers){toast("Nobody is subscribed yet.");return}
    $("#mlconfirm").innerHTML=`<div class="confirm"><span>Send <b>“${esc(mlFields().s)}”</b> to <b>${r.subscribers}</b> ${r.subscribers===1?"person":"people"} now? This can't be undone.</span><span><button class="btn danger" data-mlgo>Send now</button> <button class="btn ghost" data-mlcancel>Cancel</button></span></div>`;
    $("#mlconfirm").scrollIntoView({block:"nearest"});return}
  if(b.hasAttribute("data-mlcancel")){$("#mlconfirm").innerHTML="";return}
  if(b.hasAttribute("data-mlgo")){const f=mlFields();b.disabled=true;
    try{const r=await BLB.rpc("admin_mailing_send",{p_subject:f.s,p_body:f.b,p_test:false});$("#mlconfirm").innerHTML="";toast("Sent to "+r.sent+(r.sent===1?" person.":" people."));loadHistory()}
    catch(x){toast(BLB.friendly(x));b.disabled=false}return}
  if(b.dataset.a==="in"){await BLB.dialog({title:"Admin sign-in",intro:"Enter your admin email. We'll send a 6-digit code."});boot();return}
  if(b.dataset.a==="out"){await BLB.signOut();boot();return}
  if(b.dataset.word){try{await BLB.rpc("admin_remove_blocked_word",{p_word:b.dataset.word});toast("Unblocked “"+b.dataset.word+"”");await load()}catch(x){toast(BLB.friendly(x))}return}
  if(b.dataset.act){const a=ACTIONS[b.dataset.act],p=players.find(x=>x.user_id===b.dataset.id);pending={a,id:b.dataset.id};
    $("#confirm").innerHTML=`<div class="confirm"><span><b>${esc(p.display_name||p.email)}</b>: ${esc(a.msg)}</span><span><button class="btn danger" data-go>Confirm</button> <button class="btn ghost" data-cancel>Cancel</button></span></div>`;$("#confirm").scrollIntoView({block:"nearest"});return}
  if(b.hasAttribute("data-cancel")){pending=null;$("#confirm").innerHTML="";return}
  if(b.hasAttribute("data-go")&&pending){const {a,id}=pending;pending=null;$("#confirm").innerHTML="";try{await BLB.rpc(a.fn,a.args(id));toast(a.done);await load()}catch(x){toast(BLB.friendly(x))}}
});
boot();
</script>
</body>
</html>
