<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20role%3D%22img%22%20aria-label%3D%22Boardside%20Reviews%20mark%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2242%22%20fill%3D%22%23fff%22%20stroke%3D%22%230B2545%22%20stroke-width%3D%227%22/%3E%3Cpath%20fill%3D%22%230B2545%22%20d%3D%22M35.326%2C27.0%20H51.38%20A11.5%2C11.5%200%200%201%2051.38%2C50%20H43.008%20V73.0%20H35.326%20Q34.59%2C73.0%2034.59%2C72.264%20V27.736%20Q34.59%2C27.0%2035.326%2C27.0%20Z%22/%3E%3Cpath%20fill%3D%22%230D7070%22%20d%3D%22M43.008%2C50%20H53.91%20A11.5%2C11.5%200%200%201%2053.91%2C73.0%20H43.008%20Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<title>Leaderboard | Boardside Reviews</title>
<meta name="description" content="Top scores from Boardside Reviews games, including IM Night Float.">
<style>
:root{--navy:#0b2545;--teal:#0d7070;--teal-bright:#3cc4b4;--teal-soft:#e2f3f1;--coral:#b9432c;--coral-soft:#fdece7;--ink2:#33465f;--muted:#52627a;--line:#dce3ea;--sky:#eef5fc;--sky2:#f5f9fd;--amber:#f0b54a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid #e3ebf3;background:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px}
.brand svg{width:40px;height:40px;display:block}
header nav{display:flex;gap:18px;font-size:15px;font-weight:500}
header nav a{text-decoration:none;color:var(--ink2)}
header nav a:hover{color:var(--teal)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--teal)}
h1{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.03em}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;text-decoration:none}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid #b9d9d6}
.btn.danger{background:#fff;color:var(--coral);border:1px solid #efc2b7}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:600}
footer{border-top:1px solid #e3ebf3;margin-top:64px}
footer .wrap{padding-block:24px;font-size:13px;color:var(--muted)}
@media (max-width:560px){header nav{gap:12px;font-size:14px}.brand span{display:none}}

.hero{background:linear-gradient(180deg,var(--sky) 0%,#fff 100%);border-bottom:1px solid #e3ebf3}
.hero .wrap{padding-block:48px 36px;display:flex;flex-direction:column;gap:14px}
.hero p{margin:0;font-size:17px;line-height:26px;color:var(--muted);max-width:56ch}
.controls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:32px}
.picker{display:flex;flex-direction:column;gap:8px;min-width:0}
.picker .group{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sky);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,37,69,.12)}
.me{margin-top:24px;background:var(--sky2);border:1px solid #e3ebf3;border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.me .acts{display:flex;gap:16px;flex-wrap:wrap}
.tablebox{margin-top:20px;border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sky2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #eef2f6;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.rank{width:56px;font-weight:700}
td.name{white-space:normal;word-break:break-word;font-weight:600}
td.pct{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px}
th.num,td.num{text-align:right}
.medal{display:inline-flex;width:26px;height:26px;border-radius:999px;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.m1{background:#fbe6b5;color:#7a5200}.m2{background:#e6ebf1;color:#3c4a5c}.m3{background:#f6dccb;color:#7a3d14}
tr.mine td{background:var(--teal-soft)}
.you{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--teal);margin-left:6px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-family:'Plus Jakarta Sans',sans-serif;color:var(--navy);font-size:18px}
.note{margin-top:12px;font-size:13px;color:var(--muted)}
@media (max-width:560px){.hide-sm{display:none}td,th{padding:10px}}
</style>
<script src="lb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="lb.js"></script>
</head>
<body>
<header><div class="wrap">
<a class="brand" href="/" aria-label="Boardside Reviews home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boardside Reviews mark"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#0B2545" stroke-width="7"/><path fill="#0B2545" d="M35.326,27.0 H51.38 A11.5,11.5 0 0 1 51.38,50 H43.008 V73.0 H35.326 Q34.59,73.0 34.59,72.264 V27.736 Q34.59,27.0 35.326,27.0 Z"/><path fill="#0D7070" d="M43.008,50 H53.91 A11.5,11.5 0 0 1 53.91,73.0 H43.008 Z"/></svg><span>Boardside Reviews</span></a>
<nav><a href="/#games">Games</a><a href="night-float.html">Play Night Float</a></nav>
</div></header>
<main>
<section class="hero"><div class="wrap">
<span class="eyebrow">GAMIFIED LEARNING</span>
<h1>Leaderboard</h1>
<p>Each player's best score on each board. Sign in with your email once and post from the end of any game.</p>
</div></section>
<div class="wrap">
<div class="controls">
<div class="picker" id="picker"></div>
<div class="picker"><span class="group">PERIOD</span><div class="seg" id="period">
<button type="button" data-days="" aria-pressed="true">All time</button><button type="button" data-days="7" aria-pressed="false">This week</button>
</div></div>
</div>
<div class="me" id="me" hidden></div>
<div class="tablebox" id="board"><div class="empty"><b>Loading…</b></div></div>
<p class="note" id="note"></p>
</div>
</main>
<footer><div class="wrap">© 2026 Boardside Reviews™ · Not affiliated with or endorsed by ABIM. Games are for education only.</div></footer>
<script>
// Boards shown on this page. Add a line here when a new game gets a leaderboard.
const BOARDS=[
  {id:"night-float-standard",group:"IM NIGHT FLOAT",label:"Standard night",game:"night-float",variant:"standard",play:"night-float.html"},
  {id:"night-float-black-cloud",group:"IM NIGHT FLOAT",label:"Black cloud",game:"night-float",variant:"black-cloud",play:"night-float.html"},
  {id:"questions",group:"BOARD QUESTIONS",label:"Question sets",game:"questions",variant:"all",soon:"Question-set rankings open when the first playable question set goes live."}
];
let cur=BOARDS.find(b=>b.id===location.hash.slice(1))||BOARDS[0], days=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});

function drawPicker(){
  $("#picker").innerHTML=`<span class="group">BOARD</span><div class="seg">${BOARDS.map(b=>`<button type="button" data-id="${b.id}" aria-pressed="${b===cur}">${esc(b.label)}</button>`).join("")}</div>`;
}
async function drawMe(){
  const me=$("#me");
  if(!BLB.enabled){me.hidden=true;return}
  me.hidden=false;
  let p=null; try{p=await BLB.profile()}catch(e){}
  if(p&&p.display_name){
    me.innerHTML=`<span>Signed in as <b>${esc(p.display_name)}</b></span><span class="acts"><button class="linkbtn" data-a="rename">Change name</button><button class="linkbtn" data-a="out">Sign out</button></span>`;
  }else if(p){
    me.innerHTML=`<span>${p.banned?"This account can't appear on the leaderboard.":"You're signed in. Pick a display name to appear on the board."}</span>${p.banned?`<button class="linkbtn" data-a="out">Sign out</button>`:`<button class="linkbtn" data-a="rename">Pick a name</button>`}`;
  }else{
    me.innerHTML=`<span>Play a game, then post your score from the sign-out screen.</span><button class="linkbtn" data-a="in">Sign in</button>`;
  }
}
async function drawBoard(){
  const box=$("#board");
  $("#note").textContent="";
  if(!BLB.enabled){box.innerHTML=`<div class="empty"><b>The leaderboard opens soon.</b><span>Scores will appear here once posting goes live.</span></div>`;return}
  if(cur.soon){box.innerHTML=`<div class="empty"><b>Coming soon</b><span>${esc(cur.soon)}</span></div>`;return}
  box.innerHTML=`<div class="empty"><b>Loading…</b></div>`;
  let rows;
  try{rows=await BLB.board(cur.game,cur.variant,days,100)}
  catch(e){box.innerHTML=`<div class="empty"><b>Couldn't load the leaderboard.</b><span>${esc(BLB.friendly(e))}</span><button class="btn ghost" data-a="retry">Try again</button></div>`;return}
  if(!rows.length){box.innerHTML=`<div class="empty"><b>No scores ${days?"this week":"yet"}.</b><span>Be the first on the ${esc(cur.label.toLowerCase())} board.</span>${cur.play?`<a class="btn" href="${cur.play}">Play now</a>`:""}</div>`;return}
  box.innerHTML=`<table><thead><tr><th>#</th><th>Player</th><th class="num">Best</th><th class="num hide-sm">Plays</th><th class="num hide-sm">Date</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.is_me?"mine":""}"><td class="rank">${r.rank<=3?`<span class="medal m${r.rank}">${r.rank}</span>`:r.rank}</td><td class="name">${esc(r.display_name)}${r.is_me?`<span class="you">YOU</span>`:""}</td><td class="num pct">${r.best_pct}%</td><td class="num hide-sm">${r.plays}</td><td class="num hide-sm">${fmtDate(r.achieved_at)}</td></tr>`).join("")}</tbody></table>`;
  $("#note").textContent="Ties go to whoever reached the score first.";
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.id){cur=BOARDS.find(x=>x.id===b.dataset.id);try{history.replaceState(null,"","#"+cur.id)}catch(_){}drawPicker();drawBoard();return}
  if(b.dataset.days!==undefined){days=b.dataset.days?+b.dataset.days:null;document.querySelectorAll("#period button").forEach(x=>x.setAttribute("aria-pressed",x===b));drawBoard();return}
  const a=b.dataset.a;
  if(a==="retry")drawBoard();
  if(a==="in"){await BLB.dialog({title:"Sign in"});drawMe();drawBoard()}
  if(a==="rename"){await BLB.dialog({rename:true});drawMe();drawBoard()}
  if(a==="out"){await BLB.signOut();drawMe();drawBoard()}
});
drawPicker();drawMe();drawBoard();
</script>
</body>
</html>
