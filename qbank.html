<title>Question Bank | Boardside Reviews</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2242%22%20fill%3D%22%23fff%22%20stroke%3D%22%230B2545%22%20stroke-width%3D%227%22/%3E%3Cpath%20fill%3D%22%230B2545%22%20d%3D%22M35.326%2C27.0%20H51.38%20A11.5%2C11.5%200%200%201%2051.38%2C50%20H43.008%20V73.0%20H35.326%20Q34.59%2C73.0%2034.59%2C72.264%20V27.736%20Q34.59%2C27.0%2035.326%2C27.0%20Z%22/%3E%3Cpath%20fill%3D%22%230D7070%22%20d%3D%22M43.008%2C50%20H53.91%20A11.5%2C11.5%200%200%201%2053.91%2C73.0%20H43.008%20Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--teal:#0d7070;--teal-bright:#3cc4b4;--teal-soft:#e2f3f1;--coral:#b9432c;--coral-soft:#fdece7;--ink2:#33465f;--muted:#52627a;--line:#dce3ea;--sky:#eef5fc;--sky2:#f5f9fd;--amber:#f0b54a;--amber-soft:#fff4dc;--hl:#ffe680}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{background:#fff;border-bottom:1px solid #e3ebf3;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px}
.brand svg{width:34px;height:34px}
.brand small{font-weight:600;color:var(--teal);font-size:14px}
.who{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;text-decoration:none;white-space:nowrap}
.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--coral);border:1px solid #efc2b7}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--teal);font-weight:600;font-size:14px}
.who .link{white-space:nowrap}
body{padding-bottom:calc(38px + env(safe-area-inset-bottom))}
@media (max-width:760px){body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}}
.sitefoot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid #e3ebf3;text-align:center;font-size:13px;color:var(--muted);padding:8px 12px calc(8px + env(safe-area-inset-bottom));line-height:1.4}
.sitefoot a{color:inherit;text-decoration:none}
.sitefoot .sep{margin:0 10px;opacity:.6}
.sitefoot b{color:var(--teal);font-weight:600}
.sitefoot a:hover b{text-decoration:underline}
body.dark .sitefoot{background:#101d31;border-color:#1f2e45;color:#9fb0c6}
body.dark .sitefoot b{color:var(--teal-bright)}
.concern{margin-top:22px;border:1px solid #e3ebf3;border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:#f7fafc}
.concern b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}
.concern span{font-size:14px;color:var(--muted)}
.concern .btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.concern .btn svg{width:16px;height:16px}
.concern .btn span{color:inherit;font-size:inherit}
.concern small{grid-column:1/-1;font-size:12px;color:var(--muted)}
body.dark .concern{background:#152238;border-color:#24344d}
body.dark .concern b{color:#eef4fb}
@media (max-width:600px){.concern{grid-template-columns:1fr}}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
main.page{padding:28px 0 60px}

/* auth */
.auth{max-width:440px;margin:8vh auto 0}
.auth .card{display:flex;flex-direction:column;gap:14px;padding:28px}
.auth h1{font-size:26px}
.auth p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.field input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid #c9d5e2;border-radius:10px;color:var(--navy);width:100%}
.field input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.code{letter-spacing:.4em;text-align:center;font-size:22px!important;font-variant-numeric:tabular-nums}
.err{color:var(--coral);font-size:14px}
.err:empty{display:none}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.lock .ic{width:56px;height:56px;border-radius:50%;background:var(--coral-soft);display:grid;place-items:center;color:var(--coral)}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h1{font-size:clamp(26px,4vw,34px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sec-h h2{font-size:19px}
.opt-label{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 0 8px;text-transform:none}
.opt-label:first-of-type{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg.wide button{flex:1;text-align:left;padding:11px 14px}
.seg.wide button small{display:block;font-weight:500;font-size:12px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--teal-soft);border-color:#9fd3cd;color:#085454;font-weight:600}
.chips button small{color:var(--muted);font-weight:500}
.check{display:flex;align-items:flex-start;gap:10px;font-size:15px;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal)}
.check small{display:block;color:var(--muted);font-size:13px}
.startrow{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.note.warn{color:#8a5a00}
.subj{width:100%;border-collapse:collapse;font-size:14px}
.subj td{padding:7px 0;border-bottom:1px solid #eef2f6;vertical-align:middle}
.subj tr:last-child td{border-bottom:0}
.subj .bar{height:6px;border-radius:3px;background:#edf1f5;overflow:hidden;width:100%;min-width:60px}
.subj .bar i{display:block;height:100%;background:var(--teal)}
.subj .num{text-align:right;white-space:nowrap;color:var(--muted);padding-left:10px;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f6}
.setrow:last-child{border-bottom:0}
.setrow .meta{font-size:13px;color:var(--muted)}
.setrow .ttl{font-weight:600;font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--amber-soft);color:#8a5a00;margin-left:6px;vertical-align:1px}
.pill.done{background:var(--teal-soft);color:#085454}
.reset{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

/* player */
body.playing{background:#fff}
.pbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff}
.pbar .wrap{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.pbar .qpos{font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:10px}
.pbar .qpos small{font-family:Inter,sans-serif;font-weight:500;font-size:13px;opacity:.75}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:7px 11px;font-size:14px;font-weight:600}
.tbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.tbtn svg{width:16px;height:16px}
.tzpop{position:fixed;z-index:65;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(11,37,69,.22);padding:8px;display:flex;align-items:center;gap:6px}
.tzctl button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--navy)}
.tzctl button:disabled{opacity:.35;cursor:default}
.tzctl .tzv{min-width:52px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;background:none;border:0;width:auto}
body.dark .tzpop,body.dark .tzctl button{background:#16253b;color:#e4ecf5;border-color:#2a3d58}
.playwrap{zoom:var(--tz,1)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.1)}
.clock.low{background:var(--coral);color:#fff}
.playwrap{max-width:900px;margin:0 auto;padding:26px max(18px,env(safe-area-inset-left,0px)) 120px}
.qtools{display:flex;align-items:center;margin:-8px 0 8px}
.qflag{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#9aa8b8;padding:0}
.qflag svg{width:17px;height:17px}
.qflag:hover{color:var(--navy);border-color:#b9c6d4}
.qflag[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--navy)}
body.dark .qflag{background:#16253b;border-color:#2a3d58;color:#7f93ab}
body.dark .qflag[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#0e1828}
.subjtag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--teal);text-transform:uppercase;margin-bottom:10px}
.stem{font-size:17px;line-height:1.65;color:#14263f}
.stem p{margin:0 0 12px}
.stem .data{margin:4px 0 14px;padding:12px 16px;background:var(--sky2);border:1px solid #e3ebf3;border-radius:10px;font-size:16px}
.stem .data div+div{margin-top:4px}
.stem .ask{font-weight:700;margin-top:16px}
.stem mark{background:var(--hl);color:inherit;cursor:pointer;border-radius:2px;padding:0}
.hint{font-size:12px;color:var(--muted);margin:2px 0 16px}
figure.ex{margin:6px 0 16px}
figure.ex img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;display:block;background:#fafcfe}
figure.ex .ph{height:220px;border-radius:8px;background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e9eef4 10px,#e9eef4 20px);display:grid;place-items:center;color:var(--muted);font-size:14px}
figure.ex figcaption{font-size:11px;color:var(--muted);margin-top:4px}
.ad{border:1px solid #c9d5e2;border-radius:12px;overflow:hidden;margin:6px 0 16px;font-size:14px;background:#fff}
.ad .band{background:#0f3d6b;color:#fff;padding:12px 16px;white-space:pre-line;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px}
.ad .in{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ad .hl{font-size:19px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif}
.ad table{border-collapse:collapse;width:100%}
.ad td{border-bottom:1px solid #eef2f6;padding:5px 6px}
.ad tr:first-child td{font-weight:700;background:var(--sky2)}
.ad .fine{font-size:12px;color:var(--muted)}

.choices{display:flex;flex-direction:column;gap:8px;margin:6px 0 20px}
.choice{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:#fff;transition:border-color .12s,background .12s}
.choice .cb{flex:none;width:52px;display:grid;place-items:center;background:none;border:0;border-right:1px solid #eef2f6;border-radius:12px 0 0 12px}
.choice .cb i{width:22px;height:22px;border:2px solid #9aa9bb;border-radius:6px;display:grid;place-items:center;transition:all .12s}
.choice .cb i svg{width:14px;height:14px;opacity:0}
.choice .ct{flex:1;text-align:left;background:none;border:0;padding:13px 16px;font-size:16px;line-height:1.45;display:flex;gap:10px;align-items:baseline;border-radius:0 12px 12px 0}
.choice .ct b{color:var(--muted);font-weight:700;min-width:18px}
.choice.sel{border-color:var(--teal);background:#f3fbfa}
.choice.sel .cb i{background:var(--teal);border-color:var(--teal)}
.choice.sel .cb i svg{opacity:1}
.choice.struck .ct span{text-decoration:line-through;text-decoration-thickness:2px;color:#93a1b2}
.choice.struck .ct b{color:#b3bfcc}
.choice .verdict{flex:none;align-self:center;font-size:12px;font-weight:700;padding:0 14px;white-space:nowrap}
.choice .ct{min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.choice .verdict{padding:0 8px 0 4px;white-space:normal;max-width:64px;text-align:right;line-height:1.2}}
.choice.right{border-color:#2f9e74;background:#eefaf4}
.choice.right .verdict{color:#1f7a57}
.choice.wrong{border-color:var(--coral);background:var(--coral-soft)}
.choice.wrong .verdict{color:var(--coral)}
.choice.right.sel .cb i{background:#2f9e74;border-color:#2f9e74}
.choice.wrong.sel .cb i{background:var(--coral);border-color:var(--coral)}
.locked .choice .cb{cursor:default}

.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .grow{flex:1}

.exp{margin-top:26px;border-top:2px solid var(--navy);padding-top:20px;display:flex;flex-direction:column;gap:16px}
.verdictbar{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.verdictbar .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.verdictbar.ok .dot{background:#2f9e74}.verdictbar.ok{color:#1f7a57}
.verdictbar.no .dot{background:var(--coral)}.verdictbar.no{color:var(--coral)}
.verdictbar.om .dot{background:#8a99ab}.verdictbar.om{color:var(--muted)}
.exp h3{font-size:16px;color:var(--ink2)}
.exp .narr p{margin:0 0 10px;font-size:16px;line-height:1.65;color:#1c2f48}
.reasons{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.reasons div{display:grid;grid-template-columns:30px 1fr 1.25fr;gap:10px;padding:10px 14px;font-size:14px;border-bottom:1px solid #eef2f6}
.reasons div:last-child{border-bottom:0}
.reasons div.ok{background:#eefaf4}
.reasons b{color:var(--muted)}
.reasons div.ok b{color:#1f7a57}
.reasons .why{color:var(--ink2)}
.pearl{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:10px;padding:14px 16px;font-size:15px}
.pearl strong{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#085454;margin-bottom:4px}
.summ{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--sky2)}
.summ h4{font-size:16px;margin-bottom:10px}
.summ table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:8px;overflow:hidden}
.summ th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
.summ td{padding:8px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}
.summ .tblwrap{overflow-x:auto}
.summ .blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.summ .blk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.summ .blk b{display:block;margin-bottom:4px}
.summ .blk .tk{margin-top:6px;font-weight:600;color:var(--teal)}
.summ .bottom{margin-top:10px;font-weight:600;font-size:14px}
.refs{font-size:12px;color:var(--muted)}

/* navigator */
.nav{position:fixed;inset:0;z-index:50;background:rgba(8,16,30,.45);display:flex;justify-content:flex-end}
.nav .panel{width:min(360px,92vw);height:100%;background:#fff;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
/* always-on question list (left rail) */
:root{--railw:78px}
.qrail{position:fixed;left:0;top:var(--pbarh,56px);bottom:var(--footh,36px);width:var(--railw);z-index:20;background:#fff;border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;padding:10px 8px 14px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.qrail button{flex:none;display:flex;align-items:center;justify-content:center;gap:5px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--navy);position:relative;font-variant-numeric:tabular-nums;padding:0}
.qrail button i{font-style:normal;font-size:11px;font-weight:800;line-height:1}
.qrail button.ans{background:var(--sky);border-color:#bcd3ea}
.qrail button.sk{background:#eef1f5;border-style:dashed;border-color:#aab6c4;color:var(--muted)}
.qrail button.ok{background:#e3f6ec;border-color:#9fd8bb;color:#1f7a57}
.qrail button.no{background:var(--coral-soft);border-color:#efc2b7;color:var(--coral)}
.qrail button.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.qrail button.cur{outline:2.5px solid var(--navy);outline-offset:1px;z-index:1}
.pmain{padding-left:var(--railw)}
.qshort{display:none}
@media (max-width:480px){.qlong,.pbar .qpos small{display:none}.qshort{display:inline}.pbar .wrap{gap:6px;padding-left:12px;padding-right:12px}.tbtn{padding:7px 9px}.clock{padding:7px 8px}}
@media (max-width:640px){:root{--railw:46px}.qrail{padding:8px 5px 12px;gap:5px}.qrail button{height:32px;font-size:12px;border-radius:8px}.qrail button i{display:none}}
body.dark .qrail{background:#0e1828;border-color:#2a3d58}
body.dark .qrail button{background:#16253b;color:#e4ecf5;border-color:#2a3d58}
body.dark .qrail button.ans{background:#1d3553}
body.dark .qrail button.sk{background:#121d2e;color:#8fa3bb;border-color:#3a4f6b}
body.dark .qrail button.ok{background:#123426;color:#7fdcb0;border-color:#24563f}
body.dark .qrail button.no{background:#3a1c18;color:#f19a88;border-color:#5e2e26}
body.dark .qrail button.cur{outline-color:#9fc3ea}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.navgrid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;position:relative}
.navgrid button.ans{background:var(--sky);border-color:#bcd3ea}
.navgrid button.cur{outline:2px solid var(--navy);outline-offset:1px}
.navgrid button.ok{background:#e3f6ec;border-color:#9fd8bb;color:#1f7a57}
.navgrid button.no{background:var(--coral-soft);border-color:#efc2b7;color:var(--coral)}
.navgrid button.sk{background:#eef1f5;border-style:dashed;border-color:#aab6c4;color:var(--muted)}
.navgrid button.fl::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* calculator */
.calc{position:fixed;right:18px;bottom:54px;z-index:60;width:248px;background:#152f52;border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.35);color:#fff;user-select:none;touch-action:none}
.calc .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px;cursor:move;font-size:13px;font-weight:600;opacity:.85}
.calc .hd button{background:none;border:0;color:#fff;font-size:18px;line-height:1;padding:2px 6px}
.calc .scr{margin:4px 12px 10px;background:#0b2545;border-radius:10px;padding:10px 12px;text-align:right;min-height:64px}
.calc .scr small{display:block;font-size:12px;opacity:.6;min-height:16px;font-variant-numeric:tabular-nums}
.calc .scr b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}
.calc .keys button{border:0;border-radius:9px;padding:11px 0;font-size:16px;font-weight:600;background:#244873;color:#fff}
.calc .keys button.op{background:var(--teal)}
.calc .keys button.fn{background:#36577f}
.calc .keys button.eq{background:var(--teal-bright);color:var(--navy)}
.calc .keys button:active{filter:brightness(1.2)}

/* modal + lightbox */
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,16,30,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:21px}
.modal p{margin:0;color:var(--muted)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(5,12,24,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}

/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:30px}
.ring span{background:#fff;width:94px;height:94px;border-radius:50%;display:grid;place-items:center}
.res-list{display:flex;flex-direction:column}
.res-list button{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-bottom:1px solid #eef2f6;background:none;text-align:left;font-size:14px}
.res-list button:hover{background:var(--sky2)}
.res-list .n{width:30px;font-weight:700;color:var(--muted)}
.res-list .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-list .r{font-weight:700;font-size:12px;width:76px;text-align:right}
.res-list .r.ok{color:#1f7a57}.res-list .r.no{color:var(--coral)}.res-list .r.om{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:95;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.spin{width:28px;height:28px;border:3px solid #d6e0ea;border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:12px}
  .stat b{font-size:22px}
  .reasons div{grid-template-columns:24px 1fr}
  .reasons .why{grid-column:2}
  .pbar .lbl{display:none}
  .choice .cb{width:46px}
}
@media (max-width:760px){
  .sitefoot{font-size:12px}
  .sitefoot .sep{display:none}
  .sitefoot a{display:block}
}
@media (max-width:480px){
  .who .email{display:none}
  .stem{font-size:16px}
  .calc{right:10px;bottom:80px;width:min(248px,calc(100vw - 20px))}
}

/* results list never pushes the page wider */
.grid2>*{min-width:0}
.res-list button{width:100%}

/* side-by-side explanation */
.playwrap{position:relative}
.playwrap.split{max-width:1440px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
.split .side{position:sticky;top:72px;max-height:calc(100vh - 92px);overflow:auto;border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--sky2)}
.split .side .exp{margin-top:0;border-top:0;padding-top:0}
.side-empty{color:var(--muted);font-size:15px;text-align:center;padding:40px 10px;margin:0}

/* email watermark (anti-piracy) */
.wm{position:absolute;inset:0;pointer-events:none;user-select:none;z-index:5;background-repeat:repeat}
@media print{body>*{display:none!important}body::after{content:"Printing is turned off for the Boardside Reviews Question Bank.";display:block;padding:40px;font:16px Inter,sans-serif}}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row b{display:block;font-size:15px}
.set-row small{color:var(--muted);font-size:13px}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--teal);outline-offset:2px}
.switch{position:relative;width:46px;height:26px;border-radius:13px;border:0;background:#c9d5e2;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{left:23px}
.modal .seg button{padding:7px 12px}

/* night mode */
body.dark,body.dark.playing{background:#0e1828;color:#e4ecf5}

    done() ? null : h("button", { class: "btn ghost", onclick: async function () { back.remove(); stopClock(); markDirty(cur(), true); await flush(); showHome(); } }, "Save and exit")
  ]));
  document.body.appendChild(back);
}

// results

  });
  screen([header(), h("main", { class: "wrap page" }, h("div", { class: "stack" }, [

      h("div", null, [h("h1", { style: "font-size:28px" }, c + " of " + n + " correct"),
        h("p", { class: "muted", style: "margin:6px 0 14px" }, (b.mode === "learning" ? "Learning mode" : "Exam mode") +
          (b.timed ? " · timed" : "") + " · time used " + fmtTime(b.elapsed_sec)),
        h("div", { class: "actions" }, [h("button", { class: "btn teal", onclick: function () { P.i = 0; renderPlayer(); } }, "Review questions"),
          h("button", { class: "btn ghost", onclick: showHome }, "Back to home")])])
    ]),
    h("div", { class: "grid2" }, [
      h("section", { class: "card" }, [h("div", { class: "sec-h" }, h("h2", null, "Every question")), list]),
      h("section", { class: "card" }, [h("div", { class: "sec-h" }, h("h2", null, "By subject")), subjT])

}

// ───────────────────────── calculator ─────────────────────────
var C = { disp: "0", acc: null, op: null, fresh: true, expr: "" };
function toggleCalc() { P.calc = !P.calc; renderPlayer(true); }
function calcFmt(x) {
  if (!isFinite(x)) return "Error";
  var s = String(parseFloat(x.toPrecision(12)));
  return s.length > 14 ? x.toExponential(6) : s;
}
function calcApply(a, op, b) { return op === "+" ? a + b : op === "−" ? a - b : op === "×" ? a * b : op === "÷" ? a / b : b; }
function calcKey(k) {
  var cur = parseFloat(C.disp);
  if (/^[0-9]$/.test(k)) { if (C.fresh || C.disp === "0" || C.disp === "Error") { C.disp = k; C.fresh = false; } else if (C.disp.length < 14) C.disp += k; }
  else if (k === ".") { if (C.fresh || C.disp === "Error") { C.disp = "0."; C.fresh = false; } else if (C.disp.indexOf(".") < 0) C.disp += "."; }
  else if (k === "C") { C = { disp: "0", acc: null, op: null, fresh: true, expr: "" }; }
  else if (k === "⌫") { if (!C.fresh) C.disp = C.disp.length > 1 ? C.disp.slice(0, -1) : "0"; }
  else if (k === "±") { if (C.disp !== "0" && C.disp !== "Error") C.disp = C.disp[0] === "-" ? C.disp.slice(1) : "-" + C.disp; }
  else if (k === "%") { C.disp = calcFmt(C.acc != null && (C.op === "+" || C.op === "−") ? C.acc * cur / 100 : cur / 100); C.fresh = true; }
  else if (k === "√") { C.expr = "√(" + C.disp + ")"; C.disp = calcFmt(Math.sqrt(cur)); C.fresh = true; }
  else if (k === "x²") { C.expr = "(" + C.disp + ")²"; C.disp = calcFmt(cur * cur); C.fresh = true; }
  else if ("+−×÷".indexOf(k) >= 0) {
    if (C.acc != null && C.op && !C.fresh) C.acc = calcApply(C.acc, C.op, cur); else if (C.acc == null || !C.op || !C.fresh) C.acc = cur;
    C.op = k; C.fresh = true; C.expr = calcFmt(C.acc) + " " + k; C.disp = calcFmt(C.acc);
  }
  else if (k === "=") {
    if (C.op != null && C.acc != null) { C.expr = calcFmt(C.acc) + " " + C.op + " " + C.disp + " ="; C.disp = calcFmt(calcApply(C.acc, C.op, cur)); C.acc = null; C.op = null; C.fresh = true; }
  }
  var d = $("#calc-d"), e = $("#calc-e"); if (d) d.textContent = C.disp; if (e) e.textContent = C.expr;
}
var calcPos = null;
function mountCalc() {
  var keys = ["C", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "√", "0", ".", "=", "x²", "⌫"];
  var box = h("div", { class: "calc", role: "dialog", "aria-label": "Calculator" }, [
    h("div", { class: "hd" }, [h("span", null, "Calculator"), h("button", { "aria-label": "Close calculator", onclick: toggleCalc }, "×")]),
    h("div", { class: "scr" }, [h("small", { id: "calc-e" }, C.expr), h("b", { id: "calc-d" }, C.disp)]),
    h("div", { class: "keys" }, keys.map(function (k) {
      var cls = "+−×÷".indexOf(k) >= 0 ? "op" : k === "=" ? "eq" : /^[0-9.]$/.test(k) ? "" : "fn";
      return h("button", { class: cls, onclick: function () { calcKey(k); }, style: k === "x²" ? "grid-column:span 2" : k === "⌫" ? "grid-column:span 2" : null }, k);
    }))
  ]);
  if (calcPos) { box.style.left = calcPos[0] + "px"; box.style.top = calcPos[1] + "px"; box.style.right = "auto"; box.style.bottom = "auto"; }
  var hd = box.firstChild, drag = null;
  hd.addEventListener("pointerdown", function (e) {
    if (e.target.tagName === "BUTTON") return;
    var r = box.getBoundingClientRect(); drag = [e.clientX - r.left, e.clientY - r.top]; hd.setPointerCapture(e.pointerId);
  });
  hd.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var x = Math.min(Math.max(0, e.clientX - drag[0]), innerWidth - box.offsetWidth), y = Math.min(Math.max(0, e.clientY - drag[1]), innerHeight - box.offsetHeight);
    calcPos = [x, y]; box.style.left = x + "px"; box.style.top = y + "px"; box.style.right = "auto"; box.style.bottom = "auto";
  });
  hd.addEventListener("pointerup", function () { drag = null; });
  document.body.appendChild(box);
}

// keyboard: A–E choose, ←/→ move, digits go to the calculator when it's open
document.addEventListener("keydown", function (e) {
  if (!P || !$(".playwrap") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || $(".modal")) return;
  var k = e.key;
  if (P.calc) {
    var map = { "*": "×", "x": "×", "/": "÷", "-": "−", "+": "+", "Enter": "=", "=": "=", "Backspace": "⌫", "Escape": "C", "%": "%", ".": "." };
    if (/^[0-9]$/.test(k) || map[k]) { e.preventDefault(); calcKey(map[k] || k); return; }
  }
  var q = cur(), locked = done() || (P.b.mode === "learning" && q.response.submitted);
  if (/^[a-eA-E]$/.test(k) && !locked) { e.preventDefault(); select(q, k.toUpperCase()); }
  else if (k === "ArrowRight") go(P.i + 1);
  else if (k === "ArrowLeft") go(P.i - 1);
});

function showSampleHome() {
  stopClock(); P = null;
  var st = sState(), answered = Object.keys(st.resp).filter(function (k) { return st.resp[k].submitted; }).length;
  var n = SD.questions.length, started = answered > 0 || st.idx > 0, finished = st.status === "completed";
  var subj = {}; SD.questions.forEach(function (q) { subj[q.subject] = 1; });
  screen([header(), h("main", { class: "wrap page" }, h("div", { class: "stack" }, [
    h("section", { class: "card" }, [
      h("p", { class: "eyebrow", style: "margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--teal)" }, "FREE SAMPLE"),
      h("h1", null, n + " questions, the real interface."),
      h("p", { class: "muted", style: "margin:8px 0 0;max-width:720px" }, "This is the Boardside question bank, in learning mode: answer each question, then see why every choice is right or wrong, with a teaching pearl. " +
        "It's the same " + n + " questions every time, from " + Object.keys(subj).length + " subjects. No sign-up needed; your progress stays in this browser."),
      h("p", { class: "muted", style: "margin:10px 0 0;max-width:720px" }, "Highlight text, cross out choices, flag questions, use the calculator and change the settings, just like the full question bank. The full bank (about 1,000 questions) is coming soon."),
      h("div", { class: "actions", style: "margin-top:18px" }, [
        h("button", { class: "btn teal", onclick: function () { openBlock("sample"); } }, finished ? "Review your answers" : started ? "Resume (" + answered + " of " + n + " answered)" : "Start the free sample"),
        started ? h("button", { class: "btn ghost", onclick: function () { try { localStorage.removeItem(SKEY); } catch (e) {} showSampleHome(); } }, "Start over") : null,
        h("a", { class: "btn ghost", href: "https://forms.gle/9qnowgoDevR742wB7", target: "_blank", rel: "noopener" }, "Join the waitlist")
      ])
    ])
  ]))]);
}
async function boot() {
  if (SAMPLE) {
    screen([header(), h("div", { class: "spin" })]);
    try { SD = await (await fetch("qbank-sample.json", { cache: "no-cache" })).json(); }
    catch (e) { screen([header(), h("main", { class: "wrap page" }, h("div", { class: "card" }, "Couldn't load the sample. Please reload the page."))]); return; }
    return showSampleHome();
  }
  var s = await sb.auth.getSession();
  var user = s.data && s.data.session && s.data.session.user;
  if (!user) return showLogin();
  S.email = (user.email || "").toLowerCase();
  if (!allowed(S.email)) return showNotOpen();
  try { S.me = await rpc("qb_me"); } catch (e) { if (!/not_signed_in|JWT/i.test(e.message || "")) homeError(e); return; }
  if (!S.me.access) return showLocked();
  showHome();
}
boot();
})();
