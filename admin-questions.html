<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<title>Question editor | Boardside Reviews</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--navy:#0b2545;--teal:#0d7070;--teal-bright:#3cc4b4;--teal-soft:#e2f3f1;--coral:#b9432c;--coral-soft:#fdece7;--ink2:#33465f;--muted:#52627a;--line:#dce3ea;--sky:#eef5fc;--sky2:#f5f9fd;--amber:#f0b54a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid #e3ebf3;background:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px}
.brand svg{width:40px;height:40px;display:block}
header nav{display:flex;gap:18px;font-size:15px;font-weight:500}
header nav a{text-decoration:none;color:var(--ink2)}
header nav a:hover{color:var(--teal)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--teal)}
h1{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.03em}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;text-decoration:none}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid #b9d9d6}
.btn.danger{background:#fff;color:var(--coral);border:1px solid #efc2b7}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:600}
footer{border-top:1px solid #e3ebf3;margin-top:64px}
footer .wrap{padding-block:24px;font-size:13px;color:var(--muted)}
@media (max-width:560px){header nav{gap:12px;font-size:14px}.brand span{display:none}}

main .wrap{padding-block:36px;display:flex;flex-direction:column;gap:28px}
h1{font-size:clamp(32px,5vw,44px)}
h2{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:22px}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=search],input[type=text]{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #c9d5e2;border-radius:10px;min-width:0;flex:1 1 220px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:10px 12px;background:var(--sky2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eef2f6;vertical-align:top}
tr:last-child td{border-bottom:0}
td.acts{white-space:nowrap}
td.acts .btn{padding:7px 10px;font-size:13px;margin:2px 4px 2px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:999px}
.p-ban{background:var(--coral-soft);color:var(--coral)}.p-noname{background:#fff4dc;color:#7a5200}
.muted{color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.word.any{border-color:#efc2b7;background:var(--coral-soft)}
.word button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.word button:hover{color:var(--coral)}
.confirm{background:var(--coral-soft);border:1px solid #efc2b7;border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink2)}
.fld input,.fld textarea{font:inherit;font-weight:400;font-size:15px;padding:10px 12px;border:1px solid #c9d5e2;border-radius:10px;color:var(--navy);width:100%;box-sizing:border-box}
.fld textarea{resize:vertical;line-height:1.55;min-height:180px}
.mlframe{width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#eef5fc}
.warn{background:#fff4dc;border:1px solid #f0d9a6;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink2)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#1f9a8f;display:inline-block}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--sky);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--teal);border-radius:6px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.others{font-size:13px;color:var(--muted);margin:4px 0 0}

/* question editor */
main .wrap{max-width:1240px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c9d5e2;border-radius:10px;background:#fff;color:var(--navy);min-width:0}
.filters input{flex:1 1 200px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stat b{font-size:20px;font-family:'Plus Jakarta Sans',sans-serif;margin-right:6px}
.stat span{font-size:13px;color:var(--muted)}
.q{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qh h3{margin:0;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.qh h3 small{font-weight:400;color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}.cols>div{min-width:0;display:flex;flex-direction:column;gap:8px}
.cols h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.cols p{margin:0;line-height:1.6;font-size:15px}
.ask{font-weight:700}
.ch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ch li{border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14.5px}
.ch li.key{border-color:#7cc7bf;background:var(--teal-soft)}
.ch b{color:var(--muted);margin-right:6px}
.qres{overflow-x:auto}.qres table{max-width:520px;font-size:14.5px}
.qres th{background:none;letter-spacing:0;font-size:12.5px;color:var(--navy);padding:10px 0 4px;white-space:normal;border-bottom:1px solid var(--line)}
.qres tr:first-child th{padding-top:0}
.qres td{padding:5px 0;border-bottom:1px solid #e6edf4}.qres td.v{text-align:right;padding-left:18px}.qres .nt{color:var(--muted);font-size:.92em}
figure.img{margin:0}figure.img img{max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line)}
figure.img figcaption{font-size:12px;color:var(--muted)}
.why{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
details.dd summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:14px}
details.dd p{margin:6px 0 0;font-size:14px}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.rc.high{border-left:5px solid var(--coral)}.rc.med{border-left:5px solid var(--amber)}.rc.low{border-left:5px solid #9fb0c6}
.rc .rh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pri{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pri.high{background:var(--coral-soft);color:var(--coral)}.pri.med{background:#fff4dc;color:#7a5200}.pri.low{background:#eef2f6;color:#52627a}
.rc p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.rc .sg{background:var(--sky2);border-radius:8px;padding:8px 10px}
.rc textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c9d5e2;border-radius:8px;min-height:64px;resize:vertical;width:100%;box-sizing:border-box}
.rc .rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcs{display:flex;flex-direction:column;gap:10px}
.rcs h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
.tag.rcn{background:var(--coral-soft);color:var(--coral)}
.rc label.yl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--teal)}
.rc.you{background:var(--teal-soft)}
.rc.add{border-style:dashed;background:#fbfdff}
.rc.add select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid #c9d5e2;border-radius:8px}
.btn.on.bad{background:var(--coral);border-color:var(--coral);color:#fff}
.pearl b.cz{background:#d6efec;border-radius:3px;padding:0 3px}
.pearl{background:var(--sky2);border-left:3px solid var(--teal);padding:8px 12px;border-radius:6px;font-size:14.5px}
.refs{font-size:13.5px;color:var(--ink2);white-space:pre-line}
.refs a{color:var(--teal)}
.summ{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.summ h5{margin:0 0 6px;font-size:14px}.summ table{font-size:13px}.summ th{white-space:normal;padding:6px 8px}.summ td{padding:6px 8px}
.blk{border-top:1px solid #eef2f6;padding:5px 0}.blk .tk{color:var(--teal);font-weight:600}
.box{background:#fff4dc;color:#6b4a0c;border-radius:10px;padding:8px 12px;font-size:13.5px}.box ul{margin:4px 0 0;padding-left:18px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--sky);color:var(--ink2)}
.tag.decide,.tag.change{background:var(--coral-soft);color:var(--coral)}.tag.ok{background:var(--teal-soft);color:var(--teal)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn.sm{padding:7px 12px;font-size:13px}.btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
/* edit form */
.ef{display:flex;flex-direction:column;gap:10px}
.ef label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
.ef textarea,.ef input[type=text],.ef select{font:inherit;font-weight:400;font-size:14.5px;padding:8px 10px;border:1px solid #c9d5e2;border-radius:8px;color:var(--navy);width:100%;box-sizing:border-box;background:#fff}
.ef input[type=text]{flex:none}
.ef textarea{resize:vertical;line-height:1.5;min-height:70px}
.ef .tall{min-height:150px}
.grid{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px}
.gsec{display:flex;flex-direction:column;gap:5px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.gsec:last-of-type{border-bottom:0}
.grow{display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;align-items:center}
.grow.c3{grid-template-columns:1fr 1fr 1fr 28px}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0}.x:hover{color:var(--coral)}
.add{background:none;border:0;color:var(--teal);font-weight:600;font-size:13px;padding:2px 0;text-align:left}
.chrow{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start}.chrow b{padding-top:9px;color:var(--muted)}
.save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;z-index:3}
.imgedit{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.imgedit img{max-width:180px;max-height:140px;border-radius:8px;border:1px solid var(--line)}
.more{align-self:center}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
</style>

<body>
<header><div class="wrap">
<a class="brand" href="/" aria-label="Boardside Reviews home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boardside Reviews mark"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#0B2545" stroke-width="7"/><path fill="#0B2545" d="M35.326,27.0 H51.38 A11.5,11.5 0 0 1 51.38,50 H43.008 V73.0 H35.326 Q34.59,73.0 34.59,72.264 V27.736 Q34.59,27.0 35.326,27.0 Z"/><path fill="#0D7070" d="M43.008,50 H53.91 A11.5,11.5 0 0 1 53.91,73.0 H43.008 Z"/></svg><span>Boardside Reviews<sup style="font-size:.5em;font-weight:600;vertical-align:super;line-height:0;margin-left:1px">&trade;</sup></span></a>
<nav><a href="admin.html">Admin</a></nav>
</div></header>
<main><div class="wrap" id="app"><div class="card"><b>Loading…</b></div></div></main>
<script>
// Question editor (admin only). Question on the left, explanation on the right. Edit → Save → confirm writes
// straight to the live question bank; every save keeps the previous version in qb_question_edits.
// No question text lives in this file: everything is read and written through admin-only database functions.
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L5=["A","B","C","D","E"];
const STATUS={todo:"Not marked",ok:"Good",change:"Bad"};
const SECTIONS=["Laboratory studies","Urinalysis","Arterial blood gas","Venous blood gas","Pulmonary function testing","Cerebrospinal fluid","Pleural fluid","Synovial fluid","Ascitic fluid","Hemodynamic measurements","Ventilator settings","24-hour urine collection","Microbiology","Study results"];
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
let RC={},RCX={},index=[],rows=[],shown=20,F={tag:"rc",subject:"",status:"",q:""},editing=null,imgCache={};
try{const s=JSON.parse(localStorage.getItem("bsr-qed-f")||"null");if(s)F=Object.assign(F,s)}catch(e){}
const saveF=()=>{try{localStorage.setItem("bsr-qed-f",JSON.stringify(F))}catch(e){}};

async function boot(){
  const app=$("#app");
  if(!BLB.enabled){app.innerHTML=`<h1>Question editor</h1><div class="card">Not connected.</div>`;return}
  const u=await BLB.user();
  if(!u){app.innerHTML=`<h1>Question editor</h1><div class="card"><span>Sign in with your admin email.</span><div><button class="btn" data-a="in">Sign in</button></div></div>`;return}
  let ok=false;try{ok=await BLB.rpc("is_admin")}catch(e){}
  if(!ok){app.innerHTML=`<h1>Question editor</h1><div class="card"><span>${esc(u.email)} doesn't have admin access.</span></div>`;return}
  try{index=await BLB.rpc("admin_q_index")||[]}catch(x){app.innerHTML=`<h1>Question editor</h1><div class="card">${esc(BLB.friendly(x))}</div>`;return}
  await loadRCX();
  const subs=[...new Set(index.map(r=>r.subject))].sort();
  app.innerHTML=`<div class="row"><h1>Question editor</h1><span class="acts"><button class="btn" data-new>+ New question</button><a class="linkbtn" href="admin.html">← Admin</a></span></div>
  <p class="muted" style="margin:0;max-width:78ch">Go through the audit comments by priority. Write your own comment under any of mine, or add one to any question, then send me the QID and I make the change. Mark each question <b>Good</b> or <b>Bad</b>; tap it again to clear. <b>Edit</b> still lets you change anything yourself.</p>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <select id="ft" aria-label="Show"><option value="rc">All comments (high first)</option><option value="rc-high">High</option><option value="rc-med">Medium</option><option value="rc-low">Low</option><option value="ok">Marked Good</option><option value="change">Marked Bad</option><option value="todo">Not marked yet</option><option value="">All questions</option><option value="removed">Removed questions</option></select>
    <select id="fs" aria-label="Subject"><option value="">All subjects</option>${subs.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
    <input type="search" id="fq" placeholder="Find an ID (Pulm-1-09) or QID (849)" aria-label="Find a question">
    <span class="muted" id="cnt"></span>
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:16px"></div>`;
  if(![...$("#ft").options].some(o=>o.value===F.tag))F.tag="rc";$("#ft").value=F.tag;$("#fs").value=F.subject;$("#fq").value=F.q;
  $("#ft").onchange=e=>{F.tag=e.target.value;go()};$("#fs").onchange=e=>{F.subject=e.target.value;go()};
  let tm;$("#fq").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{F.q=e.target.value.trim();go()},250)};
  stats();go();
}
function stats(){
  const n=f=>index.filter(f).length;
  $("#stats").innerHTML=[[n(r=>r.active!==false&&rcN(r.id,"high")),"high"],[n(r=>r.active!==false&&rcN(r.id,"med")),"medium"],[n(r=>r.active!==false&&rcN(r.id,"low")),"low"],[n(r=>r.status==="ok"),"good"],[n(r=>r.status==="change"),"bad"]]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}
function match(r){
  const t=F.tag;
  if(t==="removed")return r.active===false;
  if(r.active===false)return false;
  if(["ok","change","todo"].includes(t)&&(r.status||"todo")!==t)return false;
  if(t==="rc"&&!rcN(r.id))return false;
  if(t==="rc-high"&&!rcN(r.id,"high"))return false;
  if(t==="rc-med"&&!rcN(r.id,"med"))return false;
  if(t==="rc-low"&&!rcN(r.id,"low"))return false;
  if(F.subject&&r.subject!==F.subject)return false;
  if(F.q){const q=F.q.toLowerCase();if(!(r.id.toLowerCase().includes(q)||String(r.num)===q))return false}
  return true;
}
async function go(){
  if(editing&&!confirmLeave())return;
  saveF();shown=20;editing=null;
  let ids=index.filter(match).map(r=>r.id);
  if(F.tag.startsWith("rc"))ids.sort((a,b)=>rcRank(b)-rcRank(a));
  $("#cnt").textContent=ids.length+" shown";
  rows=ids.map(id=>({id,_stub:true}));
  await loadMore();
}
async function loadMore(){
  const need=rows.slice(0,shown).filter(r=>r._stub).map(r=>r.id);
  if(need.length){
    $("#list").innerHTML=rows.length?`<div class="card muted">Loading…</div>`:`<div class="card muted">Nothing matches.</div>`;
    try{const got=await BLB.rpc("admin_q_rows",{p_ids:need})||[];const m=new Map(got.map(g=>[g.id,g]));rows=rows.map(r=>m.get(r.id)||r);await loadRC(need)}

  if(!PREFIXES){try{PREFIXES=await BLB.rpc("admin_q_prefixes")||[]}catch(x){toast(BLB.friendly(x));return}}
  const first=PREFIXES.find(p=>p.subject===F.subject)||PREFIXES[0];
  editing={id:"__new",isNew:true,subject:first.subject,prefix:first.prefix,answer:"A",updated_at:null,img:null,imgRemove:false,
    orig:{num:"",subject:first.subject,has_image:false,body:{},explain:{}},
    body:{stem:"",exam:"",tests:[],notes:[],ask:"Which of the following is the most appropriate next step in management?",choices:{A:"",B:"",C:"",D:"",E:""}},
    explain:{explanation:"",reasons:{},details:{},pearl:"",references:"",summaries:[],ref_links:[]}};
  draw();window.scrollTo({top:$("#list").offsetTop-20,behavior:"smooth"});
}
function newSubjectPicker(E){
  return `<label style="font-size:13px;font-weight:600;color:var(--ink2)">Subject <select data-newsubj style="font:inherit;padding:6px 8px;border:1px solid #c9d5e2;border-radius:8px">${PREFIXES.map(p=>{const multi=PREFIXES.filter(x=>x.subject===p.subject).length>1;return`<option value="${esc(p.subject+"||"+p.prefix)}" ${p.subject===E.subject&&p.prefix===E.prefix?"selected":""}>${esc(p.subject)}${multi?" ("+esc(p.prefix)+")":""}</option>`}).join("")}</select></label><span class="muted" style="font-size:13px">It gets the next ID and QID in that subject when you save.</span>`;
}
function confirmLeave(){return confirmLeave.ok||(toast("Save or cancel the question you're editing first."),false)}
async function doSave(){
  const E=editing;$("#econfirm").innerHTML=`<span class="muted">Saving…</span>`;
  try{
    const body=Object.assign({},E.body);delete body.data;const ex=Object.assign({},E.explain);if(!(ex.ref_links||[]).length&&!(E.orig.explain||{}).ref_links)delete ex.ref_links;
    if(E.isNew){
      const c=await BLB.rpc("admin_q_create",{p_subject:E.subject,p_prefix:E.prefix,p_body:body,p_answer:E.answer,p_explain:ex});
      if(E.img)await BLB.rpc("admin_q_set_image",{p_id:c.id,p_mime:E.img.mime,p_data:E.img.data});
      if(E.img)imgCache[c.id]=E.img.src;
      editing=null;index=await BLB.rpc("admin_q_index")||[];F.q=c.id;F.tag="";F.subject="";saveF();
      $("#fq").value=c.id;$("#ft").value="";$("#fs").value="";stats();await go();toast(c.id+" (QID "+c.num+") added. It's live now.");return}
    const r=await BLB.rpc("admin_q_save",{p_id:E.id,p_body:body,p_answer:E.answer,p_explain:ex,p_expected:E.updated_at});
    if(E.img)await BLB.rpc("admin_q_set_image",{p_id:E.id,p_mime:E.img.mime,p_data:E.img.data});
    if(E.imgRemove)await BLB.rpc("admin_q_set_image",{p_id:E.id,p_mime:null,p_data:null});
    if(E.img)imgCache[E.id]=E.img.src;if(E.imgRemove)delete imgCache[E.id];
    const fresh=(await BLB.rpc("admin_q_rows",{p_ids:[E.id]}))[0];
    rows=rows.map(x=>x.id===E.id?fresh:x);const ix=index.find(x=>x.id===E.id);if(ix){ix.edits=fresh.edits;ix.has_image=fresh.has_image}
    editing=null;draw();stats();toast(E.id+" saved. It's live now.");
  }catch(x){
    const m=String(x&&x.message||x);
    $("#econfirm").innerHTML=`<div class="warn">${m.includes("changed_elsewhere")?"This question was changed somewhere else since you opened it. Cancel, reopen it and make your change again.":esc(BLB.friendly(x))}</div>`;
  }
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.a==="in"){await BLB.dialog({title:"Admin sign-in",intro:"Enter your admin email. We'll send a 6-digit code."});boot();return}
  if(b.hasAttribute("data-more")){shown+=20;await loadMore();return}
  const sec=b.closest(".q"),id=sec&&sec.dataset.id,r=id&&rows.find(x=>x.id===id);
  if(b.hasAttribute("data-new")){if(editing){toast("Save or cancel the question you're editing first.");return}await startNew();return}
  if(b.hasAttribute("data-remove")){const c=sec.querySelector("[data-rmconfirm]");
    c.innerHTML=r.in_free?`<div class="warn">This question is one of the free sample questions, so it can't be removed. Swap it out of the free set first.</div>`:
    `<div class="warn" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span>Remove <b>${esc(id)}</b> from the bank? Learners stop seeing it right away. It isn't deleted: you can put it back from “Removed from the bank”.</span><span><button class="btn sm danger" data-rmgo>Remove</button> <button class="btn sm ghost" data-rmno>Keep it</button></span></div>`;return}
  if(b.hasAttribute("data-rmno")){sec.querySelector("[data-rmconfirm]").innerHTML="";return}
  if(b.hasAttribute("data-rmgo")||b.hasAttribute("data-restore")){const on=b.hasAttribute("data-restore");
    try{await BLB.rpc("admin_q_set_active",{p_id:id,p_active:on});const ix=index.find(x=>x.id===id);if(ix)ix.active=on;r.active=on;
      rows=rows.filter(x=>x.id!==id||match(x));draw();stats();toast(on?id+" is back in the bank.":id+" removed. Find it under “Removed from the bank”.")}
    catch(x){toast(String(x&&x.message||x).includes("in_free_set")?"It's a free sample question, so it can't be removed.":BLB.friendly(x))}return}
  if(b.hasAttribute("data-edit")){if(editing&&editing.id!==id){toast("Save or cancel the question you're editing first.");return}startEdit(r);return}
  if(b.dataset.mark){const st=r.status===b.dataset.mark?"todo":b.dataset.mark;
    try{await BLB.rpc("admin_q_mark",{p_id:id,p_status:st});r.status=st;const ix=index.find(x=>x.id===id);if(ix)ix.status=st;draw();stats();toast(id+": "+(st==="todo"?"mark cleared":STATUS[st]))}catch(x){toast(BLB.friendly(x))}return}
  if(b.dataset.rcsend){const cid=+b.dataset.rcsend,ta=document.querySelector(`[data-rcreply="${cid}"]`),txt=(ta?ta.value:"").trim();
    b.disabled=true;try{const c=await BLB.rpc("admin_rc_reply",{p_id:cid,p_reply:txt});for(const k in RC){RC[k]=RC[k].map(x=>x.id===cid?c:x)}await loadRCX();stats();draw();toast(txt?"Comment saved for "+id+".":"Comment cleared.")}catch(x){b.disabled=false;toast(BLB.friendly(x))}return}
  if(b.dataset.mysave){const cid=+b.dataset.mysave,ta=document.querySelector(`[data-myedit="${cid}"]`),txt=(ta?ta.value:"").trim();
    b.disabled=true;try{const c=await BLB.rpc("admin_rc_edit",{p_id:cid,p_comment:txt});for(const k in RC){RC[k]=c.deleted?RC[k].filter(x=>x.id!==cid):RC[k].map(x=>x.id===cid?c:x)}await loadRCX();stats();draw();toast(c.deleted?"Comment deleted.":"Comment saved for "+id+".")}catch(x){b.disabled=false;toast(BLB.friendly(x))}return}
  if(b.dataset.mydel){const cid=+b.dataset.mydel;try{await BLB.rpc("admin_rc_edit",{p_id:cid,p_comment:""});for(const k in RC){RC[k]=RC[k].filter(x=>x.id!==cid)}await loadRCX();stats();draw();toast("Comment deleted.")}catch(x){toast(BLB.friendly(x))}return}
  if(b.hasAttribute("data-myadd")){const box=sec.querySelector("[data-mynew]"),txt=box.value.trim(),pr=sec.querySelector("[data-mypri]").value;
    if(!txt){toast("Write your comment first.");return}
    b.disabled=true;try{const c=await BLB.rpc("admin_rc_add",{p_question_id:id,p_priority:pr,p_comment:txt});(RC[id]=RC[id]||[]).push(c);await loadRCX();stats();draw();toast("Comment added to "+id+" (QID "+r.num+").")}catch(x){b.disabled=false;toast(BLB.friendly(x))}return}
  if(!editing)return;
  if(b.hasAttribute("data-cancel")){editing=null;draw();return}
  if(editing.isNew){const ss=document.querySelector("[data-newsubj]");if(ss){const [sj,px]=ss.value.split("||");editing.subject=sj;editing.prefix=px}}
  collect();
  const E=editing;
  if(b.hasAttribute("data-addsec")){E.body.tests.push({h:"Laboratory studies",rows:[["",""]]});draw();return}
  if(b.dataset.addrow!==undefined){E.body.tests[+b.dataset.addrow].rows.push(["",""]);draw();return}
  if(b.dataset.delsec!==undefined){E.body.tests.splice(+b.dataset.delsec,1);draw();return}
  if(b.dataset.delrow){const [s,i]=b.dataset.delrow.split(":").map(Number);E.body.tests[s].rows.splice(i,1);draw();return}
  if(b.dataset.delsum!==undefined){E.explain.summaries.splice(+b.dataset.delsum,1);draw();return}
  if(b.hasAttribute("data-imgdel")){E.img=null;E.imgRemove=!!E.orig.has_image;draw();return}
  if(b.hasAttribute("data-save")){
    const p=problems(),c=changedParts();
    if(p.length){$("#econfirm").innerHTML=`<div class="warn"><b>Fix before saving:</b><ul style="margin:4px 0 0">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;return}
    if(!c.length&&!editing.isNew){$("#econfirm").innerHTML=`<div class="warn">Nothing has changed.</div>`;return}
    if(editing.isNew){$("#econfirm").innerHTML=`<div class="warn" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span>Add this question to the live bank under <b>${esc(editing.subject)}</b>? Learners can get it right away.</span><span><button type="button" class="btn sm" data-go>Confirm and add</button> <button type="button" class="btn sm ghost" data-nogo>Keep editing</button></span></div>`;return}
    $("#econfirm").innerHTML=`<div class="warn" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span>Save to the live question bank? Changed: <b>${esc(c.join(", "))}</b>. The previous version is kept.</span><span><button type="button" class="btn sm" data-go>Confirm and save</button> <button type="button" class="btn sm ghost" data-nogo>Keep editing</button></span></div>`;return}
  if(b.hasAttribute("data-nogo")){$("#econfirm").innerHTML="";return}
  if(b.hasAttribute("data-go")){await doSave();return}
});
window.addEventListener("beforeunload",e=>{if(editing){e.preventDefault();e.returnValue=""}});
boot();
</script>
